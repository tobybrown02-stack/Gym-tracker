<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<script>
  // Theme before first paint: 'light' | 'dark' | missing (= follow the iPhone).
  window.applyTheme = function (t) {
    var root = document.documentElement;
    if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
    var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', dark ? '#0d0f14' : '#f4f2ec');
  };
  try { applyTheme((JSON.parse(localStorage.getItem('tally.v1') || '{}').settings || {}).theme); } catch (e) {}
</script>
<style>
  :root {
    --bg: #f4f2ec; --card: #ffffff; --line: #e4e0d6; --text: #16181d; --muted: #6b6f78;
    --accent: #4453c9; --accent-soft: #e6e8fb; --on-accent: #ffffff;
    --good: #0d7f57; --good-soft: #dcf3e8; --warn: #a86400; --warn-soft: #fbefd9;
    --bad: #c8304b; --bad-soft: #fbe3e7; --fun: #c2408a; --bar: #ebe7de; --shadow: 0 1px 2px rgba(20,20,30,.05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0f14; --card: #171a21; --line: #252a34; --text: #eef0f4; --muted: #8b92a1;
      --accent: #8b9bff; --accent-soft: #232946; --on-accent: #0d0f14;
      --good: #3ddc97; --good-soft: #12301f; --warn: #ffb547; --warn-soft: #33260f;
      --bad: #ff5c7a; --bad-soft: #3a1820; --fun: #ff7ab8; --bar: #242933; --shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0f14; --card: #171a21; --line: #252a34; --text: #eef0f4; --muted: #8b92a1;
    --accent: #8b9bff; --accent-soft: #232946; --on-accent: #0d0f14;
    --good: #3ddc97; --good-soft: #12301f; --warn: #ffb547; --warn-soft: #33260f;
    --bad: #ff5c7a; --bad-soft: #3a1820; --fun: #ff7ab8; --bar: #242933; --shadow: none;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  body.lock { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  input, select, textarea { font: inherit; color: inherit; }
  .num, .big { font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  .muted { color: var(--muted); }
  small { font-size: 13px; }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: #121526; display: grid; place-items: center; }
  .pnav { display: flex; align-items: center; gap: 4px; }
  .pnav .lbl { text-align: center; min-width: 118px; line-height: 1.15; }
  .pnav .lbl b { display: block; font-size: 15px; }
  .pnav .lbl small { color: var(--muted); font-size: 12px; }
  .iconbtn { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); }
  .iconbtn:disabled { opacity: .35; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 4px 8px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 span { text-transform: none; letter-spacing: 0; font-weight: 500; }

  /* Cards */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
  .pad { padding: 16px; }
  .hero { padding: 20px 18px 18px; }
  .eyebrow { font-size: 13px; color: var(--muted); font-weight: 500; }
  .big { font-size: 46px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; margin: 4px 0 12px; }
  .bar { height: 8px; background: var(--bar); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .bar > i.fun { background: var(--fun); } .bar > i.over { background: var(--bad); } .bar > i.warnb { background: var(--warn); } .bar > i.goodb { background: var(--good); }
  .bar.thin { height: 5px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .split > div { background: var(--bg); border-radius: 14px; padding: 10px 12px; }
  .split span { display: block; font-size: 13px; color: var(--muted); }
  .split b { display: block; font-size: 20px; }
  .note { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .banner { display: flex; gap: 12px; align-items: center; padding: 14px 16px; margin-top: 12px; }
  .banner .dot { width: 38px; height: 38px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .banner div { flex: 1; min-width: 0; }
  .banner b { display: block; }
  .pill { display: inline-block; padding: 7px 12px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .pill.ghost { background: var(--accent-soft); color: var(--accent); }

  /* Rows */
  .list > * + * { border-top: 1px solid var(--line); }
  .row { display: block; width: 100%; padding: 13px 16px; }
  .rowtop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 7px; }
  .rowtop .name { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rowtop .num { white-space: nowrap; font-weight: 600; }
  .rowtop .num small { color: var(--muted); font-weight: 400; }
  .rowsub { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .simple { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 16px; width: 100%; }
  .simple .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); white-space: nowrap; }
  .tag.paid { background: var(--good-soft); color: var(--good); }
  .tag.due { background: var(--warn-soft); color: var(--warn); }
  .funchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .funchips span { font-size: 12px; background: var(--bg); border-radius: 99px; padding: 3px 9px; color: var(--muted); }
  .funchips span b { color: var(--text); font-weight: 600; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(90deg); }
  .chev { transition: transform .15s; display: inline-block; color: var(--muted); }

  /* Transactions */
  .tx { display: flex; align-items: center; gap: 12px; padding: 11px 16px; width: 100%; }
  .av { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; background: var(--accent-soft); color: var(--accent); }
  .av.fun { background: color-mix(in srgb, var(--fun) 16%, transparent); color: var(--fun); }
  .av.sinking { background: var(--warn-soft); color: var(--warn); }
  .av.fixed { background: var(--bar); color: var(--muted); }
  .av.savings, .av.income { background: var(--good-soft); color: var(--good); }
  .av.unsorted { background: var(--bad-soft); color: var(--bad); }
  .tx .mid { flex: 1; min-width: 0; }
  .tx .mid b { display: block; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx .mid small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx .amt { font-weight: 600; white-space: nowrap; }
  .dayhead { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 14px 6px 6px; font-weight: 500; }
  .search { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 16px; }
  .seg { display: flex; background: var(--bar); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; text-align: center; padding: 8px 6px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .empty { text-align: center; padding: 28px 16px; color: var(--muted); }

  /* Nav */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; }
  nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--muted); padding: 4px 0; }
  nav.tabs button.on { color: var(--accent); }
  nav.tabs .add { justify-self: center; width: 54px; height: 54px; border-radius: 18px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
  svg.i { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* Sheets */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: none; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; display: none;
    max-height: calc(100% - env(safe-area-inset-top) - 24px); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    background: var(--bg); border-radius: 22px 22px 0 0; padding: 0 0 calc(24px + env(safe-area-inset-bottom));
  }
  .sheet .in { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  .open .scrim, .open .sheet { display: block; }
  .sheethead { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; }
  .sheethead b { font-size: 17px; }
  .sheethead .link { color: var(--accent); font-weight: 600; min-width: 60px; }
  .sheethead .link:last-child { text-align: right; }
  .amtbox { display: flex; align-items: baseline; justify-content: center; gap: 4px; padding: 14px 0 8px; }
  .amtbox span { font-size: 34px; color: var(--muted); font-weight: 600; }
  .amtbox input { width: 5.2ch; font-size: 50px; font-weight: 700; border: 0; background: none; outline: none; text-align: left; padding: 0; }
  .field { display: block; width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 16px; margin-top: 10px; min-height: 48px; }
  label.lab { display: block; font-size: 13px; color: var(--muted); margin: 14px 4px -4px; font-weight: 500; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chiphead { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 14px 2px 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 14px; font-weight: 500; }
  .chip::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .chip.g-fun::before { background: var(--fun); } .chip.g-sinking::before { background: var(--warn); }
  .chip.g-fixed::before { background: var(--muted); } .chip.g-savings::before, .chip.g-income::before { background: var(--good); }
  .chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .chip.on::before { background: var(--on-accent); }
  .chip.sug { border-color: var(--accent); }
  .btn { display: block; width: 100%; text-align: center; padding: 15px; border-radius: 16px; font-weight: 650; font-size: 16px; margin-top: 14px; }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.soft { background: var(--card); border: 1px solid var(--line); }
  .btn.danger { color: var(--bad); background: var(--bad-soft); }
  .toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-top: 10px; }
  .toggle small { display: block; color: var(--muted); }
  .sw { position: relative; width: 50px; height: 30px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw i { position: absolute; inset: 0; background: var(--bar); border-radius: 99px; transition: .2s; }
  .sw i::after { content: ''; position: absolute; width: 26px; height: 26px; left: 2px; top: 2px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .2s; }
  .sw input:checked + i { background: var(--good); }
  .sw input:checked + i::after { transform: translateX(20px); }
  .sortcard { text-align: center; padding: 18px 16px; margin-top: 4px; }
  .sortcard .big { font-size: 40px; margin: 2px 0 4px; }
  .bars6 { display: flex; align-items: flex-end; gap: 8px; height: 110px; padding: 10px 4px 0; }
  .bars6 > div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; position: relative; }
  .bars6 .b { width: 100%; max-width: 34px; border-radius: 7px 7px 3px 3px; background: var(--accent); min-height: 2px; }
  .bars6 .b.over { background: var(--bad); } .bars6 .b.cur { outline: 2px solid var(--text); outline-offset: 1px; }
  .bars6 .bud { position: absolute; left: 6%; right: 6%; border-top: 2px dashed var(--muted); }
  .bars6 small { font-size: 11px; color: var(--muted); }
  .steps { margin: 0; padding-left: 22px; }
  .steps li { margin: 0 0 10px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--bar); padding: 1px 5px; border-radius: 6px; white-space: nowrap; }
  .codebox { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--bar); padding: 10px 12px; border-radius: 12px; word-break: break-all; margin: 6px 0; }
  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 500;
    opacity: 0; transition: .25s; z-index: 60; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .total { display: flex; justify-content: space-between; padding: 13px 16px; font-weight: 650; }
  .chip::before { content: none; }
  .chip.skip { border-style: dashed; color: var(--muted); }
  .chip.skip.on { color: var(--on-accent); border-style: solid; }
  .catrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; padding: 11px 16px; }
  .catrow .bar { grid-column: 1 / -1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetwrap"><div class="scrim" data-act="close"></div><div class="sheet" id="sheet"></div></div>
<nav class="tabs"><div class="in">
  <button data-act="tab" data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-act="tab" data-tab="txns"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Spending</button>
  <button class="add" data-act="add" aria-label="Add a purchase"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px;stroke-width:2.4"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-act="tab" data-tab="more"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</div></nav>
<div class="toast" id="toast"></div>
<input type="file" id="filein" accept=".txt,.json,text/plain,application/json" hidden>

<script id="main">
(function () {
'use strict';

/* ---------- Basics ---------- */
const KEY = 'tally.v1';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = (n) => Math.round(n * 100) / 100;
const pad = (n) => String(n).padStart(2, '0');
const ds = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ds(new Date());
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
function money(n) {
  const neg = n < -0.004;
  return (neg ? '−' : '') + '£' + Math.abs(n).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function hash(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36); }
function parseAmt(v) {
  let s = String(v == null ? '' : v).replace(/[^0-9.,\-]/g, '');
  if (s.includes('.')) s = s.replace(/,/g, '');
  else if (/,\d{1,2}$/.test(s)) s = s.replace(',', '.');
  else s = s.replace(/,/g, '');
  const n = parseFloat(s);
  return isFinite(n) ? Math.abs(n) : NaN;
}
const normPayee = (s) => String(s || '').toLowerCase().replace(/[0-9#*]+/g, ' ').replace(/\b(ltd|limited|plc|uk|store|stores)\b/g, ' ').replace(/[^a-z&' ]+/g, ' ').replace(/\s+/g, ' ').trim();

/* ---------- State ----------
   A purchase is fun money when it has a fun category (t.fun), "not fun money" when t.skip,
   and "to sort" otherwise. Older budget-app fields (lines, overrides, subs…) are left in
   saved data untouched but no longer used. */
const FUN_CATS = ['Eating out', 'Takeaway', 'Drinks & socialising', 'Clothes', 'Tech & gadgets', 'Hobbies', 'Entertainment', 'Books & media', 'Other'];
function seedState() {
  return {
    v: 2,
    settings: { payDay: 24, workday: true, theme: null },
    fun: FUN_CATS.map((name, i) => ({ id: 'f' + i, name })),
    allow: {},       // pay month 'YYYY-MM' -> fun money amount typed on payday
    txns: [],        // {id, d, t, amt, payee, fun, skip, card, note, src}
    seen: {},        // Apple Pay lines already imported
    rules: {},       // normalised shop -> 'fun:<id>' | 'skip'
    lastBackup: null,
    lastImport: null,
    funHint: null,
    mig: { v3: 1 },
  };
}
function migrate(s) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.txns)) return seedState();
  if (!s.mig) s.mig = {};
  const d = seedState();
  for (const k in d) if (s[k] === undefined) s[k] = d[k];
  for (const k in d.settings) if (s.settings[k] === undefined) s.settings[k] = d.settings[k];

function parseWhen(s) {

  <ol class="steps">
    <li><b>Every evening</b> (e.g. 8:00 pm, Daily): <code>Tally: get today’s Apple Pay and add any cash</code></li>
    <li><b>End of the pay month</b> (e.g. 7:00 pm, Monthly on the 23rd): <code>Tally: send fun money to my budget</code></li>
  </ol>`;
}

/* ---------- Sheets ---------- */
function openSheet(s) { ui.sheet = s; renderSheet(); document.body.classList.add('lock'); $('#sheetwrap').classList.add('open'); $('#sheet').scrollTop = 0; }
function closeSheet() { ui.sheet = null; $('#sheetwrap').classList.remove('open'); document.body.classList.remove('lock'); }
function renderSheet() {
  const s = ui.sheet; if (!s) return;
  const fn = { tx: txSheet, sort: sortSheet, import: importSheet, funcats: funSheet, allow: allowSheet, export: exportSheet, guide: guideSheet }[s.type];
  $('#sheet').innerHTML = `<div class="in">${fn(s)}</div>`;
  if (s.focus) { const el = $(s.focus); s.focus = null; if (el) el.focus(); }
}
function sheetHead(title, right) {
  return `<div class="sheethead"><button class="link" data-act="close">${right ? 'Cancel' : 'Close'}</button><b>${title}</b>${right ? `<button class="link" data-act="${right[0]}">${right[1]}</button>` : '<span style="min-width:60px"></span>'}</div>`;
}
function chipsHtml(sel, sug, withSkip) {
  const chip = (k, label, cls) => `<button type="button" class="chip ${cls || ''} ${k === sel ? 'on' : k === sug ? 'sug' : ''}" data-act="pick" data-k="${esc(k)}">${esc(label)}</button>`;
  return `<div class="chips" style="margin-top:14px">${S.fun.map((f) => chip('fun:' + f.id, f.name)).join('')}${withSkip ? chip('skip', 'Not fun money', 'skip') : ''}</div>`;
}
function txSheet(s) {
  const t = s.id ? S.txns.find((x) => x.id === s.id) : null;
  if (s.mode == null) s.mode = t && t.amt < 0 ? 'ref' : 'out';
  if (s.k == null) s.k = t ? keyOf(t) : '';
  const payees = [...new Set(S.txns.filter((x) => x.fun).map((x) => x.payee).filter(Boolean))].slice(-200);
  return `${sheetHead(t ? 'Edit' : 'Fun money spend', ['savetx', 'Save'])}
    <div class="seg">${[['out', 'Spend'], ['ref', 'Refund']].map(([v, n]) => `<button class="${s.mode === v ? 'on' : ''}" data-act="mode" data-v="${v}">${n}</button>`).join('')}</div>
    <div class="amtbox"><span>£</span><input id="f-amt" class="num" inputmode="decimal" placeholder="0.00" value="${t ? Math.abs(t.amt).toFixed(2) : ''}" autocomplete="off"></div>
    <input class="field" id="f-payee" placeholder="Where? e.g. Nando’s" value="${esc(t ? t.payee : '')}" list="payees" autocomplete="off" autocapitalize="words">
    <datalist id="payees">${payees.map((x) => `<option value="${esc(x)}">`).join('')}</datalist>
    <div id="chipbox">${chipsHtml(s.k, '', !!t)}</div>
    <label class="lab">Date</label><input class="field" type="date" id="f-date" value="${esc(t ? t.d : todayStr())}">
    <input class="field" id="f-note" placeholder="Note (optional)" value="${esc(t ? t.note : '')}">
    <button class="btn primary" data-act="savetx">Save</button>
    ${t ? `<button class="btn danger" data-act="deltx">Delete</button>` : ''}
    ${t && t.src === 'applepay' ? `<p class="muted" style="font-size:13px;text-align:center">From Apple Pay${t.card ? ' · ' + esc(t.card) : ''}</p>` : ''}`;
}
function sortSheet() {
  const list = unsorted().sort(txSort);
  if (!list.length) return `${sheetHead('All sorted')}<div class="empty">Nothing left to sort. 🎉</div><button class="btn primary" data-act="close">Done</button>`;
  const t = list[0];
  return `${sheetHead(`To sort · ${list.length} left`)}
    <div class="card sortcard"><div class="eyebrow">${esc(dayName(t.d))}${t.t ? ' · ' + esc(t.t) : ''}${t.card ? ' · ' + esc(t.card) : ''}</div><div class="big num">${money(t.amt)}</div><b style="font-size:18px">${esc(t.payee)}</b></div>
    <div id="chipbox">${chipsHtml('', '', true)}</div>
    <p class="muted" style="font-size:13px;margin:14px 4px 0">Tally remembers ${esc(t.payee)} for next time.</p>
    <div class="two"><button class="btn soft" data-act="edit" data-id="${esc(t.id)}">Edit</button><button class="btn danger" data-act="sortdel" data-id="${esc(t.id)}">Delete</button></div>`;
}
function importSheet() {
  return `${sheetHead('Get Apple Pay purchases')}
    <p style="margin:4px 4px 12px">Pick the file your Apple Pay automation writes to:</p>
    <button class="btn primary" data-act="pickfile">Choose “Tally inbox” from Files</button>
    <p class="muted" style="font-size:13px;margin:8px 4px 0">It’s in iCloud Drive → Shortcuts (or Recents).</p>
    <label class="lab">Or paste it here</label>
    <textarea class="field" id="pastebox" rows="3" placeholder="TALLY;…"></textarea>
    <button class="btn soft" data-act="pasteimport">Add pasted purchases</button>`;
}
function allowSheet(s) {
  const v = allowance(s.p);
  return `${sheetHead(`Fun money · ${plabel(s.p)}`, ['saveallow', 'Save'])}
    <div class="amtbox"><span>£</span><input id="al-amt" class="num" inputmode="decimal" placeholder="0.00" value="${v != null ? v.toFixed(2) : lastAllowance(s.p) ? (+lastAllowance(s.p)).toFixed(2) : ''}" autocomplete="off"></div>
    <button class="btn primary" data-act="saveallow">Save</button>
    <p class="muted" style="font-size:13px;text-align:center">Only changes ${plabel(s.p)}. You set it fresh each payday.</p>`;
}
function exportRows(p) {
  const list = funTx(p).sort((x, y) => (x.d + (x.t || '')).localeCompare(y.d + (y.t || '')));
  const al = allowance(p), spent = sum(list);
  const rows = [['Date', 'Where', 'Category', 'Amount']];
  for (const t of list) rows.push([fmtD(t.d, { day: '2-digit', month: '2-digit', year: 'numeric' }), t.payee, catName(t.fun), t.amt.toFixed(2)]);
  rows.push([], ['Category', 'Total']);
  for (const { f, v } of catTotals(p)) rows.push([f.name, v.toFixed(2)]);
  rows.push(['Total spent', spent.toFixed(2)]);
  if (al != null) rows.push(['Fun money', al.toFixed(2)], ['Left over', r2(al - spent).toFixed(2)]);
  return rows;
}
function exportSheet() {
  const p = ui.p, [a, b] = range(p), list = funTx(p), al = allowance(p), spent = sum(list), cats = catTotals(p);
  let h = sheetHead(`${plabel(p)} for my budget`);
  h += `<div class="card pad"><div class="eyebrow">${fmtD(a)} – ${fmtD(b)} · ${list.length} purchase${list.length === 1 ? '' : 's'}</div><div class="big num">${money(spent)}</div><small class="muted">${al != null ? `of ${money(al)} fun money · ${money(al - spent)} left over` : 'spent on fun money'}</small></div>`;
  if (cats.length) h += `<div class="card list" style="margin-top:12px">${cats.map(({ f, v }) => `<div class="simple"><span>${esc(f.name)}</span><b class="num">${money(v)}</b></div>`).join('')}</div>`;
  h += `<button class="btn primary" data-act="copyexport">Copy for Google Sheets</button>
    <p class="muted" style="font-size:13px;margin:8px 4px 0">Then in your sheet, tap an empty cell (e.g. on a new tab) and <b>Paste</b>: each purchase lands in its own row, with category totals underneath.</p>
    <button class="btn soft" data-act="csvexport">Download as a file (CSV)</button>`;
  return h;
}
function guideSheet(s) {
  return s.g === 'reminders' ? `${sheetHead('Reminders')}<div class="card pad">${remindersGuide()}</div>`
    : `${sheetHead('Apple Pay')}<div class="card pad">${applePaySteps()}</div><button class="btn primary" data-act="import">Fetch purchases now</button>`;
}
function funSheet() {
  let h = sheetHead('Fun categories');
  h += `<div class="card list">${S.fun.map((f) => `<div class="simple"><span>${esc(f.name)}</span><span style="display:flex;gap:14px"><button data-act="funren" data-id="${f.id}" style="color:var(--accent);font-weight:600">Rename</button><button data-act="fundel" data-id="${f.id}" class="bad" style="font-weight:600">Remove</button></span></div>`).join('')}</div>`;
  h += `<button class="btn soft" data-act="funadd">+ Add a category</button>`;
  return h;
}

/* ---------- Render ---------- */
function render() {
  if (!ui.p) ui.p = curPeriod();
  const view = { home: homeView, txns: txnsView, more: moreView }[ui.tab] || homeView;
  $('#app').innerHTML = view();
  document.querySelectorAll('nav.tabs [data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === ui.tab));
}

/* ---------- Actions ---------- */
function download(name, text, type) {
  const file = new File([text], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title: name }).then(() => true).catch((e) => (e && e.name === 'AbortError' ? false : fallback()));
  return Promise.resolve(fallback());
  function fallback() {
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return true;
  }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (err) {} ta.remove(); return ok;
  }
}
function saveAllowance(p) {
  const v = parseAmt($('#al-amt').value);
  if (!(v >= 0) || $('#al-amt').value.trim() === '') { toast('Enter an amount'); return false; }
  S.allow[p] = r2(v); save(); return true;
}
let fileKind = 'inbox';
const A = {
  tab(el) { ui.tab = el.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); },
  prev() { ui.p = shiftP(ui.p, -1); render(); },
  next() { ui.p = shiftP(ui.p, 1); render(); },
  thisp() { ui.p = curPeriod(); render(); },
  add() { openSheet({ type: 'tx', focus: '#f-amt' }); },
  edit(el) { openSheet({ type: 'tx', id: el.dataset.id }); },
  close() { closeSheet(); },
  sort() { openSheet({ type: 'sort' }); },
  import() { importClipboard(); },
  guide(el) { openSheet({ type: 'guide', g: el.dataset.g }); },
  setallow() { if (saveAllowance(ui.p)) { render(); toast('Fun money set'); } },
  editallow(el) { openSheet({ type: 'allow', p: el.dataset.p || ui.p, focus: '#al-amt' }); },
  saveallow() { if (saveAllowance(ui.sheet.p)) { closeSheet(); render(); toast('Saved'); } },
  export() { openSheet({ type: 'export' }); },
  copyexport() { copyText(exportRows(ui.p).map((r) => r.map((c) => String(c).replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n')).then((ok) => toast(ok ? 'Copied: paste it into your sheet' : 'Couldn’t copy. Try the file instead')); },
  csvexport() {
    const q = (v) => '"' + String(v).replace(/"/g, '""') + '"';
    download(`tally-fun-money-${ui.p}.csv`, '﻿' + exportRows(ui.p).map((r) => r.map(q).join(',')).join('\r\n'), 'text/csv');
  },
  mode(el) {
    ui.sheet.mode = el.dataset.v;
    document.querySelectorAll('.sheet .seg [data-act=mode]').forEach((b) => b.classList.toggle('on', b.dataset.v === ui.sheet.mode));
  },
  pick(el) {
    const s = ui.sheet, k = el.dataset.k;
    if (s.type === 'sort') {
      const t = unsorted().sort(txSort)[0]; if (!t) return;
      const n = normPayee(t.payee);
      if (n) S.rules[n] = k;
      for (const o of unsorted()) if (o === t || (n && normPayee(o.payee) === n)) setKey(o, k);
      save(); render(); renderSheet(); $('#sheet').scrollTop = 0;
      return;
    }
    s.k = k; s.manual = true;
    document.querySelectorAll('#chipbox .chip').forEach((c) => c.classList.toggle('on', c.dataset.k === k));
  },
  savetx() {
    const s = ui.sheet, amt = parseAmt($('#f-amt').value);
    if (!(amt > 0)) { toast('Enter an amount'); $('#f-amt').focus(); return; }
    if (!validKey(s.k)) { toast('Pick a category'); return; }
    let t = s.id ? S.txns.find((x) => x.id === s.id) : null;
    const d = $('#f-date').value || todayStr();
    if (!t) { t = { id: uid(), src: 'manual', t: d === todayStr() ? nowTime() : '', card: '' }; S.txns.push(t); }
    t.amt = r2(s.mode === 'ref' ? -amt : amt); t.payee = $('#f-payee').value.trim(); t.d = d; t.note = $('#f-note').value.trim();
    setKey(t, s.k);
    if (t.payee) S.rules[normPayee(t.payee)] = s.k;
    save(); closeSheet(); render();
    toast(s.id ? 'Saved' : `Logged ${money(Math.abs(t.amt))}${t.payee ? ' · ' + t.payee : ''}`);
  },
  deltx() { if (!confirm('Delete this?')) return; S.txns = S.txns.filter((x) => x.id !== ui.sheet.id); save(); closeSheet(); render(); toast('Deleted'); },
  sortdel(el) { S.txns = S.txns.filter((x) => x.id !== el.dataset.id); save(); render(); renderSheet(); },
  pickfile() { fileKind = 'inbox'; const f = $('#filein'); f.value = ''; f.click(); },
  pasteimport() { afterIngest(ingest($('#pastebox').value)); },
  funcats() { openSheet({ type: 'funcats' }); },
  funadd() { const n = (prompt('New fun category') || '').trim(); if (!n) return; S.fun.push({ id: uid(), name: n }); save(); renderSheet(); render(); },
  funren(el) { const f = S.fun.find((x) => x.id === el.dataset.id); const n = (prompt('Rename', f.name) || '').trim(); if (!n) return; f.name = n; save(); renderSheet(); render(); },
  fundel(el) {
    const f = S.fun.find((x) => x.id === el.dataset.id);
    if (S.fun.length < 2) { alert('Keep at least one category.'); return; }
    if (!confirm(`Remove “${f.name}”? Its purchases move to the first category.`)) return;
    S.fun = S.fun.filter((x) => x !== f);
    for (const t of S.txns) if (t.fun === f.id) t.fun = S.fun[0].id;
    for (const r in S.rules) if (S.rules[r] === 'fun:' + f.id) delete S.rules[r];
    save(); renderSheet(); render();
  },
  theme(el) { S.settings.theme = el.dataset.v || null; save(); applyTheme(S.settings.theme); render(); },
  backup() {
    const data = JSON.stringify({ app: 'tally', v: 2, at: new Date().toISOString(), state: S });
    download(`tally-backup-${todayStr()}.json`, data, 'application/json').then((ok) => { if (ok) { S.lastBackup = new Date().toISOString(); save(); render(); toast('Backup saved'); } });
  },
  restore() { fileKind = 'backup'; const f = $('#filein'); f.value = ''; f.click(); },
  erase() {
    if (!confirm('Erase all Tally data on this phone? This can’t be undone (unless you have a backup).')) return;
    if (!confirm('Really erase everything?')) return;
    S = seedState(); save(); ui.p = curPeriod(); ui.tab = 'home'; render(); toast('Erased');
  },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); e.stopPropagation(); fn(el); }
});
document.addEventListener('change', (e) => {
  const el = e.target, k = el.dataset && el.dataset.chg;
  if (k === 'payday') { const n = Math.round(+el.value); if (n >= 1 && n <= 31) { S.settings.payDay = n; save(); ui.p = curPeriod(); render(); toast('Pay day saved'); } else el.value = S.settings.payDay; }
  if (k === 'workday') { S.settings.workday = el.checked; save(); ui.p = curPeriod(); render(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { ui.q = e.target.value; $('#txlist').innerHTML = txListHtml(); }
  if (e.target.id === 'f-payee' && ui.sheet && !ui.sheet.manual) {
    const r = ruleFor(e.target.value);
    if (r) { ui.sheet.k = r; document.querySelectorAll('#chipbox .chip').forEach((c) => c.classList.toggle('on', c.dataset.k === r)); }
  }
});
$('#filein').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  const text = await file.text();
  if (fileKind === 'backup') {
    let data; try { data = JSON.parse(text); } catch (err) { alert('That file isn’t a Tally backup.'); return; }
    if (!data || data.app !== 'tally' || !data.state) { alert('That file isn’t a Tally backup.'); return; }
    if (!confirm(`Restore the backup from ${data.at ? new Date(data.at).toLocaleString('en-GB') : 'that file'}? It replaces what’s on this phone now.`)) return;
    S = migrate(data.state); save(); ui.p = curPeriod(); render(); toast('Restored');
  } else afterIngest(ingest(text));
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(S.settings.theme));

/* ---------- Start ---------- */
const VERSION = hash(($('#main') || {}).textContent || '').slice(0, 6);
save();
ui.p = curPeriod();
render();
let lastP = ui.p;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const cp = curPeriod();
  if (cp !== lastP) { lastP = cp; ui.p = cp; if (!ui.sheet) render(); }
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
