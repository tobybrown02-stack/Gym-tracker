function trainingPreview(kcal, gap, on) {
  const n = trainingDaysPerWeek();
  if (!on) return '<span class="muted">Off: the same target every day.</span>';
  if (!(kcal > 0)) return '';
  if (n === 0 || n === 7) return '<span class="muted">Set up a weekly schedule with some rest days in the Plan tab to use this.</span>';
  const sh = trainingShift(gap, n);
  return `Training days <b>${fmtKg(kcal + sh.training)}</b> · rest days <b>${fmtKg(kcal + sh.rest)}</b> kcal <span class="muted">(${n} training day${n === 1 ? '' : 's'} a week in your Plan)</span>`;
}

function readProfile(form) {
  const fd = new FormData(form);
  const p = { sex: fd.get('sex') || 'male', age: Number(fd.get('age')), height: Number(fd.get('height')), weight: Number(fd.get('weight')), activity: Number(fd.get('activity')), goal: fd.get('goal') };
  return p.age > 0 && p.height > 0 && p.weight > 0 ? p : null;
}

function fillTargets(form) {
  const p = readProfile(form);
  if (!p) return;
  const t = calcTargets(p);
  ['kcal', 'protein', 'carbs', 'fat'].forEach((k) => (form.elements[k].value = t[k]));
}

// ----- Open Food Facts & barcode scanning -----
function offToFood(p) {
  const nm = p?.nutriments || {};
  let kcal = nm['energy-kcal_100g'];
  if (kcal == null && nm.energy_100g != null) kcal = nm.energy_100g / 4.184; // kJ → kcal
  if (kcal == null || !p.code) return null;
  const num = (v) => round1(Number(v) || 0);
  const servingG = Number(p.serving_quantity);
  return {
    id: `off:${p.code}`, src: 'off', code: String(p.code),
    name: String(p.product_name || p.product_name_en || p.generic_name || 'Unnamed product').trim(),
    brand: String([].concat(p.brands || '')[0]).split(',')[0].trim(),
    n: {
      kcal: num(kcal), protein: num(nm.proteins_100g), carbs: num(nm.carbohydrates_100g), sugar: num(nm.sugars_100g),
      fat: num(nm.fat_100g), satfat: num(nm['saturated-fat_100g']), fibre: num(nm.fiber_100g),
      salt: num(nm.salt_100g ?? (nm.sodium_100g != null ? nm.sodium_100g * 2.5 : 0)),
    },
    portions: servingG > 0 ? [{ label: '1 serving', g: servingG }] : [],
  };
}

/** Fetch JSON with a timeout; throws a short, human-readable reason on failure. */
async function getJSON(url, ms = 20000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    try { return await r.json(); } catch (err) { throw new Error('not JSON (service busy?)'); }
  } catch (err) {
    throw new Error(err.name === 'AbortError' ? 'timed out' : err.message || 'network error');
  } finally {
    clearTimeout(timer);
  }
}

// Open Food Facts search services, tried in order until one answers.
const OFF_SEARCHES = [
  ['search', (q) => `https://search.openfoodfacts.org/search?q=${encodeURIComponent(`${q} countries_tags:"en:united-kingdom"`)}&page_size=30&fields=${OFF_FIELDS},product_name_en`, (j) => j.hits],
  ['classic', (q) => `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=30&tagtype_0=countries&tag_contains_0=contains&tag_0=united-kingdom&fields=${OFF_FIELDS}`, (j) => j.products],
];

// Search results are remembered for a day: OFF allows only ~10 searches a minute.
const OFF_CACHE_KEY = 'pot.offcache';
const OFF_CACHE_MS = 24 * 3600 * 1000;
function offCacheGet(q) {
  try {
    const hit = JSON.parse(localStorage.getItem(OFF_CACHE_KEY) || '{}')[q];
    return hit && Date.now() - hit.at < OFF_CACHE_MS ? hit.items : null;
  } catch (err) { return null; }
}
function offCachePut(q, items) {
  try {
    const cache = JSON.parse(localStorage.getItem(OFF_CACHE_KEY) || '{}');
    cache[q] = { at: Date.now(), items };
    const keys = Object.keys(cache).sort((a, b) => cache[b].at - cache[a].at);
    keys.slice(40).forEach((k) => delete cache[k]);
    localStorage.setItem(OFF_CACHE_KEY, JSON.stringify(cache));
  } catch (err) { /* cache is optional */ }
}

async function searchOFF(q) {
  const reasons = [];
  for (const [name, url, pick] of OFF_SEARCHES) {
    try {
      const list = pick(await getJSON(url(q)));
      if (!Array.isArray(list)) throw new Error('unexpected reply');
      const seen = new Set();
      return { items: list.map(offToFood).filter((f) => f && !seen.has(f.id) && seen.add(f.id)) };
    } catch (err) {
      reasons.push(`${name}: ${err.message}`);
    }
  }
  return { reason: reasons.join(' · ') };
}

async function offSearch() {
  const q = modal.query.trim().toLowerCase();
  if (!q || (modal.off.q === q && modal.off.state === 'loading')) return;
  const done = (patch) => { if (modal?.off?.q === q) { modal.off = { q, ...patch }; refreshFoodResults(); } };
  const cached = offCacheGet(q);
  if (cached) { modal.off = { q, state: 'done', items: cached }; return refreshFoodResults(); }

  modal.off = { q, state: 'loading', items: [] };
  refreshFoodResults();
  let res = await searchOFF(q);
  if (!res.items && modal?.off?.q === q) {
    // Usually the per-minute limit: wait briefly and try once more.
    modal.off.retrying = true; refreshFoodResults();
    await new Promise((r) => setTimeout(r, 6000));
    if (modal?.off?.q !== q) return;
    res = await searchOFF(q);
  }
  if (res.items) { offCachePut(q, res.items); done({ state: 'done', items: res.items }); }
  else done({ state: 'error', items: [], reason: res.reason });
}

function setScanStatus(text) {
  const el = document.getElementById('scan-status');
  if (el) el.textContent = text;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (window.__Html5QrcodeLibrary__) return resolve();
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('script failed'));
    document.head.appendChild(s);
  });
}

async function startScanner() {
  try { await loadScript(SCANNER_SRC); } catch (err) { return setScanStatus('Couldn’t load the scanner. Check your connection, or type the barcode below.'); }
  if (modal?.step !== 'scan' || scanner) return;
  const L = window.__Html5QrcodeLibrary__, F = L.Html5QrcodeSupportedFormats;
  const s = new L.Html5Qrcode('scanner', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E], verbose: false });
  scanner = s;
  try {
    await s.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 130 } }, (code) => { stopScanner(); lookupBarcode(code); }, () => {});
    if (scanner !== s) s.stop().catch(() => {}); // closed while the camera was starting
    else setScanStatus('Point the camera at the barcode.');
  } catch (err) {
    if (scanner === s) scanner = null;
    setScanStatus('Camera not available. Allow camera access for this site, or type the barcode below.');
  }
}

function stopScanner() {
  if (!scanner) return;
  const s = scanner;
  scanner = null;
  s.stop().then(() => s.clear()).catch(() => {});
}

function openAmount(food, entry) {
  const units = unitsFor(food);
  Object.assign(modal, {
    step: 'amount', food, entryId: entry?.id || null,
    unit: entry ? Math.max(0, units.findIndex((u) => u.label === entry.unit)) : units.length > 1 ? 1 : 0,
    qty: entry ? String(entry.qty) : units.length > 1 ? '1' : '100',
  });
  if (entry) modal.meal = entry.meal;
  renderModal();
}

async function lookupBarcode(raw) {
  const code = String(raw).replace(/\D/g, '');
  if (!code) return;
  const known = Object.values(state.food.foods).find((f) => f.code === code);
  if (known) return openAmount(known);
  await loadFoodData();
  const local = foodData.byCode?.get(code) ?? foodData.byCode?.get(code.padStart(13, '0'));
  if (local !== undefined && modal?.type === 'food') return openAmount(productFood(foodData.products.rows[local]));
  setScanStatus(`Looking up ${code}…`);
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${OFF_FIELDS}`);
    const j = await r.json();
    const f = j.status === 1 ? offToFood(j.product) : null;
    if (modal?.type !== 'food') return;
    if (f) openAmount(f);
    else Object.assign(modal, { step: 'custom', code, msg: `Barcode ${code} isn’t in the database yet, or has no nutrition info. Add it from the label and it’ll scan instantly next time.` }), renderModal();
  } catch (err) {
    setScanStatus('Lookup failed. Check your connection and try again.');
  }
}

// ----- Food actions -----
function openFoodModal(meal) {
  modal = { type: 'food', step: 'search', meal, date: foodDate, query: '', off: { q: '', state: 'idle', items: [] } };
  renderModal();
  loadFoodData();
}

function saveFoodEntry() {
  const m = modal, f = m.food;
  const u = unitsFor(f)[m.unit] || { label: 'g', g: 1 };
  const qty = parseFloat(m.qty);
  if (!(qty > 0)) return toast('Enter an amount');
  const g = round1(qty * u.g);
  if (m.target === 'recipe') {
    m.recipe.items.push({ food: f, qty, unit: u.label, g, n: scaleN(f.n, g) });
    Object.assign(m, { step: 'recipe', target: null, query: '' });
    return renderModal();
  }
  if (f.src !== 'uk') state.food.foods[f.id] = f;
  const entry = { id: m.entryId || uid(), foodId: f.id, name: f.brand ? `${f.name} (${f.brand})` : f.name, meal: m.meal, qty, unit: u.label, g, n: scaleN(f.n, g), ts: Date.now() };
  putEntry(m.date, entry);
  toast(m.entryId ? 'Saved' : `Added to ${MEAL_LABEL[m.meal]}`);
}

function putEntry(date, entry) {
  const list = (state.food.log[date] ||= []);
  const i = list.findIndex((e) => e.id === entry.id);
  if (i >= 0) list[i] = { ...entry, ts: list[i].ts }; else list.push(entry);
  modal = null;
  saveState();
  render();
}

function deleteFoodEntry() {
  state.food.log[modal.date] = dayEntries(modal.date).filter((e) => e.id !== modal.entryId);
  if (!state.food.log[modal.date].length) delete state.food.log[modal.date];
  modal = null;
  saveState();
  render();
  toast('Removed');
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-food]');
  if (!b) return;
  const action = b.dataset.food;
  switch (action) {
    case 'date': {
      const dir = Number(b.dataset.dir);
      foodDate = dir ? addDays(foodDate, dir) : todayISO();
      if (foodDate > todayISO()) foodDate = todayISO();
      render();
      return;
    }
    case 'setup': modal = { type: 'food-setup' }; renderModal(); return;
    case 'calc': { const form = document.getElementById('food-setup'); form.dataset.manual = ''; fillTargets(form); return; }
    case 'add': openFoodModal(b.dataset.meal); return;
    case 'copy': {
      const meal = b.dataset.meal;
      dayEntries(addDays(foodDate, -1)).filter((x) => x.meal === meal)
        .forEach((x) => (state.food.log[foodDate] ||= []).push({ ...x, id: uid(), ts: Date.now() }));
      saveState(); render(); toast(`Copied yesterday’s ${MEAL_LABEL[meal].toLowerCase()}`);
      return;
    }
    case 'edit': {
      const entry = dayEntries(foodDate).find((x) => x.id === b.dataset.id);
      if (!entry) return;
      modal = { type: 'food', meal: entry.meal, date: foodDate, query: '', off: { q: '', state: 'idle', items: [] } };
      const food = entry.foodId && foodById(entry.foodId);
      if (food) return openAmount(food, entry);
      Object.assign(modal, { step: 'quick', entryId: entry.id, entry });
      renderModal();
      return;
    }
    case 'back':
      if (modal.step === 'recipe') Object.assign(modal, { step: 'search', recipe: null, target: null });
      else if (modal.step === 'search' && modal.target === 'recipe') Object.assign(modal, { step: 'recipe', target: null });
      else Object.assign(modal, { step: 'search', msg: '' });
      renderModal();
      return;
    case 'water': {
      const ml = Math.max(0, (state.food.water[foodDate] || 0) + Number(b.dataset.ml));
      if (ml) state.food.water[foodDate] = ml; else delete state.food.water[foodDate];
      saveState(); render();
      return;
    }
    case 'weight-save': {
      const kg = parseFloat(document.getElementById('weight-input').value);
      if (!(kg >= 20 && kg <= 400)) return toast('Enter your weight in kg');
      state.food.weights[foodDate] = round1(kg);
      saveState(); render(); toast('Weight logged');
      return;
    }
    case 'weight-view': modal = { type: 'weight' }; renderModal(); return;
    case 'weight-del':
      if (!confirm('Delete this weigh-in?')) return;
      delete state.food.weights[b.dataset.date];
      saveState(); render();
      return;
    case 'checkin': applyCheckin(b.dataset.accept === '1'); saveState(); render(); toast(b.dataset.accept === '1' ? 'Target updated' : 'Check-in saved'); return;
    case 'save-meal': {
      const meal = b.dataset.meal;
      const items = dayEntries(foodDate).filter((x) => x.meal === meal);
      const name = (prompt('Name this meal so you can log it in one tap:', `My ${MEAL_LABEL[meal].toLowerCase()}`) || '').trim();
      if (!name) return;
      state.food.meals.push({ id: uid(), name: name.slice(0, 60), items: items.map(({ id, ts, meal: _m, ...rest }) => rest) });
      saveState(); toast(`Saved “${name}”`);
      return;
    }
    case 'log-meal': {
      const sm = state.food.meals.find((x) => x.id === b.dataset.id);
      if (!sm) return;
      const list = (state.food.log[modal.date] ||= []);
      sm.items.forEach((i) => list.push({ ...i, id: uid(), meal: modal.meal, ts: Date.now() }));
      const meal = modal.meal;
      modal = null; saveState(); render(); toast(`Added ${sm.name} to ${MEAL_LABEL[meal]}`);
      return;
    }
    case 'del-meal': {
      const sm = state.food.meals.find((x) => x.id === b.dataset.id);
      if (!sm || !confirm(`Delete the saved meal “${sm.name}”? Logged food isn’t affected.`)) return;
      state.food.meals = state.food.meals.filter((x) => x !== sm);
      saveState(); refreshFoodResults();
      return;
    }
    case 'recipe-new': Object.assign(modal, { step: 'recipe', target: null, recipe: { id: null, name: '', servings: '4', items: [] } }); renderModal(); return;
    case 'recipe-add': Object.assign(modal, { step: 'search', target: 'recipe', query: '', off: { q: '', state: 'idle', items: [] } }); renderModal(); return;
    case 'recipe-remove': modal.recipe.items.splice(Number(b.dataset.k), 1); renderModal(); return;
    case 'recipe-edit': {
      const f = modal.food;
      modal.recipe = { id: f.id, name: f.name, servings: String(f.recipe.servings), items: f.recipe.items.map((i) => ({ ...i, n: scaleN(i.food.n, i.g) })) };
      Object.assign(modal, { step: 'recipe', target: null });
      renderModal();
      return;
    }
    case 'recipe-save': {
      const r = modal.recipe, name = r.name.trim();
      if (!name) return toast('Give the recipe a name');
      if (!r.items.length) return toast('Add at least one ingredient');
      const { servings, tot, g } = recipeSums();
      const food = {
        id: r.id || `r:${uid()}`, src: 'recipe', name, brand: '',
        n: Object.fromEntries(NKEYS.map((k) => [k, round1((tot[k] * 100) / g)])),
        portions: [{ label: '1 serving', g: round1(g / servings) }],
        recipe: { servings, items: r.items.map(({ food: ing, qty, unit, g: grams }) => ({ food: ing, qty, unit, g: grams })) },
      };
      state.food.foods[food.id] = food;
      saveState();
      Object.assign(modal, { recipe: null, target: null });
      openAmount(food);
      toast('Recipe saved');
      return;
    }
    case 'scan': modal.step = 'scan'; renderModal(); return;
    case 'lookup': lookupBarcode(document.querySelector('[data-fs=code]').value); return;
    case 'quick': Object.assign(modal, { step: 'quick', entryId: null, entry: null }); renderModal(); return;
    case 'custom': Object.assign(modal, { step: 'custom', code: '', msg: '' }); renderModal(); return;
    case 'off-search': offSearch(); return;
    case 'pick': {
      const id = b.dataset.id;
      const food = foodById(id) || modal.off.items.find((x) => x.id === id) || offlineFood(id);
      if (food) openAmount(food);
      return;
    }
    case 'fav': {
      const id = modal.food.id, favs = state.food.favs;
      if (favs.includes(id)) favs.splice(favs.indexOf(id), 1);
      else { favs.push(id); if (modal.food.src !== 'uk') state.food.foods[id] = modal.food; }
      saveState(); renderModal();
      return;
    }
    case 'save': saveFoodEntry(); return;
    case 'delete': deleteFoodEntry(); return;
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.fs && modal?.type === 'food') {
    if (el.dataset.fs === 'code') return;
    modal[el.dataset.fs] = el.dataset.fs === 'unit' ? Number(el.value) : el.value;
    if (el.dataset.fs === 'query') refreshFoodResults();
    if (el.dataset.fs === 'qty' || el.dataset.fs === 'unit') document.getElementById('fs-preview').innerHTML = previewHtml();
    if (el.dataset.fs === 'meal') document.querySelector('[data-food=save]').textContent = modal.entryId ? 'Save' : `Add to ${MEAL_LABEL[modal.meal]}`;
    return;
  }
  if (el.dataset.fr && modal?.recipe) {
    modal.recipe[el.dataset.fr] = el.value;
    document.getElementById('fr-totals').innerHTML = recipeTotals();
    return;
  }
  const form = el.closest?.('#food-setup');
  if (form) {
    if (el.dataset.target) form.dataset.manual = '1';
    else if (['sex', 'age', 'height', 'weight', 'activity', 'goal'].includes(el.name) && form.dataset.manual !== '1') fillTargets(form);
    document.getElementById('tday-preview').innerHTML = trainingPreview(Number(form.elements.kcal.value), Number(form.elements.trainingGap.value), form.elements.trainingOn.checked);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.dataset?.fs === 'query') { e.preventDefault(); offSearch(); }
  if (e.target.dataset?.fs === 'code') { e.preventDefault(); lookupBarcode(e.target.value); }
});

document.addEventListener('submit', (e) => {
  const form = e.target;
  if (!['food-setup', 'fq-form', 'fc-form'].includes(form.id)) return;
  e.preventDefault();
  const fd = new FormData(form);
  const num = (k) => round1(Math.max(0, parseFloat(fd.get(k)) || 0));

  if (form.id === 'food-setup') {
    const p = readProfile(form);
    if (!p) return toast('Enter your age, height and weight');
    const auto = calcTargets(p);
    const t = { ...auto };
    ['kcal', 'protein', 'carbs', 'fat'].forEach((k) => { const v = parseFloat(fd.get(k)); if (v > 0) t[k] = Math.round(v); });
    Object.assign(t, fixedTargets(t.kcal), { custom: form.dataset.manual === '1' });
    state.food.profile = p;
    state.food.targets = t;
    Object.assign(state.food.prefs, { trainingOn: fd.get('trainingOn') === 'on', trainingGap: Number(fd.get('trainingGap')) || 200, water: Number(fd.get('water')) || 2500 });
    modal = null;
    saveState(); render(); toast('Targets saved');
  } else if (form.id === 'fq-form') {
    const kcal = Math.round(num('kcal'));
    if (!kcal) return toast('Enter the calories');
    const n = { ...Object.fromEntries(NKEYS.map((k) => [k, 0])), kcal, protein: num('protein'), carbs: num('carbs'), fat: num('fat') };
    putEntry(modal.date, { id: modal.entryId || uid(), foodId: null, name: String(fd.get('name')).trim() || 'Quick add', meal: fd.get('meal'), qty: 1, unit: '', g: 0, n, ts: Date.now() });
    toast('Added');
  } else {
    const name = String(fd.get('name')).trim();
    if (!name) return toast('Give the food a name');
    const servingG = num('servingG');
    const food = {
      id: `c:${uid()}`, src: 'custom', name, brand: String(fd.get('brand')).trim(), code: modal.code || '',
      n: Object.fromEntries(NKEYS.map((k) => [k, num(k)])),
      portions: servingG > 0 ? [{ label: String(fd.get('servingLabel')).trim() || '1 serving', g: servingG }] : [],
    };
    state.food.foods[food.id] = food;
    saveState();
    openAmount(food);
  }
});

// ---------- Actions --------------------------------------------------------
function finishWorkout() {
  const d = state.draft;
  const ts = Date.now();
  const saved = [];
  d.entries.forEach((entry, k) => {
    const ex = exById(entry.exerciseId);
    if (!ex) return;
    const sets = cleanSets(entry.sets, predict(ex).weight);
    if (!sets.length) return;
    const h = { id: uid(), exerciseId: ex.id, date: d.date || todayISO(), ts: ts + k, sets };
    if (entry.note.trim()) h.note = entry.note.trim();
    if (entry.rpe) h.rpe = entry.rpe;
    if (entry.deload) h.deload = true;
    state.history.push(h);
    saved.push(h);
  });
  if (!saved.length) return toast('Log at least one set with reps first');

  const prs = [], ups = [], stalls = [];
  saved.forEach((h) => {
    const ex = exById(h.exerciseId);
    const items = prsFor(h);
    if (items.length) prs.push({ name: ex.name, items });
    const p = predict(ex);
    if (p.rule === 'up') ups.push({ name: ex.name, label: loadLabel(ex, p.weight) });
    if (plateau(ex)) stalls.push(ex.name);
  });
  state.draft = null;
  rest = null;
  tickRest();
  const mins = d.startedAt ? Math.round((Date.now() - d.startedAt) / 60000) : null;
  modal = {
    type: 'summary', saved: saved.length, prs, ups, stalls,
    mins: mins !== null && mins <= 300 ? mins : null, // ignore workouts left open for hours
    sets: sum(saved.map((h) => h.sets.length)), volume: sum(saved.map(kgLifted)),
  };
  saveState();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---------- Data safety: backups, storage, Home Screen ----------------------
const BACKUP_EVERY_DAYS = 7;
const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// "Remind me later" is a per-device convenience, so it lives outside the app data.
function snoozed(key) {
  try { return Date.now() < (JSON.parse(localStorage.getItem('pot.snooze') || '{}')[key] || 0); } catch (err) { return false; }
}
function snooze(key, days) {
  try {
    const s = JSON.parse(localStorage.getItem('pot.snooze') || '{}');
    s[key] = Date.now() + days * 864e5;
    localStorage.setItem('pot.snooze', JSON.stringify(s));
  } catch (err) { /* ignore */ }
}

const hasData = () => state.history.length > 0 || Object.keys(state.food.log).length > 0;
const daysSinceBackup = () => (state.settings.lastBackup ? daysBetween(state.settings.lastBackup, todayISO()) : Infinity);

function noticesHtml() {
  let html = '';
  if (isIOS() && !isStandalone() && !snoozed('install')) {
    html += `<section class="card mb-4 border-indigo-500 dark:border-indigo-500">
      <p class="font-semibold">Add the app to your Home Screen</p>
      <p class="mt-1 text-sm muted">It opens full-screen, works without signal, and iPhone won’t clear your data if you skip a week. In Safari tap <b>Share</b> <span aria-hidden="true">⬆︎</span> then <b>Add to Home Screen</b>.</p>
      ${hasData() ? `<p class="mt-2 text-sm">The Home Screen app keeps its own storage, so <b>back up here first</b>, then open the new icon and tap <b>Restore</b>.</p>
      <button class="btn-primary mt-2 px-3 py-2 text-sm" data-action="export">Back up first</button>` : ''}
      <button class="link mt-2 block" data-action="snooze" data-key="install" data-days="14">Remind me later</button>
    </section>`;
  }
  if (isStandalone() && !hasData() && !snoozed('restore')) {
    html += `<section class="card mb-4 border-indigo-500 dark:border-indigo-500">
      <p class="font-semibold">Moving over from Safari?</p>
      <p class="mt-1 text-sm muted">Restore the backup you saved to bring your workouts and food log across.</p>
      <div class="mt-2 flex items-center gap-4">
        <button class="btn-primary px-3 py-2 text-sm" data-action="import">Restore a backup</button>
        <button class="link" data-action="snooze" data-key="restore" data-days="3650">I’m starting fresh</button>
      </div>
    </section>`;
  }
  if (hasData() && daysSinceBackup() >= BACKUP_EVERY_DAYS && !snoozed('backup')) {
    const d = daysSinceBackup();
    html += `<section class="card mb-4 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="font-semibold">Time for a backup</p>
        <p class="text-sm muted">${d === Infinity ? 'You haven’t backed up yet.' : `Last backup ${d} days ago.`} Save a copy to iCloud Drive or Files.</p>
      </div>
      <div class="flex shrink-0 flex-col gap-1">
        <button class="btn-primary px-3 py-2 text-sm" data-action="export">Back up</button>
        <button class="link text-xs" data-action="snooze" data-key="backup" data-days="3">Later</button>
      </div>
    </section>`;
  }
  return html;
}

/** Characters this app keeps in the browser's local storage. */
function storageUsed() {
  let chars = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      chars += k.length + (localStorage.getItem(k) || '').length;
    }
  } catch (err) { /* ignore */ }
  return chars;
}

function dataSafetyHtml() {
  const bytes = storageUsed() * 2; // stored as UTF-16
  const limit = 5 * 1024 * 1024;
  const pct = Math.min(100, (bytes / limit) * 100);
  const d = daysSinceBackup();
  return `<div class="rounded-xl bg-slate-100 p-3 dark:bg-slate-800/60">
    <div class="flex items-baseline justify-between text-sm"><span class="font-medium">Data stored on this phone</span><span class="tabular-nums">${bytes < 1e6 ? `${Math.max(1, Math.round(bytes / 1024))} KB` : `${(bytes / 1048576).toFixed(1)} MB`} <span class="muted">of ~5 MB</span></span></div>
    <div class="mt-1.5 h-2 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-700"><div class="h-full rounded-full ${pct > 70 ? 'bg-amber-500' : 'bg-indigo-500'}" style="width:${Math.max(1, pct)}%"></div></div>
    <p class="mt-1.5 text-xs ${pct > 70 ? 'text-amber-700 dark:text-amber-400' : 'muted'}">${pct > 70 ? 'Getting full. Back up now and keep the file safe.' : 'Safari allows each site about 5 MB.'} ${d === Infinity ? 'Not backed up yet.' : `Last backup: ${d === 0 ? 'today' : `${d} day${d === 1 ? '' : 's'} ago`}.`}</p>
    ${isStandalone() ? '' : '<p class="mt-1 text-xs muted">Tip: add the app to your Home Screen so iPhone never clears your data.</p>'}
  </div>`;
}

/** Save a backup file, via the iPhone share sheet (iCloud Drive, Files…) where available. */
async function exportData() {
  const { draft, ...data } = state;
  const json = JSON.stringify({ ...data, settings: { ...data.settings, lastBackup: todayISO() } }, null, 2);
  const name = `overload-tracker-backup-${todayISO()}.json`;
  const file = new File([json], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'Overload Tracker backup' });
    } catch (err) {
      if (err.name === 'AbortError') return; // cancelled
      throw err;
    }
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  state.settings.lastBackup = todayISO();
  saveState();
  render();
  toast('Backup saved');
}

document.getElementById('import-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.exercises) || !Array.isArray(data.history)) throw new Error('bad file');
    if (!confirm('Replace all current data with this backup?')) return;
    state = migrate({ ...data, draft: null });
    saveState();
    render();
    toast('Backup imported');
  } catch (err) {
    toast('That file is not a valid Overload Tracker backup');
  }
});

document.addEventListener('click', (e) => {
  if (e.target.id === 'modal') { modal = null; renderModal(); return; }
  const btn = e.target.closest('[data-action]');
  if (!btn || btn.tagName === 'INPUT' || btn.tagName === 'SELECT') return;
  const { action, id } = btn.dataset;
  const ei = Number(btn.dataset.e), si = Number(btn.dataset.s);
  const entry = state.draft?.entries[ei];

  switch (action) {
    case 'nav': view = btn.dataset.view; editingId = null; routineEdit = null; render(); window.scrollTo(0, 0); return;
    case 'goto-exercises': view = 'exercises'; render(); return;
    case 'goto-today': view = 'today'; render(); return;
    case 'toggle-theme': {
      const dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('pot.theme', dark ? 'dark' : 'light'); } catch (err) {}
      return;
    }

    // Workout logging
    case 'start-routine':
      if (state.draft?.entries.length && !confirm('Replace the workout in progress?')) return;
      startRoutine(id); modal = null; window.scrollTo(0, 0); break;
    case 'add-entry': addEntry(id); break;
    case 'add-all': {
      const inDraft = new Set((state.draft?.entries || []).map((en) => en.exerciseId));
      state.exercises.filter((x) => !inDraft.has(x.id)).forEach((x) => addEntry(x.id));
      break;
    }
    case 'remove-entry':
      if (entry.sets.some((s) => s.reps !== '') && !confirm('Remove this exercise and its logged sets?')) return;
      state.draft.entries.splice(ei, 1); break;
    case 'add-set': {
      const lastSet = entry.sets[entry.sets.length - 1];
      entry.sets.push({ weight: lastSet ? lastSet.weight : String(predict(exById(entry.exerciseId)).weight), reps: '' });
      break;
    }
    case 'remove-set': entry.sets.splice(si, 1); break;
    case 'fill-set': {
      const ex = exById(entry.exerciseId), p = predict(ex), s = entry.sets[si];
      if (parseInt(s.reps, 10) > 0) s.reps = ''; // tap again to un-mark
      else {
        if (s.weight === '') s.weight = String(p.weight);
        s.reps = String(targetReps(p, ex, si));
        startRest(ex.rest || 90, ex.name);
      }
      break;
    }
    case 'rest-start': { const ex = exById(entry.exerciseId); startRest(ex.rest || 90, ex.name); return; }
    case 'rest-adjust':
      if (rest) {
        rest.end = Math.max(Date.now(), rest.end + Number(btn.dataset.sec) * 1000);
        rest.total = Math.max(rest.total, Math.ceil((rest.end - Date.now()) / 1000));
        rest.alerted = false;
        tickRest();
      }
      return;
    case 'rest-skip': rest = null; tickRest(); return;
    case 'toggle-warmup': entry.showWarmup = !entry.showWarmup; break;
    case 'swap-entry': modal = { type: 'swap', e: ei }; renderModal(); return;
    case 'swap-to': {
      const en = state.draft?.entries[modal.e], ex = exById(id);
      if (!en || !ex) return;
      if (en.sets.some((x) => x.reps !== '') && !confirm('Swap this exercise? The sets you’ve logged for it will be cleared.')) return;
      const p = predict(ex);
      Object.assign(en, { exerciseId: id, sets: p.reps.map(() => ({ weight: String(p.weight), reps: '' })), note: '', rpe: '', deload: false });
      modal = null;
      toast(`Swapped to ${ex.name}`);
      break;
    }
    case 'apply-deload': {
      const stall = plateau(exById(entry.exerciseId));
      if (!stall) return;
      entry.deload = true;
      entry.sets.forEach((s) => (s.weight = String(stall.weight)));
      break;
    }
    case 'undo-deload': {
      const p = predict(exById(entry.exerciseId));
      entry.deload = false;
      entry.sets.forEach((s) => (s.weight = String(p.weight)));
      break;
    }
    case 'finish': return finishWorkout();
    case 'discard':
      if (!confirm('Discard this workout’s logged sets?')) return;
      state.draft = null; rest = null; tickRest(); break;

    // Plan
    case 'open-day': modal = { type: 'day', date: btn.dataset.date }; renderModal(); return;
    case 'close-modal': modal = null; renderModal(); return;
    case 'plan-week': {
      const dir = Number(btn.dataset.dir);
      planWeek = dir ? addDays(planWeek, 7 * dir) : weekStart(todayISO());
      break;
    }
    case 'day-move': {
      const from = btn.dataset.date, to = document.getElementById('move-to').value;
      const r = plannedRoutine(from);
      if (!r || !to || to === from) return toast('Pick a different day');
      const replaced = plannedRoutine(to);
      setDayPlan(from, null);
      setDayPlan(to, r.id);
      modal = null;
      toast(`${r.name} moved to ${fmtDay(to)}${replaced && replaced.id !== r.id ? ` (replaces ${replaced.name})` : ''}`);
      break;
    }
    case 'day-reset': delete state.schedule.overrides[btn.dataset.date]; break;
    case 'new-routine': routineEdit = { id: null, name: '', exerciseIds: [] }; break;
    case 'edit-routine': { const r = routineById(id); routineEdit = { id: r.id, name: r.name, exerciseIds: r.exerciseIds.filter(exById) }; break; }
    case 'cancel-routine': routineEdit = null; break;
    case 'routine-move': {
      const k = Number(btn.dataset.k), j = k + Number(btn.dataset.dir);
      const ids = routineEdit.exerciseIds;
      [ids[k], ids[j]] = [ids[j], ids[k]];
      render(); return;
    }
    case 'routine-remove': routineEdit.exerciseIds.splice(Number(btn.dataset.k), 1); render(); return;
    case 'save-routine': {
      const name = routineEdit.name.trim();
      if (!name) return toast('Give the routine a name');
      if (!routineEdit.exerciseIds.length) return toast('Add at least one exercise');
      if (routineEdit.id) Object.assign(routineById(routineEdit.id), { name, exerciseIds: routineEdit.exerciseIds });
      else state.routines.push({ id: uid(), name, exerciseIds: routineEdit.exerciseIds });
      toast(`Saved ${name}`);
      routineEdit = null;
      break;
    }
    case 'delete-routine': {
      const r = routineById(id);
      if (!confirm(`Delete the “${r.name}” routine? It will be removed from your schedule. Logged history is kept.`)) return;
      state.routines = state.routines.filter((x) => x.id !== id);
      Object.keys(state.schedule.weekly).forEach((k) => { if (state.schedule.weekly[k] === id) delete state.schedule.weekly[k]; });
      Object.keys(state.schedule.overrides).forEach((k) => { if (state.schedule.overrides[k] === id) delete state.schedule.overrides[k]; });
      break;
    }

    // Stats
    case 'stats-week': statsWeek = addDays(statsWeek, 7 * Number(btn.dataset.dir)); render(); return;
    case 'bar': btn.closest('[data-chart]').querySelector('[data-readout]').innerHTML = btn.dataset.readout; return;

    // Exercises
    case 'open-library': modal = { type: 'library' }; renderModal(); return;
    case 'lib-step': lib.step = Number(btn.dataset.step); renderModal(); return;
    case 'lib-add': return addFromLibrary();
    case 'muscle': btn.dataset.level = { 0: '1', 1: '0.5', 0.5: '0' }[btn.dataset.level] ?? '0'; return;
    case 'edit-ex': editingId = id; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
    case 'cancel-edit': editingId = null; render(); return;
    case 'delete-ex': {
      const ex = exById(id);
      if (!confirm(`Delete “${ex.name}” and all of its history?`)) return;
      state.exercises = state.exercises.filter((x) => x.id !== id);
      state.history = state.history.filter((h) => h.exerciseId !== id);
      state.routines.forEach((r) => (r.exerciseIds = r.exerciseIds.filter((x) => x !== id)));
      if (state.draft) state.draft.entries = state.draft.entries.filter((en) => en.exerciseId !== id);
      if (editingId === id) editingId = null;
      break;
    }

    // History
    case 'delete-session':
      if (!confirm('Delete this logged session? Future targets will be recalculated.')) return;
      state.history = state.history.filter((h) => h.id !== id); break;
    case 'export': exportData().catch(() => toast('Couldn’t save the backup. Try again.')); return;
    case 'snooze': snooze(btn.dataset.key, Number(btn.dataset.days)); render(); return;
    case 'import': document.getElementById('import-file').click(); return;
    case 'reset':
      if (!confirm('Erase ALL exercises, routines, schedule and history from this browser? This cannot be undone.')) return;
      state = migrate({}); rest = null; tickRest(); break;
    default: return;
  }
  saveState();
  render();
});

// Live logging: update state without re-rendering (keeps keyboard focus).
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.field) {
    const ei = Number(el.dataset.e), si = Number(el.dataset.s);
    const entry = state.draft.entries[ei];
    entry.sets[si][el.dataset.field] = el.value;
    saveState();
    const ex = exById(entry.exerciseId);
    document.getElementById(`row-${ei}-${si}`).classList.toggle('done', parseInt(entry.sets[si].reps, 10) > 0);
    const p = predict(ex);
    document.getElementById(`progress-${ei}`).innerHTML = progressHtml(entry, ex, p);
    if (el.dataset.field === 'weight') document.getElementById(`warm-${ei}`).innerHTML = warmupHtml(entry, ex, p, plateau(ex));
  } else if (el.dataset.entryField) {
    state.draft.entries[Number(el.dataset.e)][el.dataset.entryField] = el.value;
    saveState();
  } else if (el.dataset.routineField) {
    routineEdit[el.dataset.routineField] = el.value;
  } else if (el.dataset.lib) {
    lib[el.dataset.lib] = el.value;
    refreshLibrary();
  } else if (el.dataset.libWeight) {
    lib.picked.set(Number(el.dataset.libWeight), el.value);
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.libPick) {
    const idx = Number(el.dataset.libPick);
    if (el.checked) lib.picked.set(idx, ''); else lib.picked.delete(idx);
    refreshLibrary();
    return;
  }
  switch (el.dataset.action) {
    case 'draft-date': state.draft.date = el.value || todayISO(); break;
    case 'weekly-set':
      if (el.value) state.schedule.weekly[el.dataset.dow] = el.value;
      else delete state.schedule.weekly[el.dataset.dow];
      render(); break;
    case 'day-set': setDayPlan(el.dataset.date, el.value || null); render(); break;
    case 'routine-add': if (el.value) routineEdit.exerciseIds.push(el.value); render(); return;
    case 'stats-ex': statsExId = el.value; render(); return;
    case 'bar-weight': state.settings.barWeight = Number(el.value); break;
    default:
      if (el.name === 'type' || el.name === 'bwMode') syncMachineToggle();
      return;
  }
  saveState();
});

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'ex-form') return;
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const name = String(fd.get('name')).trim();
  const repMin = parseInt(fd.get('repMin'), 10);
  const repMax = parseInt(fd.get('repMax'), 10);
  const sets = parseInt(fd.get('sets'), 10);
  const startWeight = parseFloat(fd.get('startWeight')) || 0;
  if (!name) return toast('Give the exercise a name');
  if (!(repMin > 0 && repMax > repMin)) return toast('Rep range max must be higher than min');
  if (!(sets >= 1 && sets <= 10)) return toast('Working sets must be between 1 and 10');

  const muscles = {};
  form.querySelectorAll('#muscle-chips [data-m]').forEach((c) => { const l = Number(c.dataset.level); if (l) muscles[c.dataset.m] = l; });

  const data = {
    name, type: fd.get('type'), bwMode: fd.get('bwMode') || 'weighted', machineStep: Number(fd.get('machineStep')) === 3 ? 3 : 4,
    repMin, repMax, sets, startWeight, muscles, rest: Number(fd.get('rest')) || 90,
  };
  if (editingId) {
    Object.assign(exById(editingId), data);
    toast('Exercise updated');
    editingId = null;
  } else {
    state.exercises.push({ id: uid(), ...data });
    toast(`Added ${name}`);
  }
  saveState();
  render();
});

// ---------- Update notice ----------------------------------------------------
// Phones can keep running a cached copy of the page. Compare this page's code
// with the code in a fresh copy from the server and offer a one-tap update.
let lastUpdateCheck = 0;
async function checkForUpdate() {
  if (location.protocol === 'file:' || !SELF_CODE || Date.now() - lastUpdateCheck < 5 * 60 * 1000) return;
  lastUpdateCheck = Date.now();
  try {
    const r = await fetch(location.pathname, { cache: 'no-store' });
    if (!r.ok) return;
    const html = await r.text();
    const open = '<scr' + 'ipt>', close = '</scr' + 'ipt>'; // split so this script doesn't end itself
    const end = html.lastIndexOf(close), start = html.lastIndexOf(open, end);
    if (start < 0 || end < start) return;
    if (html.slice(start + open.length, end) !== SELF_CODE) document.getElementById('update-banner').classList.remove('hidden');
  } catch (err) { /* offline: try again later */ }
}

document.addEventListener('click', async (e) => {
  if (!e.target.closest('[data-action=apply-update]')) return;
  try { await fetch(location.pathname, { cache: 'reload' }); } catch (err) { /* reload anyway */ }
  location.reload();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });

render();
checkForUpdate();
navigator.storage?.persist?.().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
