const mealNow = () => { const h = new Date().getHours(); return h < 11 ? 'breakfast' : h < 15 ? 'lunch' : h < 20 ? 'dinner' : 'snacks'; };

/**
 * Things you've eaten before (last 4 weeks, as you usually have them),
 * favourites and saved meals that fit the calories left, highest protein
 * per calorie first.
 */
function proteinIdeas(kcalLeft, today) {
  const seen = new Set(), out = [];
  const add = (key, name, sub, n, item) => {
    if (seen.has(key) || !(n.protein >= 8) || n.kcal > kcalLeft + 50 || n.kcal <= 0) return;
    seen.add(key);
    out.push({ key, name, sub, n, item, score: n.protein / n.kcal });
  };
  const eatenToday = new Set(dayEntries(today).map((e) => e.foodId || e.name));
  Object.keys(state.food.log).filter((d) => d < today && d >= addDays(today, -28)).sort().reverse()
    .forEach((d) => dayEntries(d).forEach((e) => {
      const key = e.foodId || `q:${e.name}`;
      if (!eatenToday.has(e.foodId || e.name)) add(key, e.name, e.foodId ? amountLabel(e) : 'quick add', e.n, { kind: 'entry', e });
    }));
  state.food.favs.map(foodById).filter(Boolean).forEach((f) => {
    const u = (f.portions || [])[0] || { label: 'g', g: 100 };
    const qty = u.label === 'g' ? 100 : 1, g = u.label === 'g' ? 100 : u.g;
    add(f.id, f.name, u.label === 'g' ? '100 g' : `1 × ${u.label.replace(/^1 /, '')}`, scaleN(f.n, g), { kind: 'entry', e: { foodId: f.id, name: f.name, qty, unit: u.label, g, n: scaleN(f.n, g) } });
  });
  state.food.meals.forEach((m) => {
    const n = Object.fromEntries(NKEYS.map((k) => [k, round1(sum(m.items.map((i) => i.n[k] || 0)))]));
    add(`m:${m.id}`, m.name, 'saved meal', n, { kind: 'meal', m });
  });
  return out.sort((a, b) => b.score - a.score).slice(0, 4);
}

// ----- Weekly calorie budget -----
/**
 * The week's calories (Mon–Sun) as one budget. Past days that weren't fully
 * logged (<800 kcal) count as on target. Targets themselves don't change.
 */
function weekBudget(date) {
  const ws = weekStart(date), today = todayISO();
  let target = 0, eaten = 0, diff = 0, logged = 0, unlogged = 0, left = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i), t = targetsFor(d).kcal;
    target += t;
    if (d < today) {
      const k = dayTotals(d).kcal;
      if (k >= 800) { eaten += k; diff += t - k; logged++; } else { eaten += t; unlogged++; }
    } else if (d === today) eaten += dayTotals(d).kcal;
    else left++;
  }
  return { ws, target, eaten, diff, logged, unlogged, daysLeft: left + (today >= ws && today <= addDays(ws, 6) ? 1 : 0) };
}

function budgetCard() {
  if (!state.food.targets || weekStart(foodDate) !== weekStart(todayISO())) return '';
  const b = weekBudget(foodDate);
  const pct = Math.min(100, (b.eaten / b.target) * 100);
  const perDay = b.daysLeft ? Math.round(b.diff / b.daysLeft / 10) * 10 : 0;
  let msg = '';
  if (!b.logged) msg = 'Log full days and this shows whether you’re ahead or behind for the week.';
  else if (Math.abs(b.diff) < 100) msg = 'Right on track for the week so far.';
  else if (b.diff > 0) msg = `You’re <b>${fmtKg(b.diff)} kcal under</b> so far. That’s room for about <b>+${fmtKg(perDay)} kcal a day</b> for the rest of the week, or save it for the weekend.`;
  else msg = `You’re <b>${fmtKg(-b.diff)} kcal over</b> so far. About <b>${fmtKg(-perDay)} kcal a day</b> less for the rest of the week evens it out. No need to cut harder than that.`;
  return `<section class="card mb-4">
    <div class="flex items-baseline justify-between gap-2">
      <h3 class="font-semibold">This week’s budget</h3>
      <span class="text-sm tabular-nums"><b>${fmtKg(b.eaten)}</b><span class="muted"> / ${fmtKg(b.target)} kcal</span></span>
    </div>

  </section>`;
}

// ----- Macro calculator (for anyone; never changes your targets unless you ask) -----
const MC_GOALS = [['lose-fast', -750, 'Lose ~0.75 kg a week', 'Only with a lot to lose'], ['lose', -500, 'Lose ~0.5 kg a week', ''], ['lose-slow', -250, 'Lose ~0.25 kg a week', ''],
  ['maintain', 0, 'Maintain weight', ''], ['gain-slow', 250, 'Lean gain ~0.25 kg a week', ''], ['gain', 500, 'Gain ~0.5 kg a week', 'Faster, more fat gain']];
const MC_PROTEIN = [[1.6, '1.6 g/kg', 'Minimum for gym-goers'], [1.8, '1.8 g/kg', 'Good default'], [2, '2.0 g/kg', 'Dieting, keep muscle'], [2.2, '2.2 g/kg', 'Hard cut']];
const mcBlank = () => ({ id: null, name: '', sex: 'female', age: '', height: '', weight: '', goalKg: '', activity: 1.55, goal: 'lose-slow', protein: 1.8, fatPct: 30, hUnit: 'cm', wUnit: 'kg' });

function mcResult(p) {
  if (!(p.age > 0 && p.height > 0 && p.weight > 0)) return null;
  const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'female' ? -161 : 5);
  const tdee = Math.round((bmr * p.activity) / 10) * 10;
  const delta = (MC_GOALS.find((g) => g[0] === p.goal) || MC_GOALS[3])[1];
  const floor = p.sex === 'female' ? 1200 : 1500;
  const kcal = Math.max(floor, Math.round((tdee + delta) / 10) * 10);
  // Protein from goal weight when it's lower: very high body weights otherwise give silly numbers.
  const basis = p.goalKg > 0 && p.goalKg < p.weight ? p.goalKg : p.weight;
  const protein = Math.round((p.protein * basis) / 5) * 5;
  const fat = Math.max(Math.round((kcal * p.fatPct) / 100 / 9), Math.round(0.6 * basis));
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return { bmr: Math.round(bmr), tdee, kcal, protein, fat, carbs, basis, floored: kcal === floor && tdee + delta < floor, weekly: round2(((kcal - tdee) * 7) / KCAL_PER_KG) };
}

function mcText(p, r) {
  return `${p.name || 'Targets'}: ${fmtKg(r.kcal)} kcal a day. Protein ${r.protein} g, carbs ${r.carbs} g, fat ${r.fat} g, fibre 30 g+. Maintenance is about ${fmtKg(r.tdee)} kcal.`;
}

function mcOutHtml(p) {
  const r = mcResult(p);
  if (!r) return '<p class="text-sm muted">Fill in age, height and weight to see the numbers.</p>';
  const pct = (g, k) => Math.round(((g * k) / r.kcal) * 100);
  const tile = (label, v, unit, sub) => `<div class="bg-white p-3 dark:bg-slate-900"><p class="label">${label}</p><p class="display text-3xl leading-none tabular-nums">${v}<span class="ml-1 font-sans text-sm font-semibold normal-case muted">${unit}</span></p><p class="mt-1 text-xs muted">${sub}</p></div>`;
  return `<div class="grid grid-cols-2 gap-px overflow-hidden rounded-2xl border border-slate-200 bg-slate-200 dark:border-slate-800 dark:bg-slate-800">
      ${tile('Calories', fmtKg(r.kcal), 'kcal', `Maintenance ≈ ${fmtKg(r.tdee)}`)}
      ${tile('Protein', r.protein, 'g', `${pct(r.protein, 4)}% · ${p.protein} g per kg${r.basis !== Number(p.weight) ? ' of goal weight' : ''}`)}
      ${tile('Carbs', r.carbs, 'g', `${pct(r.carbs, 4)}% · the rest`)}
      ${tile('Fat', r.fat, 'g', `${pct(r.fat, 9)}% of calories`)}
    </div>
    <p class="mt-2 text-sm">${r.weekly < 0 ? `Expect about <b>${fmt(-r.weekly)} kg a week</b> down on average` : r.weekly > 0 ? `Expect about <b>${fmt(r.weekly)} kg a week</b> up on average` : 'Weight should hold steady'}. Fibre 30 g+ a day, salt under 6 g.</p>
    ${r.floored ? `<p class="mt-1 rounded-lg bg-amber-500/10 px-2 py-1 text-xs text-amber-800 dark:text-amber-300">Held at ${fmtKg(r.kcal)} kcal: going lower isn’t a good idea without a doctor or dietitian.</p>` : ''}
    <p class="mt-2 text-xs muted">Mifflin-St Jeor formula × activity. It’s a starting point: after 2–3 weeks, adjust by 100–200 kcal based on the weight trend.</p>`;
}

function macroCalcModal() {

        <div class="min-w-0"><span class="label flex items-center">Height ${unit('hUnit', 'cm', 'ft')}</span>${p.hUnit === 'cm' ? `<input class="input" type="number" inputmode="decimal" step="any" min="0" data-mc="height" value="${p.height || ''}">`
          : `<div class="grid grid-cols-2 gap-2"><input class="input" type="number" inputmode="numeric" placeholder="ft" data-mc="ft" value="${ft}"><input class="input" type="number" inputmode="decimal" placeholder="in" data-mc="in" value="${inch}"></div>`}</div>

document.addEventListener('input', (e) => {
  const el = e.target, k = el.dataset.mc;
  if (!k || modal?.type !== 'macro-calc') return;
  const p = modal.p, v = el.value === '' ? '' : el.tagName === 'SELECT' && k === 'goal' ? el.value : Number(el.value);
  if (k === 'name') p.name = el.value;
  else if (k === 'goal') p.goal = el.value;
  else if (k === 'ft' || k === 'in') { const box = el.parentElement.querySelectorAll('input'); const f = Number(box[0].value) || 0, i = Number(box[1].value) || 0; p.height = f || i ? round1(f * 30.48 + i * 2.54) : ''; }
  else if (k === 'st' || k === 'lb') { const box = el.parentElement.querySelectorAll('input'); const s = Number(box[0].value) || 0, l = Number(box[1].value) || 0; p.weight = s || l ? round1(s * 6.35029 + l * 0.453592) : ''; }
  else p[k] = v;
  document.getElementById('mc-out').innerHTML = mcOutHtml(p);
});
document.addEventListener('change', (e) => { if (e.target.dataset.mc && modal?.type === 'macro-calc' && e.target.tagName === 'SELECT') e.target.dispatchEvent(new Event('input', { bubbles: true })); });

document.addEventListener('click', async (e) => {
  if (modal?.type !== 'macro-calc') return;
  const b = e.target.closest('[data-mcp],[data-mcu],[data-mcload],[data-mcact]');
  if (!b) return;
  const p = modal.p;
  if (b.dataset.mcp) { p[b.dataset.mcp] = isNaN(Number(b.dataset.val)) ? b.dataset.val : Number(b.dataset.val); renderModal(); return; }
  if (b.dataset.mcu) { p[b.dataset.mcu] = b.dataset.val; renderModal(); return; }
  if (b.dataset.mcload !== undefined) { const x = state.food.calcPeople.find((q) => q.id === b.dataset.mcload); modal.p = x ? { ...mcBlank(), ...x } : mcBlank(); renderModal(); return; }
  const r = mcResult(p);
  switch (b.dataset.mcact) {
    case 'copy':
      if (!r) return toast('Fill in age, height and weight first');
      try { await navigator.clipboard.writeText(mcText(p, r)); toast('Copied: paste it into a message'); } catch (err) { toast(mcText(p, r)); }
      return;
    case 'save': {
      if (!p.name.trim()) return toast('Add a name to save them');
      if (!p.id) p.id = uid();
      const list = state.food.calcPeople, i = list.findIndex((q) => q.id === p.id);
      if (i >= 0) list[i] = { ...p }; else list.push({ ...p });
      saveState(); renderModal(); toast(`Saved ${p.name}`);
      return;
    }
    case 'delete':
      if (!confirm(`Delete ${p.name}?`)) return;
      state.food.calcPeople = state.food.calcPeople.filter((q) => q.id !== p.id);
      modal.p = mcBlank(); saveState(); renderModal();
      return;
    case 'mine': {
      if (!r) return toast('Fill in age, height and weight first');
      if (!confirm(`Replace your daily targets with ${fmtKg(r.kcal)} kcal, ${r.protein} g protein, ${r.carbs} g carbs and ${r.fat} g fat?`)) return;
      state.food.targets = { kcal: r.kcal, protein: r.protein, carbs: r.carbs, fat: r.fat, ...fixedTargets(r.kcal), custom: true };
      modal = null; saveState(); render(); toast('Your targets are updated');
    }
  }
});

function foodSummary(tot, t) {
  const left = Math.round(t.kcal - tot.kcal);
  const R = 42, C = 2 * Math.PI * R;
  const pct = Math.min(1, tot.kcal / t.kcal);
  const bar = (k, label) => {
    const v = tot[k], target = t[k];
    return `<div>
      <div class="flex items-baseline justify-between text-sm"><span class="font-medium">${label}</span><span class="tabular-nums"><b>${Math.round(v)}</b><span class="muted"> / ${target} g</span></span></div>
      <div class="mt-1 h-2 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-800"><div class="h-full rounded-full bg-indigo-500" style="width:${Math.min(100, (v / target) * 100)}%"></div></div>
    </div>`;
  };
  const small = NUTRIENTS.slice(4).map(([k, label, kind]) => {
    const v = tot[k], target = t[k];
    const over = kind === 'max' && v > target;
    return `<div class="rounded-xl bg-slate-100 px-2 py-2 text-center dark:bg-slate-800/60">
      <p class="text-[11px] font-semibold uppercase tracking-wide muted">${label}</p>
      <p class="font-bold tabular-nums ${over ? 'text-rose-600 dark:text-rose-400' : ''}">${fmt(v)} g</p>
      <p class="text-[10px] muted">${kind === 'max' ? `${over ? 'over ' : ''}max ${target}` : `aim ${target}+`}</p>
    </div>`;
  }).join('');
  return `<section class="card mb-4">
    <div class="flex items-center gap-4">
      <div class="relative h-32 w-32 shrink-0">
        <svg viewBox="0 0 100 100" class="h-full w-full -rotate-90">
          <circle cx="50" cy="50" r="${R}" fill="none" stroke-width="9" class="stroke-slate-200 dark:stroke-slate-800"/>
          <circle cx="50" cy="50" r="${R}" fill="none" stroke-width="9" stroke-linecap="round" stroke="${left < 0 ? '#f43f5e' : '#6366f1'}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="text-2xl font-extrabold tabular-nums">${fmtKg(Math.abs(left))}</span>
          <span class="text-xs font-semibold ${left < 0 ? 'text-rose-600 dark:text-rose-400' : 'muted'}">kcal ${left < 0 ? 'over' : 'left'}</span>
        </div>
      </div>
      <div class="min-w-0 flex-1 space-y-2.5">
        <p class="text-sm muted"><b class="text-slate-900 dark:text-slate-100">${fmtKg(tot.kcal)}</b> eaten of ${fmtKg(t.kcal)}</p>
        ${bar('protein', 'Protein')}${bar('carbs', 'Carbs')}${bar('fat', 'Fat')}
      </div>
    </div>
    <div class="mt-4 grid grid-cols-4 gap-2">${small}</div>
  </section>`;
}

/** Weigh-in dots plus the trend line, with a tap/hover readout. */
function weightChart(pts, hide = state.food.prefs.trendOnly) {
  const W = 340, H = 170, pl = 36, pr = 10, pt = 10, pb = 22;
  const vals = pts.flatMap((p) => (hide ? [p.trend] : [p.kg, p.trend]));
  const pad = Math.max(0.5, (Math.max(...vals) - Math.min(...vals)) * 0.15);
  const lo = Math.floor((Math.min(...vals) - pad) * 2) / 2, hi = Math.ceil((Math.max(...vals) + pad) * 2) / 2;
  const t0 = parseISO(pts[0].date).getTime(), t1 = parseISO(pts[pts.length - 1].date).getTime();
  const x = (d) => round2(pl + (t1 === t0 ? (W - pl - pr) / 2 : ((parseISO(d).getTime() - t0) / (t1 - t0)) * (W - pl - pr)));
  const y = (v) => round2(pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb));
  const ticks = [lo, (lo + hi) / 2, hi].map(round1);
  const xy = pts.map((p) => ({ x: x(p.date), label: hide ? `${fmtDay(p.date)}: trend <b>${fmt(round1(p.trend))} kg</b>` : `${fmtDay(p.date)}: <b>${fmt(p.kg)} kg</b> <span class="muted">· trend ${fmt(round1(p.trend))} kg</span>` }));
  return `<div data-chart="weight" data-points="${esc(JSON.stringify(xy))}">
    <div class="mb-1 flex items-center gap-4 text-xs muted">
      ${hide ? '' : '<span class="flex items-center gap-1.5"><span class="inline-block h-2 w-2 rounded-full bg-slate-400"></span>Daily weigh-in</span>'}
      <span class="flex items-center gap-1.5"><span class="inline-block h-0.5 w-4 rounded bg-indigo-500"></span>Trend</span>
    </div>
    <p class="mb-1 text-sm" data-readout>${xy[xy.length - 1].label}</p>
    <svg viewBox="0 0 ${W} ${H}" class="h-auto w-full touch-none select-none overflow-visible" role="img" aria-label="Weight trend chart">
      ${ticks.map((v) => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="stroke-slate-200 dark:stroke-slate-800" stroke-width="1"/>
        <text x="${pl - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" class="fill-slate-500 dark:fill-slate-400">${fmt(v)}</text>`).join('')}
      <text x="${pl}" y="${H - 6}" font-size="10" class="fill-slate-500 dark:fill-slate-400">${fmtShort(pts[0].date)}</text>
      <text x="${W - pr}" y="${H - 6}" font-size="10" text-anchor="end" class="fill-slate-500 dark:fill-slate-400">${fmtShort(pts[pts.length - 1].date)}</text>
      <line data-cross x1="0" x2="0" y1="${pt}" y2="${H - pb}" class="stroke-slate-400 dark:stroke-slate-500" stroke-width="1" visibility="hidden"/>
      ${hide ? '' : pts.map((p) => `<circle cx="${x(p.date)}" cy="${y(p.kg)}" r="3" class="fill-slate-400 dark:fill-slate-500"/>`).join('')}
      <path d="${pts.map((p, k) => `${k ? 'L' : 'M'}${x(p.date)},${y(p.trend)}`).join(' ')}" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
  </div>`;
}

function attachWeightChart() {
  const wrap = document.querySelector('[data-chart=weight]');
  if (!wrap) return;
  const pts = JSON.parse(wrap.dataset.points);
  const svg = wrap.querySelector('svg'), out = wrap.querySelector('[data-readout]'), cross = svg.querySelector('[data-cross]');
  const show = (e) => {
    const r = svg.getBoundingClientRect();
    const vx = ((e.clientX - r.left) / r.width) * 340;
    const p = pts.reduce((b, q) => (Math.abs(q.x - vx) < Math.abs(b.x - vx) ? q : b));
    out.innerHTML = p.label;
    cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x); cross.setAttribute('visibility', 'visible');
  };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
}

const listSection = (title, foods) => (foods.length ? `<h4 class="mt-3 text-xs font-bold uppercase tracking-wide muted">${title}</h4>
  <ul class="divide-y divide-slate-200 dark:divide-slate-800">${foods.map(foodRow).join('')}</ul>` : '');

function matchFoods(foods, q) {
  const words = q.split(/\s+/).filter(Boolean);
  return foods
    .filter((f) => { const s = `${f.name} ${f.brand || ''}`.toLowerCase(); return words.every((w) => s.includes(w)); })
    .sort((a, b) => (b.name.toLowerCase().startsWith(words[0]) - a.name.toLowerCase().startsWith(words[0])) || a.name.length - b.name.length);
}

function foodResults() {
  const q = modal.query.trim().toLowerCase();
  const mine = Object.values(state.food.foods);
  if (!q) {
    const favs = state.food.favs.map(foodById).filter(Boolean);
    const recent = recentFoodIds().filter((id) => !state.food.favs.includes(id)).map(foodById);
    const custom = mine.filter((f) => (f.src === 'custom' || f.src === 'recipe') && !state.food.favs.includes(f.id));
    const html = (modal.target === 'recipe' ? '' : savedMealsSection(state.food.meals)) +
      listSection('★ Favourites', favs) + listSection('Recent', recent) + listSection('My foods &amp; recipes', custom);
    return html || `<p class="rounded-xl bg-slate-100 p-4 text-sm muted dark:bg-slate-800/60">Search for a food, or scan a barcode. Foods you log will appear here for quick re-adding.</p>`;
  }
  const off = modal.off;
  let offHtml;
  if (off.q === q && off.state === 'done') {
    offHtml = off.items.length ? listSection('UK shops &amp; brands', off.items) : '<p class="mt-3 text-sm muted">No UK products found. Try fewer words, or scan the barcode.</p>';
  } else if (off.q === q && off.state === 'loading') {
    offHtml = `<p class="mt-3 text-sm muted">${off.retrying ? 'Food database is busy, retrying in a few seconds…' : 'Searching UK products…'}</p>`;
  } else {
    offHtml = `${off.q === q && off.state === 'error' ? `<p class="mt-3 text-sm text-rose-600 dark:text-rose-400">The food database is busy (it limits how often you can search). Wait a minute and try again, or scan the barcode instead.</p><p class="mt-1 text-xs muted">Details: ${esc(off.reason || '')}</p>` : ''}
      <button class="btn-ghost mt-3 w-full py-2.5 text-sm" data-food="off-search">Search UK shops &amp; brands for “${esc(modal.query.trim())}”</button>`;
  }
  let local = '';
  if (foodData.products) {
    const items = searchIndex(foodData.productIndex, foodData.products.rows, q, 25, productFood);
    local += items.length ? listSection('UK shops &amp; brands', items) : '<p class="mt-3 text-sm muted">No UK products match. Try fewer words, search online, or scan the barcode.</p>';
    if (!(off.q === q && off.state === 'done')) offHtml = offHtml.replace(/Search UK shops &amp; brands for/, 'Not here? Search online for');
    else offHtml = offHtml.replace('UK shops &amp; brands', 'More from Open Food Facts (online)');
  }
  if (foodData.cofid) local += listSection('UK government data', searchIndex(foodData.cofidIndex, foodData.cofid.rows, q, 10, cofidFood));
  const meals = modal.target === 'recipe' ? [] : state.food.meals.filter((sm) => q.split(/\s+/).every((w) => sm.name.toLowerCase().includes(w)));
  return savedMealsSection(meals) + listSection('Your foods', matchFoods(mine, q).slice(0, 8)) + listSection('UK basics', matchFoods(UK_FOODS, q).slice(0, foodData.products ? 6 : 15)) + local + offHtml;
}

function savedMealsSection(meals) {
  if (!meals.length) return '';
  return `<h4 class="mt-3 text-xs font-bold uppercase tracking-wide muted">Saved meals</h4>
  <ul class="divide-y divide-slate-200 dark:divide-slate-800">${meals.map((sm) => `<li class="flex items-center gap-1">
    <button class="flex min-w-0 flex-1 items-center justify-between gap-3 py-2.5 text-left" data-food="log-meal" data-id="${sm.id}">

function recipeSums() {
  const r = modal.recipe;
  const servings = Math.max(1, parseInt(r.servings, 10) || 1);
  const tot = Object.fromEntries(NKEYS.map((k) => [k, sum(r.items.map((i) => i.n[k] || 0))]));
  return { servings, tot, g: sum(r.items.map((i) => i.g)) };
}

  const { servings: s, tot, g } = recipeSums();
  return `<div class="rounded-xl bg-indigo-500/10 p-3 text-sm">
    <p><b>Per serving:</b> ${Math.round(tot.kcal / s)} kcal · P ${fmt(round1(tot.protein / s))} · C ${fmt(round1(tot.carbs / s))} · F ${fmt(round1(tot.fat / s))} g <span class="muted">(${fmt(round1(g / s))} g)</span></p>

}

        </label>

}

function trainingPreview(kcal, gap, on) {
  const n = trainingDaysPerWeek();

  const sh = trainingShift(gap, n);
  return `Training days <b>${fmtKg(kcal + sh.training)}</b> · rest days <b>${fmtKg(kcal + sh.rest)}</b> kcal <span class="muted">(${n} training day${n === 1 ? '' : 's'} a week in your Plan)</span>`;
}

function fillTargets(form) {

// ----- Open Food Facts & barcode scanning -----
function offToFood(p) {
  const nm = p?.nutriments || {};
  let kcal = nm['energy-kcal_100g'];
  if (kcal == null && nm.energy_100g != null) kcal = nm.energy_100g / 4.184; // kJ → kcal
  if (kcal == null || !p.code) return null;
  const num = (v) => round1(Number(v) || 0);
  const servingG = Number(p.serving_quantity);
  return {
    id: `off:${p.code}`, src: 'off', code: String(p.code),
    name: String(p.product_name || p.product_name_en || p.generic_name || 'Unnamed product').trim(),
    brand: String([].concat(p.brands || '')[0]).split(',')[0].trim(),
    n: {
      kcal: num(kcal), protein: num(nm.proteins_100g), carbs: num(nm.carbohydrates_100g), sugar: num(nm.sugars_100g),
      fat: num(nm.fat_100g), satfat: num(nm['saturated-fat_100g']), fibre: num(nm.fiber_100g),
      salt: num(nm.salt_100g ?? (nm.sodium_100g != null ? nm.sodium_100g * 2.5 : 0)),
    },
    portions: servingG > 0 ? [{ label: '1 serving', g: servingG }] : [],
  };
}

/** Fetch JSON with a timeout; throws a short, human-readable reason on failure. */
async function getJSON(url, ms = 20000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    try { return await r.json(); } catch (err) { throw new Error('not JSON (service busy?)'); }
  } catch (err) {
    throw new Error(err.name === 'AbortError' ? 'timed out' : err.message || 'network error');
  } finally {
    clearTimeout(timer);
  }
}

// Open Food Facts search services, tried in order until one answers.
const OFF_SEARCHES = [
  ['search', (q) => `https://search.openfoodfacts.org/search?q=${encodeURIComponent(`${q} countries_tags:"en:united-kingdom"`)}&page_size=30&fields=${OFF_FIELDS},product_name_en`, (j) => j.hits],
  ['classic', (q) => `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=30&tagtype_0=countries&tag_contains_0=contains&tag_0=united-kingdom&fields=${OFF_FIELDS}`, (j) => j.products],
];

// Search results are remembered for a day: OFF allows only ~10 searches a minute.
const OFF_CACHE_KEY = 'pot.offcache';
const OFF_CACHE_MS = 24 * 3600 * 1000;
function offCacheGet(q) {
  try {
    const hit = JSON.parse(localStorage.getItem(OFF_CACHE_KEY) || '{}')[q];
    return hit && Date.now() - hit.at < OFF_CACHE_MS ? hit.items : null;
  } catch (err) { return null; }
}
function offCachePut(q, items) {
  try {
    const cache = JSON.parse(localStorage.getItem(OFF_CACHE_KEY) || '{}');
    cache[q] = { at: Date.now(), items };
    const keys = Object.keys(cache).sort((a, b) => cache[b].at - cache[a].at);
    keys.slice(40).forEach((k) => delete cache[k]);
    localStorage.setItem(OFF_CACHE_KEY, JSON.stringify(cache));
  } catch (err) { /* cache is optional */ }
}

async function searchOFF(q) {
  const reasons = [];
  for (const [name, url, pick] of OFF_SEARCHES) {
    try {
      const list = pick(await getJSON(url(q)));
      if (!Array.isArray(list)) throw new Error('unexpected reply');
      const seen = new Set();
      return { items: list.map(offToFood).filter((f) => f && !seen.has(f.id) && seen.add(f.id)) };
    } catch (err) {
      reasons.push(`${name}: ${err.message}`);
    }
  }
  return { reason: reasons.join(' · ') };
}

async function offSearch() {
  const q = modal.query.trim().toLowerCase();
  if (!q || (modal.off.q === q && modal.off.state === 'loading')) return;
  const done = (patch) => { if (modal?.off?.q === q) { modal.off = { q, ...patch }; refreshFoodResults(); } };
  const cached = offCacheGet(q);
  if (cached) { modal.off = { q, state: 'done', items: cached }; return refreshFoodResults(); }

  modal.off = { q, state: 'loading', items: [] };
  refreshFoodResults();
  let res = await searchOFF(q);
  if (!res.items && modal?.off?.q === q) {
    // Usually the per-minute limit: wait briefly and try once more.
    modal.off.retrying = true; refreshFoodResults();
    await new Promise((r) => setTimeout(r, 6000));
    if (modal?.off?.q !== q) return;
    res = await searchOFF(q);
  }
  if (res.items) { offCachePut(q, res.items); done({ state: 'done', items: res.items }); }
  else done({ state: 'error', items: [], reason: res.reason });
}

function setScanStatus(text) {
  const el = document.getElementById('scan-status');
  if (el) el.textContent = text;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (window.BarcodeDetectionAPI) return resolve();
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('script failed'));
    document.head.appendChild(s);
  });
}

const SCAN_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];
/** Check digit test for EAN-8/12/13: a misread barcode almost never passes. */
function validBarcode(code) {
  if (!/^\d{8}$|^\d{12,13}$/.test(code)) return false;
  const d = code.split('').map(Number), check = d.pop();
  const total = d.reverse().reduce((t, n, i) => t + n * (i % 2 ? 1 : 3), 0);
  return (10 - (total % 10)) % 10 === check;
}

async function startScanner() {
  if (modal?.step !== 'scan' || scanner) return;
  const s = { stream: null, timer: null, last: '', hits: 0 };
  scanner = s;
  let Detector = window.BarcodeDetector;
  try {
    const native = Detector && (await Detector.getSupportedFormats()).includes('ean_13');
    if (!native) { await loadScript(SCANNER_SRC); Detector = window.BarcodeDetectionAPI.BarcodeDetector; }
  } catch (err) { if (scanner === s) scanner = null; return setScanStatus('Couldn’t load the scanner. Check your connection, or type the barcode below.'); }
  try {
    s.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (err) {
    if (scanner === s) scanner = null;
    return setScanStatus(err?.name === 'NotAllowedError'
      ? 'Camera access is blocked. On iPhone: Settings → Safari → Camera → Allow (or Ask), then close and reopen the app. Or type the barcode below.'
      : 'Camera not available. Type the barcode below.');
  }
  if (scanner !== s) return s.stream.getTracks().forEach((t) => t.stop()); // closed while the camera was starting
  const video = document.getElementById('scan-video');
  video.srcObject = s.stream;
  try { await video.play(); } catch (err) { /* autoplay with playsinline + muted is allowed */ }
  const detector = new Detector({ formats: SCAN_FORMATS });
  setScanStatus('Hold the barcode inside the box, about a hand’s width away.');
  let busy = false;
  s.timer = setInterval(async () => {
    if (busy || scanner !== s || video.readyState < 2) return;
    busy = true;
    try {
      const found = (await detector.detect(video)).find((b) => b.format === 'upc_e' || validBarcode(b.rawValue))?.rawValue;
      if (found) {
        // Two matching reads in a row before accepting (rules out a rare misread).
        s.hits = found === s.last ? s.hits + 1 : 1; s.last = found;
        if (s.hits >= 2 && scanner === s) { navigator.vibrate?.(60); stopScanner(); lookupBarcode(found); }
      }
    } catch (err) { /* frame not ready yet */ }
    busy = false;
  }, 120);
}

function stopScanner() {
  if (!scanner) return;
  const s = scanner;
  scanner = null;
  clearInterval(s.timer);
  s.stream?.getTracks().forEach((t) => t.stop());
}

function openAmount(food, entry) {
  const units = unitsFor(food);
  Object.assign(modal, {
    step: 'amount', food, entryId: entry?.id || null,
    unit: entry ? Math.max(0, units.findIndex((u) => u.label === entry.unit)) : units.length > 1 ? 1 : 0,
    qty: entry ? String(entry.qty) : units.length > 1 ? '1' : '100',
  });
  if (entry) modal.meal = entry.meal;
  renderModal();
}

async function lookupBarcode(raw) {
  const code = String(raw).replace(/\D/g, '');
  if (!code) return;
  const known = Object.values(state.food.foods).find((f) => f.code === code);
  if (known) return openAmount(known);
  await loadFoodData();
  const local = foodData.byCode?.get(code) ?? foodData.byCode?.get(code.padStart(13, '0'));
  if (local !== undefined && modal?.type === 'food') return openAmount(productFood(foodData.products.rows[local]));
  setScanStatus(`Looking up ${code}…`);
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${OFF_FIELDS}`);
    const j = await r.json();
    const f = j.status === 1 ? offToFood(j.product) : null;
    if (modal?.type !== 'food') return;
    if (f) openAmount(f);
    else Object.assign(modal, { step: 'custom', code, msg: `Barcode ${code} isn’t in the database yet, or has no nutrition info. Add it from the label and it’ll scan instantly next time.` }), renderModal();
  } catch (err) {
    setScanStatus('Lookup failed. Check your connection and try again.');
  }
}

// ----- Food actions -----
function openFoodModal(meal) {
  modal = { type: 'food', step: 'search', meal, date: foodDate, query: '', off: { q: '', state: 'idle', items: [] } };
  renderModal();
  loadFoodData();
}

function saveFoodEntry() {
  const m = modal, f = m.food;
  const u = unitsFor(f)[m.unit] || { label: 'g', g: 1 };
  const qty = parseFloat(m.qty);
  if (!(qty > 0)) return toast('Enter an amount');
  const g = round1(qty * u.g);
  if (m.target === 'recipe') {
    m.recipe.items.push({ food: f, qty, unit: u.label, g, n: scaleN(f.n, g) });
    Object.assign(m, { step: 'recipe', target: null, query: '' });
    return renderModal();
  }
  if (f.src !== 'uk') state.food.foods[f.id] = f;
  const entry = { id: m.entryId || uid(), foodId: f.id, name: f.brand ? `${f.name} (${f.brand})` : f.name, meal: m.meal, qty, unit: u.label, g, n: scaleN(f.n, g), ts: Date.now() };
  putEntry(m.date, entry);
  toast(m.entryId ? 'Saved' : `Added to ${MEAL_LABEL[m.meal]}`);
}

function putEntry(date, entry) {
  const list = (state.food.log[date] ||= []);
  const i = list.findIndex((e) => e.id === entry.id);
  if (i >= 0) list[i] = { ...entry, ts: list[i].ts }; else list.push(entry);
  modal = null;
  saveState();
  render();
}

function deleteFoodEntry() {
  state.food.log[modal.date] = dayEntries(modal.date).filter((e) => e.id !== modal.entryId);
  if (!state.food.log[modal.date].length) delete state.food.log[modal.date];
  modal = null;
  saveState();
  render();
  toast('Removed');
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-food]');
  if (!b) return;
  const action = b.dataset.food;
  switch (action) {
    case 'date': {
      const dir = Number(b.dataset.dir);
      foodDate = dir ? addDays(foodDate, dir) : todayISO();
      if (foodDate > todayISO()) foodDate = todayISO();
      render();
      return;
    }
    case 'setup': modal = { type: 'food-setup' }; renderModal(); return;
    case 'calc-open': modal = { type: 'macro-calc', p: mcBlank() }; renderModal(); return;
    case 'calc': { const form = document.getElementById('food-setup'); form.dataset.manual = ''; fillTargets(form); return; }
    case 'add': openFoodModal(b.dataset.meal); return;
    case 'copy': {
      const meal = b.dataset.meal;
      dayEntries(addDays(foodDate, -1)).filter((x) => x.meal === meal)
        .forEach((x) => (state.food.log[foodDate] ||= []).push({ ...x, id: uid(), ts: Date.now() }));
      saveState(); render(); toast(`Copied yesterday’s ${MEAL_LABEL[meal].toLowerCase()}`);
      return;
    }
    case 'edit': {
      const entry = dayEntries(foodDate).find((x) => x.id === b.dataset.id);
      if (!entry) return;
      modal = { type: 'food', meal: entry.meal, date: foodDate, query: '', off: { q: '', state: 'idle', items: [] } };
      const food = entry.foodId && foodById(entry.foodId);
      if (food) return openAmount(food, entry);
      Object.assign(modal, { step: 'quick', entryId: entry.id, entry });
      renderModal();
      return;
    }
    case 'back':
      if (modal.step === 'recipe') Object.assign(modal, { step: 'search', recipe: null, target: null });
      else if (modal.step === 'search' && modal.target === 'recipe') Object.assign(modal, { step: 'recipe', target: null });
      else Object.assign(modal, { step: 'search', msg: '' });
      renderModal();
      return;
    case 'water': {
      const ml = Math.max(0, (state.food.water[foodDate] || 0) + Number(b.dataset.ml));
      if (ml) state.food.water[foodDate] = ml; else delete state.food.water[foodDate];
      saveState(); render();
      return;
    }
    case 'weight-save': {
      const kg = parseFloat(document.getElementById('weight-input').value);
      if (!(kg >= 20 && kg <= 400)) return toast('Enter your weight in kg');
      state.food.weights[foodDate] = round1(kg);
      saveState(); render();
      if (state.food.prefs.trendOnly) { const tr = weightSeries().filter((x) => x.date <= foodDate).pop(); toast(`Logged. Trend: ${fmt(round1(tr.trend))} kg`); } else toast('Weight logged');
      return;
    }
    case 'weight-view': modal = { type: 'weight' }; renderModal(); return;
    case 'weight-del':
      if (!confirm('Delete this weigh-in?')) return;
      delete state.food.weights[b.dataset.date];
      saveState(); render();
      return;
    case 'checkin': applyCheckin(b.dataset.accept === '1'); saveState(); render(); toast(b.dataset.accept === '1' ? 'Target updated' : 'Check-in saved'); return;
    case 'save-meal': {
      const meal = b.dataset.meal;
      const items = dayEntries(foodDate).filter((x) => x.meal === meal);
      const name = (prompt('Name this meal so you can log it in one tap:', `My ${MEAL_LABEL[meal].toLowerCase()}`) || '').trim();
      if (!name) return;
      state.food.meals.push({ id: uid(), name: name.slice(0, 60), items: items.map(({ id, ts, meal: _m, ...rest }) => rest) });
      saveState(); toast(`Saved “${name}”`);
      return;
    }
    case 'log-meal': {
      const sm = state.food.meals.find((x) => x.id === b.dataset.id);
      if (!sm) return;
      const list = (state.food.log[modal.date] ||= []);
      sm.items.forEach((i) => list.push({ ...i, id: uid(), meal: modal.meal, ts: Date.now() }));
      const meal = modal.meal;
      modal = null; saveState(); render(); toast(`Added ${sm.name} to ${MEAL_LABEL[meal]}`);
      return;
    }
    case 'del-meal': {
      const sm = state.food.meals.find((x) => x.id === b.dataset.id);
      if (!sm || !confirm(`Delete the saved meal “${sm.name}”? Logged food isn’t affected.`)) return;
      state.food.meals = state.food.meals.filter((x) => x !== sm);
      saveState(); refreshFoodResults();
      return;
    }
    case 'recipe-new': Object.assign(modal, { step: 'recipe', target: null, recipe: { id: null, name: '', servings: '4', items: [] } }); renderModal(); return;
    case 'recipe-add': Object.assign(modal, { step: 'search', target: 'recipe', query: '', off: { q: '', state: 'idle', items: [] } }); renderModal(); return;
    case 'recipe-remove': modal.recipe.items.splice(Number(b.dataset.k), 1); renderModal(); return;
    case 'recipe-edit': {
      const f = modal.food;
      modal.recipe = { id: f.id, name: f.name, servings: String(f.recipe.servings), items: f.recipe.items.map((i) => ({ ...i, n: scaleN(i.food.n, i.g) })) };
      Object.assign(modal, { step: 'recipe', target: null });
      renderModal();
      return;
    }
    case 'recipe-save': {
      const r = modal.recipe, name = r.name.trim();
      if (!name) return toast('Give the recipe a name');
      if (!r.items.length) return toast('Add at least one ingredient');
      const { servings, tot, g } = recipeSums();
      const food = {
        id: r.id || `r:${uid()}`, src: 'recipe', name, brand: '',
        n: Object.fromEntries(NKEYS.map((k) => [k, round1((tot[k] * 100) / g)])),
        portions: [{ label: '1 serving', g: round1(g / servings) }],
        recipe: { servings, items: r.items.map(({ food: ing, qty, unit, g: grams }) => ({ food: ing, qty, unit, g: grams })) },
      };
      state.food.foods[food.id] = food;
      saveState();
      Object.assign(modal, { recipe: null, target: null });
      openAmount(food);
      toast('Recipe saved');
      return;
    }
    case 'scan': modal.step = 'scan'; renderModal(); return;
    case 'lookup': lookupBarcode(document.querySelector('[data-fs=code]').value); return;
    case 'quick': Object.assign(modal, { step: 'quick', entryId: null, entry: null }); renderModal(); return;
    case 'custom': Object.assign(modal, { step: 'custom', code: '', msg: '' }); renderModal(); return;
    case 'off-search': offSearch(); return;
    case 'pick': {
      const id = b.dataset.id;
      const food = foodById(id) || modal.off.items.find((x) => x.id === id) || offlineFood(id);
      if (food) openAmount(food);
      return;
    }
    case 'fav': {
      const id = modal.food.id, favs = state.food.favs;
      if (favs.includes(id)) favs.splice(favs.indexOf(id), 1);
      else { favs.push(id); if (modal.food.src !== 'uk') state.food.foods[id] = modal.food; }
      saveState(); renderModal();
      return;
    }
    case 'idea': {
      const x = ideaCache[Number(b.dataset.k)], meal = b.dataset.meal;
      if (!x) return;
      const list = (state.food.log[foodDate] ||= []);
      const items = x.item.kind === 'meal' ? x.item.m.items : [x.item.e];
      items.forEach(({ id, ts, meal: _m, ...rest }) => list.push({ ...rest, id: uid(), meal, ts: Date.now() }));
      saveState(); render(); toast(`Added ${x.name} to ${MEAL_LABEL[meal]}. Tap it there to change the amount.`);
      return;
    }
    case 'save': saveFoodEntry(); return;
    case 'delete': deleteFoodEntry(); return;
  }
});

document.addEventListener('submit', (e) => {

  if (!['food-setup', 'fq-form', 'fc-form'].includes(form.id)) return;

    Object.assign(t, fixedTargets(t.kcal), { custom: form.dataset.manual === '1' });
    state.food.profile = p;
    state.food.targets = t;
    Object.assign(state.food.prefs, { trainingOn: fd.get('trainingOn') === 'on', trainingGap: Number(fd.get('trainingGap')) || 200, water: Number(fd.get('water')) || 2500, dietBreak: fd.get('dietBreak') === 'on' });

  } else if (form.id === 'fq-form') {
    const kcal = Math.round(num('kcal'));
    if (!kcal) return toast('Enter the calories');
    const n = { ...Object.fromEntries(NKEYS.map((k) => [k, 0])), kcal, protein: num('protein'), carbs: num('carbs'), fat: num('fat') };
    putEntry(modal.date, { id: modal.entryId || uid(), foodId: null, name: String(fd.get('name')).trim() || 'Quick add', meal: fd.get('meal'), qty: 1, unit: '', g: 0, n, ts: Date.now() });
    toast('Added');
  } else {
    const name = String(fd.get('name')).trim();
    if (!name) return toast('Give the food a name');
    const servingG = num('servingG');
    const food = {
      id: `c:${uid()}`, src: 'custom', name, brand: String(fd.get('brand')).trim(), code: modal.code || '',
      n: Object.fromEntries(NKEYS.map((k) => [k, num(k)])),
      portions: servingG > 0 ? [{ label: String(fd.get('servingLabel')).trim() || '1 serving', g: servingG }] : [],
    };
    state.food.foods[food.id] = food;
    saveState();
    openAmount(food);
  }
});

// ---------- Actions --------------------------------------------------------
function finishWorkout() {
  const d = state.draft;
  const ts = Date.now();
  const saved = [];
  d.entries.forEach((entry, k) => {
    const ex = exById(entry.exerciseId);
    if (!ex) return;
    const sets = cleanSets(entry.sets, entryTarget(entry).weight);
    if (!sets.length) return;
    const h = { id: uid(), exerciseId: ex.id, date: d.date || todayISO(), ts: ts + k, sets };
    if (entry.note.trim()) h.note = entry.note.trim();
    if (entry.rpe) h.rpe = entry.rpe;
    if (entry.deload) h.deload = true;
    if (entry.test) h.test = true;
    else if (d.pdl) h.pdl = true;
    state.history.push(h);
    saved.push(h);
  });
  if (!saved.length) return toast('Log at least one set with reps first');

  const prs = [], ups = [], stalls = [];
  saved.forEach((h) => {
    const ex = exById(h.exerciseId);
    const items = prsFor(h);
    if (items.length) prs.push({ name: ex.name, items });
    const p = targetFor(ex, false, h.date);
    if (p.rule === 'up' || (p.rule === 'rpe' && p.weight > p.ev.top)) ups.push({ name: ex.name, label: loadLabel(ex, p.weight) });
    if (!h.pdl && !h.test && plateau(progEx(ex, h.date))) stalls.push(ex.name);
  });
  state.draft = null;
  rest = null;
  tickRest();
  const mins = d.startedAt ? Math.round((Date.now() - d.startedAt) / 60000) : null;
  modal = {
    type: 'summary', saved: saved.length, prs, ups, stalls,
    mins: mins !== null && mins <= 300 ? mins : null, // ignore workouts left open for hours
    sets: sum(saved.map((h) => h.sets.length)), volume: sum(saved.map(kgLifted)),
  };
  saveState();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---------- Data safety: backups, storage, Home Screen ----------------------
const BACKUP_EVERY_DAYS = 7;
const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// "Remind me later" is a per-device convenience, so it lives outside the app data.
function snoozed(key) {
  try { return Date.now() < (JSON.parse(localStorage.getItem('pot.snooze') || '{}')[key] || 0); } catch (err) { return false; }
}
function snooze(key, days) {
  try {
    const s = JSON.parse(localStorage.getItem('pot.snooze') || '{}');
    s[key] = Date.now() + days * 864e5;
    localStorage.setItem('pot.snooze', JSON.stringify(s));
  } catch (err) { /* ignore */ }
}

const hasData = () => state.history.length > 0 || Object.keys(state.food.log).length > 0;
const daysSinceBackup = () => (state.settings.lastBackup ? daysBetween(state.settings.lastBackup, todayISO()) : Infinity);

      <button class="link mt-2 block" data-action="snooze" data-key="install" data-days="14">Remind me later</button>

  }

      <div class="mt-2 flex items-center gap-4">

      <p class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-300">12-week programme</p>
      <p class="mt-1 font-semibold">Week ${due} check-in is due</p>
      <p class="mt-0.5 text-sm muted">Weigh in, measure your waist and take your photos. Takes two minutes, and shows how weight, waist and strength are moving.</p>
      <div class="mt-2 flex items-center gap-4">
        <button class="btn-primary px-3 py-2 text-sm" data-action="prog-checkin" data-week="${due}">Check in</button>
        <button class="link" data-action="snooze" data-key="prog-${due}" data-days="1">Tomorrow</button>
      </div>
    </section>`;
  }
  if (hasData() && daysSinceBackup() >= BACKUP_EVERY_DAYS && !snoozed('backup')) {
    const d = daysSinceBackup();
    html += `<section class="card mb-4 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="font-semibold">Time for a backup</p>

      </div>
      <div class="flex shrink-0 flex-col gap-1">
        <button class="btn-primary px-3 py-2 text-sm" data-action="export">Back up</button>

      </div>
    </section>`;
  }
  return html;

/** Characters this app keeps in the browser's local storage. */
function storageUsed() {
  let chars = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      chars += k.length + (localStorage.getItem(k) || '').length;
    }
  } catch (err) { /* ignore */ }
  return chars;
}

function dataSafetyHtml() {
  const bytes = storageUsed() * 2; // stored as UTF-16
  const limit = 5 * 1024 * 1024;
  const pct = Math.min(100, (bytes / limit) * 100);
  const d = daysSinceBackup();
  return `<div class="rounded-xl bg-slate-100 p-3 dark:bg-slate-800/60">
    <div class="flex items-baseline justify-between text-sm"><span class="font-medium">Data stored on this phone</span><span class="tabular-nums">${bytes < 1e6 ? `${Math.max(1, Math.round(bytes / 1024))} KB` : `${(bytes / 1048576).toFixed(1)} MB`} <span class="muted">of ~5 MB</span></span></div>
    <div class="mt-1.5 h-2 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-700"><div class="h-full rounded-full ${pct > 70 ? 'bg-amber-500' : 'bg-indigo-500'}" style="width:${Math.max(1, pct)}%"></div></div>
    <p class="mt-1.5 text-xs ${pct > 70 ? 'text-amber-700 dark:text-amber-400' : 'muted'}">${pct > 70 ? 'Getting full. Back up now and keep the file safe.' : 'Safari allows each site about 5 MB.'} ${d === Infinity ? 'Not backed up yet.' : `Last backup: ${d === 0 ? 'today' : `${d} day${d === 1 ? '' : 's'} ago`}.`}</p>
    ${isStandalone() ? '' : '<p class="mt-1 text-xs muted">Tip: add the app to your Home Screen so iPhone never clears your data.</p>'}
  </div>`;
}

/** Save a backup file, via the iPhone share sheet (iCloud Drive, Files…) where available. */
async function exportData() {
  const { draft, ...data } = state;
  const json = JSON.stringify({ ...data, settings: { ...data.settings, lastBackup: todayISO() } }, null, 2);
  const name = `overload-tracker-backup-${todayISO()}.json`;
  const file = new File([json], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'Overload Tracker backup' });
    } catch (err) {
      if (err.name === 'AbortError') return; // cancelled
      throw err;
    }
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  state.settings.lastBackup = todayISO();
  saveState();
  render();
  toast('Backup saved');
}

document.getElementById('import-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.exercises) || !Array.isArray(data.history)) throw new Error('bad file');
    if (!confirm('Replace all current data with this backup?')) return;
    state = migrate({ ...data, draft: null });
    saveState();
    render();
    toast('Backup imported');
  } catch (err) {
    toast('That file is not a valid Overload Tracker backup');
  }
});

document.addEventListener('click', (e) => {
  if (e.target.id === 'modal') { modal = null; renderModal(); return; }
  const btn = e.target.closest('[data-action]');
  if (!btn || btn.tagName === 'INPUT' || btn.tagName === 'SELECT') return;
  const { action, id } = btn.dataset;
  const ei = Number(btn.dataset.e), si = Number(btn.dataset.s);
  const entry = state.draft?.entries[ei];

  switch (action) {
    case 'nav': view = btn.dataset.view; editingId = null; routineEdit = null; render(); window.scrollTo(0, 0); return;
    case 'builder-open': {
      if (!state.planner.answers) state.planner.answers = builderDefaults();
      else state.planner.answers = { ...builderDefaults(), ...state.planner.answers };
      if (!state.planner.plan) state.planner.step = 'intro';
      view = 'builder'; saveState(); render(); window.scrollTo(0, 0); return;
    }
    case 'balance-mode': balanceMode = btn.dataset.mode; render(); return;
    case 'balance-direct': balanceDirect = !!btn.dataset.on; render(); return;
    case 'stats-month': {
      const [y, m] = statsMonth.split('-').map(Number), dt = new Date(y, m - 1 + Number(btn.dataset.dir), 1);
      statsMonth = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;
      render(); return;
    }
    case 'goto-exercises': view = 'exercises'; render(); return;
    case 'goto-today': view = 'today'; render(); return;
    case 'toggle-theme': {
      const dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('pot.theme', dark ? 'dark' : 'light'); } catch (err) {}
      return;
    }

    // Workout logging
    case 'start-routine':
      if (state.draft?.entries.length && !confirm('Replace the workout in progress?')) return;
      startRoutine(id); modal = null; window.scrollTo(0, 0); break;
    case 'add-entry': addEntry(id); break;
    case 'add-all': {
      const inDraft = new Set((state.draft?.entries || []).map((en) => en.exerciseId));
      state.exercises.filter((x) => !inDraft.has(x.id)).forEach((x) => addEntry(x.id));
      break;
    }
    case 'remove-entry':
      if (entry.sets.some((s) => s.reps !== '') && !confirm('Remove this exercise and its logged sets?')) return;
      state.draft.entries.splice(ei, 1); break;
    case 'add-set': {
      const lastSet = entry.sets[entry.sets.length - 1];
      entry.sets.push({ weight: lastSet ? lastSet.weight : String(entryTarget(entry).weight), reps: '' });
      break;
    }
    case 'remove-set': entry.sets.splice(si, 1); break;
    case 'fill-set': {
      const ex = progEx(entryEx(entry)), p = entryTarget(entry), s = entry.sets[si];
      if (parseInt(s.reps, 10) > 0) s.reps = ''; // tap again to un-mark
      else {
        if (s.weight === '') s.weight = String(p.weight);
        s.reps = String(targetReps(p, ex, si));
        restAfterSet(ei, si);
      }
      break;
    }
    case 'rest-start': { const ex = progEx(entryEx(entry)); startRest(ex.rest || 90, ex.name); return; }
    case 'rest-adjust':
      if (rest) {
        rest.end = Math.max(Date.now(), rest.end + Number(btn.dataset.sec) * 1000);
        rest.total = Math.max(rest.total, Math.ceil((rest.end - Date.now()) / 1000));
        rest.alerted = false;
        tickRest();
      }
      return;
    case 'rest-skip': rest = null; tickRest(); return;
    case 'toggle-warmup': entry.showWarmup = !entry.showWarmup; break;
    case 'swap-entry': modal = { type: 'swap', e: ei }; renderModal(); return;
    case 'toggle-ss': {
      entry.ss = !entry.ss;
      const r = routineById(state.draft.routineId);
      if (r) { // remember the pairing for next time
        r.links ||= {};
        if (entry.ss) r.links[entry.exerciseId] = true; else delete r.links[entry.exerciseId];
      }
      break;
    }
    case 'open-plates': modal = { type: 'plates', total: btn.dataset.total || '' }; renderModal(); return;
    case 'open-measures': modal = { type: 'measures', date: todayISO() }; renderModal(); return;
    case 'measure-pick': modal.date = btn.dataset.date; renderModal(); return;
    case 'measure-del':
      if (!confirm(`Delete the measurements from ${fmtShort(btn.dataset.date)}?`)) return;
      delete state.body.measures[btn.dataset.date];
      saveState(); render();
      return;
    case 'swap-to': {
      const en = state.draft?.entries[modal.e], ex = exById(id);
      if (!en || !ex) return;
      if (en.sets.some((x) => x.reps !== '') && !confirm('Swap this exercise? The sets you’ve logged for it will be cleared.')) return;
      const p = targetFor(ex);
      Object.assign(en, { exerciseId: id, n: 0, sets: p.reps.map(() => ({ weight: String(p.weight), reps: '' })), note: '', rpe: '', deload: false, test: false });
      modal = null;
      toast(`Swapped to ${ex.name}`);
      break;
    }
    case 'apply-deload': {
      const stall = plateau(exById(entry.exerciseId));
      if (!stall) return;
      entry.deload = true;
      entry.sets.forEach((s) => (s.weight = String(stall.weight)));
      break;
    }
    case 'undo-deload': {
      const p = predict(exById(entry.exerciseId));
      entry.deload = false;
      entry.sets.forEach((s) => (s.weight = String(p.weight)));
      break;
    }
    case 'toggle-warm': entry.sets[si].warm = !entry.sets[si].warm; break;
    case 'toggle-test': {
      if (entry.sets.some((x) => x.reps !== '') && !confirm('Clear the sets you’ve logged for this exercise?')) return;
      entry.test = !entry.test;
      const p = entryTarget(entry);
      entry.sets = p.reps.map(() => ({ weight: String(p.weight), reps: '' }));
      break;
    }
    case 'prog-main': modal = { type: 'prog-main' }; renderModal(); return;
    case 'load-plan': {
      if (!confirm('Load the new plan? Your 5 routines and weekly schedule are replaced. History, progress and the 12-week programme are kept.')) return;
      const { created, missing } = loadNewPlan();
      view = 'today';
      toast(`New plan loaded${created.length ? `. Added ${created.join(', ')}` : ''}${missing.length ? `. Couldn’t find: ${missing.join(', ')}` : ''}`);
      break;
    }
    case 'journey': modal = { type: 'journey' }; renderModal(); return;
    case 'toggle-pdl': {
      const d = state.draft;
      d.pdl = !d.pdl;
      d.entries.forEach((en) => { // re-fill exercises that haven't been started yet
        if (en.sets.some((x) => x.reps !== '') || en.test) return;
        const p = targetFor(exById(en.exerciseId));
        en.sets = p.reps.map(() => ({ weight: String(p.weight), reps: '' }));
      });
      toast(d.pdl ? 'Deload targets on' : 'Normal targets today');
      break;
    }
    case 'prog-setup': modal = { type: 'prog-setup' }; renderModal(); return;
    case 'prog-checkin': modal = { type: 'prog-checkin', week: Number(btn.dataset.week) }; renderModal(); return;
    case 'prog-review': modal = { type: 'prog-review', week: Number(btn.dataset.week) }; renderModal(); return;
    case 'prog-end': {
      const done = todayISO() > progEnd();
      if (!done && !confirm('End the 12-week programme early? Your workouts and check-ins are kept.')) return;
      state.pastProgrammes.push({ ...state.programme, ended: todayISO() });
      state.programme = null;
      if (state.draft) state.draft.pdl = false;
      break;
    }
    case 'finish': return finishWorkout();
    case 'discard':
      if (!confirm('Discard this workout’s logged sets?')) return;
      state.draft = null; rest = null; tickRest(); break;

    // Plan
    case 'open-day': modal = { type: 'day', date: btn.dataset.date }; renderModal(); return;
    case 'close-modal': modal = null; renderModal(); return;
    case 'plan-week': {
      const dir = Number(btn.dataset.dir);
      planWeek = dir ? addDays(planWeek, 7 * dir) : weekStart(todayISO());
      break;
    }
    case 'day-move': {
      const from = btn.dataset.date, to = document.getElementById('move-to').value;
      const r = plannedRoutine(from);
      if (!r || !to || to === from) return toast('Pick a different day');
      const replaced = plannedRoutine(to);
      setDayPlan(from, null);
      setDayPlan(to, r.id);
      modal = null;
      toast(`${r.name} moved to ${fmtDay(to)}${replaced && replaced.id !== r.id ? ` (replaces ${replaced.name})` : ''}`);
      break;
    }
    case 'day-reset': delete state.schedule.overrides[btn.dataset.date]; break;
    case 'new-routine': routineEdit = { id: null, name: '', exerciseIds: [] }; break;
    case 'edit-routine': { const r = routineById(id); routineEdit = { id: r.id, name: r.name, exerciseIds: r.exerciseIds.filter(exById) }; break; }
    case 'cancel-routine': routineEdit = null; break;
    case 'routine-move': {
      const k = Number(btn.dataset.k), j = k + Number(btn.dataset.dir);
      const ids = routineEdit.exerciseIds;
      [ids[k], ids[j]] = [ids[j], ids[k]];
      render(); return;
    }
    case 'routine-remove': routineEdit.exerciseIds.splice(Number(btn.dataset.k), 1); render(); return;
    case 'save-routine': {
      const name = routineEdit.name.trim();
      if (!name) return toast('Give the routine a name');
      if (!routineEdit.exerciseIds.length) return toast('Add at least one exercise');
      if (routineEdit.id) Object.assign(routineById(routineEdit.id), { name, exerciseIds: routineEdit.exerciseIds });
      else state.routines.push({ id: uid(), name, exerciseIds: routineEdit.exerciseIds });
      toast(`Saved ${name}`);
      routineEdit = null;
      break;
    }
    case 'delete-routine': {
      const r = routineById(id);
      if (!confirm(`Delete the “${r.name}” routine? It will be removed from your schedule. Logged history is kept.`)) return;
      state.routines = state.routines.filter((x) => x.id !== id);
      Object.keys(state.schedule.weekly).forEach((k) => { if (state.schedule.weekly[k] === id) delete state.schedule.weekly[k]; });
      Object.keys(state.schedule.overrides).forEach((k) => { if (state.schedule.overrides[k] === id) delete state.schedule.overrides[k]; });
      break;
    }

    // Stats
    case 'stats-week': statsWeek = addDays(statsWeek, 7 * Number(btn.dataset.dir)); render(); return;
    case 'bar': btn.closest('[data-chart]').querySelector('[data-readout]').innerHTML = btn.dataset.readout; return;

    // Exercises
    case 'open-library': modal = { type: 'library' }; renderModal(); return;
    case 'lib-step': lib.step = Number(btn.dataset.step); renderModal(); return;
    case 'lib-add': return addFromLibrary();
    case 'muscle': btn.dataset.level = { 0: '1', 1: '0.5', 0.5: '0' }[btn.dataset.level] ?? '0'; return;
    case 'edit-ex': editingId = id; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
    case 'cancel-edit': editingId = null; render(); return;
    case 'delete-ex': {
      const ex = exById(id);
      if (!confirm(`Delete “${ex.name}” and all of its history?`)) return;
      state.exercises = state.exercises.filter((x) => x.id !== id);
      state.history = state.history.filter((h) => h.exerciseId !== id);
      state.routines.forEach((r) => (r.exerciseIds = r.exerciseIds.filter((x) => x !== id)));
      if (state.draft) state.draft.entries = state.draft.entries.filter((en) => en.exerciseId !== id);
      if (editingId === id) editingId = null;
      break;
    }

    // History
    case 'delete-session':
      if (!confirm('Delete this logged session? Future targets will be recalculated.')) return;
      state.history = state.history.filter((h) => h.id !== id); break;
    case 'export': exportData().catch(() => toast('Couldn’t save the backup. Try again.')); return;
    case 'snooze': snooze(btn.dataset.key, Number(btn.dataset.days)); render(); return;
    case 'import': document.getElementById('import-file').click(); return;
    case 'reset':
      if (!confirm('Erase ALL exercises, routines, schedule and history from this browser? This cannot be undone.')) return;
      state = migrate({}); rest = null; tickRest(); break;
    default: return;
  }
  saveState();
  render();
});

// Live logging: update state without re-rendering (keeps keyboard focus).
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.field) {
    const ei = Number(el.dataset.e), si = Number(el.dataset.s);
    const entry = state.draft.entries[ei];
    entry.sets[si][el.dataset.field] = el.value;
    saveState();
    const ex = progEx(entryEx(entry));
    document.getElementById(`row-${ei}-${si}`).classList.toggle('done', parseInt(entry.sets[si].reps, 10) > 0);
    const p = entryTarget(entry);
    document.getElementById(`progress-${ei}`).innerHTML = progressHtml(entry, ex, p);
    if (el.dataset.field === 'weight') document.getElementById(`warm-${ei}`).innerHTML = warmupHtml(entry, ex, p, plateau(ex));
  } else if (el.dataset.entryField) {
    state.draft.entries[Number(el.dataset.e)][el.dataset.entryField] = el.value;
    saveState();
  } else if (el.dataset.routineField) {
    routineEdit[el.dataset.routineField] = el.value;
  } else if (el.dataset.pc && modal?.type === 'plates') {
    modal[el.dataset.pc] = el.dataset.pc === 'bar' ? Number(el.value) : el.value;
    document.getElementById('pc-result').innerHTML = platesResult();
  } else if (el.dataset.lib) {
    lib[el.dataset.lib] = el.value;
    refreshLibrary();
  } else if (el.dataset.libWeight) {
    lib.picked.set(Number(el.dataset.libWeight), el.value);
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.foodPref) { state.food.prefs[el.dataset.foodPref] = el.checked; saveState(); render(); return; }
  // Typing reps and moving on (Done / next box) counts as finishing the set.
  if (el.dataset.field === 'reps' && parseInt(el.value, 10) > 0 && state.draft) { restAfterSet(Number(el.dataset.e), Number(el.dataset.s)); return; }
  if (el.dataset.libPick) {
    const idx = Number(el.dataset.libPick);
    if (el.checked) lib.picked.set(idx, ''); else lib.picked.delete(idx);
    refreshLibrary();
    return;
  }
  switch (el.dataset.action) {
    case 'draft-date': state.draft.date = el.value || todayISO(); break;
    case 'weekly-set':
      if (el.value) state.schedule.weekly[el.dataset.dow] = el.value;
      else delete state.schedule.weekly[el.dataset.dow];
      render(); break;
    case 'day-set': setDayPlan(el.dataset.date, el.value || null); render(); break;
    case 'routine-add': if (el.value) routineEdit.exerciseIds.push(el.value); render(); return;
    case 'stats-ex': statsExId = el.value; render(); return;
    case 'stats-muscle': statsMuscle = el.value; render(); return;
    case 'bar-weight': state.settings.barWeight = Number(el.value); break;
    case 'progression': state.settings.progression = el.value; render(); break;
    case 'measure-date': modal.date = el.value || todayISO(); renderModal(); return;
    case 'prog-main-toggle': {
      if (modal?.type !== 'prog-main') return; // the setup form reads its ticks on submit
      const main = new Set(state.programme.main ?? defaultMain());
      if (el.checked) main.add(el.value); else main.delete(el.value);
      state.programme.main = [...main];
      saveState(); render();
      return;
    }
    default:
      if (el.name === 'type' || el.name === 'bwMode') syncMachineToggle();
      return;
  }
  saveState();
});

/** Save a check-in's weight and waist into the weight log and measurements too. */
function logBody(date, kg, waist) {
  if (kg) state.food.weights[date] = kg;
  if (waist) state.body.measures[date] = { ...(state.body.measures[date] || {}), waist };
}

document.addEventListener('submit', (e) => {
  if (e.target.id === 'prog-form' || e.target.id === 'prog-ci-form') {
    e.preventDefault();
    const fd = new FormData(e.target), today = todayISO();
    const num = (k) => { const v = parseFloat(fd.get(k)); return v > 0 ? round1(v) : null; };
    const kg = num('weight'), waist = num('waist');
    if (!(kg >= 20 && kg <= 400)) return toast('Enter your weight in kg');
    logBody(today, kg, waist);
    const c = { date: today, weight: kg, trend: trendAt(today, kg), waist };
    if (e.target.id === 'prog-form') {
      if (state.programme) state.pastProgrammes.push({ ...state.programme, ended: today });
      state.programme = { id: uid(), start: String(fd.get('start')), goalKg: num('goal'), main: fd.getAll('main').map(String), checkins: [{ week: 0, ...c }] };
      if (state.draft) state.draft.pdl = isDeloadWeek(state.draft.date);
      modal = null;
      toast('Programme started');
    } else {
      const week = modal.week;
      state.programme.checkins = state.programme.checkins.filter((x) => x.week !== week);
      state.programme.checkins.push({ week, ...c, feel: String(fd.get('feel') || 'ok'), note: String(fd.get('note') || '').trim() });
      state.programme.checkins.sort((a, b) => a.week - b.week);
      modal = { type: 'prog-review', week };
    }
    saveState(); render();
    return;
  }
  if (e.target.id === 'journey-form') {
    e.preventDefault();
    const fd = new FormData(e.target);
    const kg = round1(parseFloat(fd.get('kg'))), date = String(fd.get('date')), goal = parseFloat(fd.get('goal'));
    if (!(kg >= 20 && kg <= 400) || !date) return toast('Enter your starting weight and roughly when');
    const old = state.body.journey;
    if (old && old.date !== date && state.food.weights[old.date] === old.kg) delete state.food.weights[old.date];
    if (state.food.weights[date] === undefined || old?.date === date) state.food.weights[date] = kg;
    state.body.journey = { kg, date, goal: goal > 0 ? round1(goal) : null };
    modal = null;
    saveState(); render(); toast('Journey saved');
    return;
  }
  if (e.target.id === 'measure-form') {
    e.preventDefault();
    const fd = new FormData(e.target);
    const date = String(fd.get('date')) || todayISO();
    const entry = {};
    MEASURES.forEach(([k]) => { const v = parseFloat(fd.get(k)); if (v > 0) entry[k] = round1(v); });
    if (Object.keys(entry).length) state.body.measures[date] = entry; else delete state.body.measures[date];
    modal = null;
    saveState(); render(); toast('Measurements saved');
    return;
  }
  if (e.target.id !== 'ex-form') return;
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const name = String(fd.get('name')).trim();
  const repMin = parseInt(fd.get('repMin'), 10);
  const repMax = parseInt(fd.get('repMax'), 10);
  const sets = parseInt(fd.get('sets'), 10);
  const startWeight = parseFloat(fd.get('startWeight')) || 0;
  if (!name) return toast('Give the exercise a name');
  if (!(repMin > 0 && repMax > repMin)) return toast('Rep range max must be higher than min');
  if (!(sets >= 1 && sets <= 10)) return toast('Working sets must be between 1 and 10');

  const muscles = {};
  form.querySelectorAll('#muscle-chips [data-m]').forEach((c) => { const l = Number(c.dataset.level); if (l) muscles[c.dataset.m] = l; });

  const data = {
    name, type: fd.get('type'), bwMode: fd.get('bwMode') || 'weighted', machineStep: Number(fd.get('machineStep')) === 3 ? 3 : 4,
    repMin, repMax, sets, startWeight, muscles, rest: Number(fd.get('rest')) || 90,
  };
  if (editingId) {
    Object.assign(exById(editingId), data);
    toast('Exercise updated');
    editingId = null;
  } else {
    state.exercises.push({ id: uid(), ...data });
    toast(`Added ${name}`);
  }
  saveState();
  render();
});

// ---------- Update notice ----------------------------------------------------
// Phones can keep running a cached copy of the page. Compare this page's code
// with the code in a fresh copy from the server and offer a one-tap update.
let lastUpdateCheck = 0;
async function checkForUpdate() {
  if (location.protocol === 'file:' || !SELF_CODE || Date.now() - lastUpdateCheck < 5 * 60 * 1000) return;
  lastUpdateCheck = Date.now();
  try {
    const r = await fetch(location.pathname, { cache: 'no-store' });
    if (!r.ok) return;
    const html = await r.text();
    const open = '<scr' + 'ipt>', close = '</scr' + 'ipt>'; // split so this script doesn't end itself
    const end = html.lastIndexOf(close), start = html.lastIndexOf(open, end);
    if (start < 0 || end < start) return;
    if (html.slice(start + open.length, end) !== SELF_CODE) document.getElementById('update-banner').classList.remove('hidden');
  } catch (err) { /* offline: try again later */ }
}

document.addEventListener('click', async (e) => {
  if (!e.target.closest('[data-action=apply-update]')) return;
  try { await fetch(location.pathname, { cache: 'reload' }); } catch (err) { /* reload anyway */ }
  location.reload();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });

render();
checkForUpdate();
navigator.storage?.persist?.().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
