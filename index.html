// ----- Weight-loss journey -----
/** Trend change per week over the last 4 weeks (falls back to the 2-week rate). */
function rate4w() {
  const series = weightSeries();
  if (series.length < 2) return null;
  const last = series[series.length - 1];
  const first = series.find((x) => daysBetween(x.date, last.date) <= 28 && x.date !== state.body.journey?.date);
  const days = first ? daysBetween(first.date, last.date) : 0;
  return days >= 10 ? ((last.trend - first.trend) / days) * 7 : weeklyRate(series);
}

function journeyCard() {
  const j = state.body.journey;
  if (!j) {
    return `<section class="card mb-4">
      <h3 class="font-semibold">Your journey</h3>
      <p class="mt-1 text-sm muted">Add the weight you started at (even from before you used this app) to see your total loss, milestones and when you’re likely to hit your goal.</p>
      <button class="btn-primary mt-3 w-full py-2.5" data-action="journey">Add where you started</button>
    </section>`;
  }
  const series = weightSeries(), now = series.length ? series[series.length - 1].trend : j.kg;
  const lost = j.kg - now, goal = j.goal || state.programme?.goalKg || null;
  const rate = rate4w();
  // Milestones: every 5 kg lost, and every round 5 kg on the scale, down to the goal.
  const stones = [];
  for (let k = 5; k <= Math.max(lost + 10, 5); k += 5) stones.push({ label: `${k} kg lost`, at: j.kg - k });
  for (let w = Math.floor((j.kg - 0.01) / 5) * 5; w > (goal || now - 10); w -= 5) stones.push({ label: `${w} kg`, at: w });
  if (goal) stones.push({ label: `Goal ${fmt(goal)} kg`, at: goal, goal: true });
  stones.sort((a, b) => b.at - a.at);
  const done = stones.filter((x) => now <= x.at), next = stones.filter((x) => now > x.at).slice(0, 3);
  let eta = '';
  if (goal && now > goal) {
    eta = rate !== null && rate < -0.05
      ? `<b>${fmt(round1(now - goal))} kg</b> to your ${fmt(goal)} kg goal. At your current rate (${fmt(round2(-rate))} kg a week) that’s around <b>${parseISO(addDays(todayISO(), Math.round(((now - goal) / -rate) * 7))).toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</b>.`
      : `<b>${fmt(round1(now - goal))} kg</b> to your ${fmt(goal)} kg goal. A date estimate appears once your trend is heading down.`;
  } else if (goal) eta = `<b class="text-emerald-700 dark:text-emerald-400">Goal reached! 🎉</b>`;
  const chip = (x, ok) => `<span class="chip ${ok ? 'border-emerald-500 bg-emerald-500/10 text-emerald-700 dark:text-emerald-300' : ''} ${x.goal ? 'font-bold' : ''}">${ok ? '✓ ' : ''}${x.label}</span>`;
  return `<section class="card mb-4">
    <div class="flex items-center justify-between gap-2"><h3 class="font-semibold">Your journey</h3><button class="link text-xs" data-action="journey">Edit</button></div>
    <div class="mt-2 flex items-end gap-4">
      <div><p class="text-3xl font-extrabold tabular-nums ${lost > 0 ? 'text-emerald-600 dark:text-emerald-400' : ''}">${lost > 0 ? '−' : '+'}${fmt(round1(Math.abs(lost)))} kg</p>
        <p class="text-xs muted">since ${parseISO(j.date).toLocaleDateString(undefined, { month: 'short', year: 'numeric' })} · ${fmt(round1((Math.abs(lost) / j.kg) * 100))}% of your starting weight</p></div>
      <div class="ml-auto text-right"><p class="text-sm"><span class="muted">${fmt(j.kg)} →</span> <b class="tabular-nums">${fmt(round1(now))} kg</b></p></div>
    </div>
    ${eta ? `<p class="mt-3 text-sm">${eta}</p>` : ''}
    <div class="mt-3 flex flex-wrap gap-2">${done.slice(-3).map((x) => chip(x, true)).join('')}${next.map((x) => chip(x, false)).join('')}</div>
    ${done.length > 3 ? `<p class="mt-1 text-xs muted">${done.length} milestones passed so far.</p>` : ''}
    ${series.length > 1 ? `<div class="mt-3">${weightChart(series)}</div>` : ''}
  </section>`;
}

const normName = (n) => String(n).toLowerCase().replace(/[^a-z0-9]/g, '');
/** Your own exercise with this name (ignoring case, spaces and dashes), else a new one from the library. */
function planExercise(name, created) {
  const key = normName(name);
  const own = state.exercises.find((e) => normName(e.name) === key);
  if (own) return own;
  const lib = LIBRARY.find((it) => normName(it.name) === key);
  if (!lib) return null;
  const ex = { id: uid(), name: lib.name, type: lib.type, bwMode: lib.bwMode, machineStep: 4, repMin: lib.repMin, repMax: lib.repMax, sets: lib.sets, startWeight: lib.startWeight, muscles: { ...lib.muscles }, rest: lib.rest };
  state.exercises.push(ex);
  created.push(ex.name);
  return ex;
}

function loadNewPlan() {
  const today = todayISO(), created = [], missing = [];
  const oldByLetter = Object.fromEntries(state.routines.map((r) => [r.name.trim().charAt(0).toUpperCase(), r]));
  const routines = NEW_PLAN.days.map((d) => {
    const ids = [], sets = {};
    d.ex.forEach(([name, n]) => {
      const ex = planExercise(name, created);
      if (!ex) return missing.push(name);
      ids.push(ex.id);
      if (n) sets[ex.id] = n;
    });
    // Reuse the old routine's id so past days in the calendar keep a sensible label.
    return { id: oldByLetter[d.old]?.id || uid(), name: d.name, exerciseIds: ids, sets, links: {}, dow: d.dow };
  });
  state.routines = routines.map(({ dow: _d, ...r }) => r);
  state.schedule.weekly = Object.fromEntries(routines.map((r) => [r.dow, r.id]));
  Object.keys(state.schedule.overrides).forEach((d) => { if (d >= today) delete state.schedule.overrides[d]; });
  if (weekStart(today) === NEW_PLAN.firstWeek && dow(today) >= 2) {
    const push = routines.find((r) => r.name.includes(NEW_PLAN.firstDay));
    setDayPlan(today, push.id);
  }
  if (state.programme) state.programme.main = NEW_PLAN.main.map((n) => state.exercises.find((e) => normName(e.name) === normName(n))?.id).filter(Boolean);
  state.settings.planLoaded = NEW_PLAN.id;
  return { created, missing };
}

  lateral: { g: 'Shoulders', t: (x) => x.muscles.Shoulders === 1 && /lateral|y-raise/i.test(x.name) },
  rearDelt: { g: 'Shoulders', t: (x) => x.muscles.Shoulders === 1 && /rear|reverse pec|face pull/i.test(x.name) },
  vPull: { g: 'Back', c: 1, t: (x) => x.muscles.Back === 1 && /pulldown|pull-up|pull up|chin/i.test(x.name) && !/straight-arm/i.test(x.name) },
  back2: { g: 'Back', c: 1, t: (x) => x.muscles.Back === 1 && /pulldown|row|pull-up|pull up|chin/i.test(x.name) && !/upright|straight-arm/i.test(x.name) },
  row: { g: 'Back', c: 1, t: (x) => x.muscles.Back === 1 && /row/i.test(x.name) && !/upright/i.test(x.name) },
  biceps: { g: 'Arms', t: (x) => x.muscles.Biceps === 1 && /curl/i.test(x.name) && !/hammer|preacher/i.test(x.name) },
  biceps2: { g: 'Arms', t: (x) => x.muscles.Biceps === 1 && /hammer|preacher/i.test(x.name) },
  triPush: { g: 'Arms', t: (x) => x.muscles.Triceps === 1 && /pushdown|dip machine|extension machine/i.test(x.name) },
  triOver: { g: 'Arms', t: (x) => x.muscles.Triceps === 1 && /overhead|skull|kickback/i.test(x.name) },
  quad: { g: 'Legs', c: 1, t: (x) => x.muscles.Quads === 1 && /leg press|hack|squat|lunge|step-up/i.test(x.name) && !/calf|single-leg/i.test(x.name) },
  glute: { g: 'Glutes', c: 1, t: (x) => x.muscles.Glutes === 1 && /hip thrust|glute bridge/i.test(x.name) },
  hinge: { g: 'Legs', c: 1, t: (x) => x.muscles.Hamstrings === 1 && /romanian|deadlift|back extension|pull-through/i.test(x.name) },
  quadIso: { g: 'Legs', t: (x) => x.muscles.Quads === 1 && /leg extension/i.test(x.name) && !/single/i.test(x.name) },
  hamCurl: { g: 'Legs', t: (x) => x.muscles.Hamstrings === 1 && /leg curl/i.test(x.name) },
  abductor: { g: 'Glutes', t: (x) => x.muscles.Glutes === 1 && /abduct/i.test(x.name) },
  calves: { g: 'Calves', t: (x) => x.muscles.Calves === 1 },
  core: { g: 'Core', t: (x) => x.muscles.Core === 1 },
};
const B_TEMPLATES = {
  push: ['Push', ['chestPress', 'shoulderPress', 'chestFly', 'lateral', 'triPush', 'triOver', 'chest2']],
  pull: ['Pull', ['vPull', 'row', 'back2', 'rearDelt', 'biceps', 'biceps2', 'core']],
  legs: ['Legs', ['quad', 'glute', 'hinge', 'quadIso', 'hamCurl', 'abductor', 'calves', 'core']],
  upper: ['Upper', ['chestPress', 'row', 'vPull', 'shoulderPress', 'chestFly', 'lateral', 'biceps', 'triPush']],
  lower: ['Lower', ['quad', 'hinge', 'glute', 'hamCurl', 'quadIso', 'calves', 'abductor', 'core']],
  full: ['Full body', ['chestPress', 'row', 'quad', 'shoulderPress', 'vPull', 'hamCurl', 'lateral', 'biceps', 'triPush', 'calves']],
  arms: ['Arms & delts', ['lateral', 'rearDelt', 'biceps', 'triPush', 'biceps2', 'triOver', 'core']],
  topup: ['Arms, delts & top-up', ['lateral', 'rearDelt', 'biceps', 'triPush', 'quadIso', 'hamCurl', 'calves']],
};
const B_SPLITS = { // [days][leg days] → templates
  2: { one: ['full', 'full'], topup: ['full', 'full'], two: ['full', 'full'] },
  3: { one: ['push', 'pull', 'legs'], topup: ['push', 'pull', 'legs'], two: ['upper', 'lower', 'full'] },
  4: { one: ['push', 'pull', 'legs', 'upper'], topup: ['upper', 'legs', 'upper', 'topup'], two: ['upper', 'lower', 'upper', 'lower'] },
  5: { one: ['push', 'pull', 'legs', 'upper', 'arms'], topup: ['push', 'pull', 'legs', 'upper', 'topup'], two: ['upper', 'lower', 'push', 'pull', 'legs'] },
};

function builderDefaults() {
  const fp = state.food.profile || {}, latest = Object.keys(state.food.weights).sort().pop();
  const days = Object.keys(state.schedule.weekly).map(Number).filter((i) => routineById(state.schedule.weekly[i])).sort();
  return {
    sex: fp.sex || 'male', age: fp.age || '', height: fp.height || '', weight: latest ? state.food.weights[latest] : fp.weight || '',
    goalKg: state.programme?.goalKg ?? state.body.journey?.goal ?? '',
    goal: 'recomp', years: '2-4', consistent: 'mostly', rpe: 'some',
    days: days.length >= 2 && days.length <= 5 ? days : [0, 2, 4], minutes: 60,
    levels: Object.fromEntries(B_GROUPS.map(([g]) => [g, 'normal'])), legDays: 'topup',
    gym: 'commercial', style: 'machines', keepMine: true,
    joints: [], avoid: [], notes: '',
    sleep: '7-8', stress: 'medium', job: 'desk', steps: '5-8', cardio: 'none',
  };
}

const bAns = () => state.planner.answers;

/** Every exercise the builder can use: yours first, then library ones you don't have yet. */
function bCandidates(all = false) {
  const a = bAns(), since = addDays(todayISO(), -90);
  const own = state.exercises.map((e) => ({ key: `own:${e.id}`, id: e.id, name: e.name, type: e.type, bwMode: e.bwMode, repMin: e.repMin, repMax: e.repMax, rest: e.rest, muscles: e.muscles || {}, owned: true,
    recent: state.history.some((h) => h.exerciseId === e.id && h.date >= since) }));
  const names = new Set(own.map((c) => normName(c.name)));
  const libs = LIBRARY.filter((it) => !names.has(normName(it.name))).map((it, i) => ({ key: `lib:${it.name}`, name: it.name, type: it.type, bwMode: it.bwMode, repMin: it.repMin, repMax: it.repMax, rest: it.rest, muscles: it.muscles, owned: false, order: i }));
  const blocked = (c) => B_AVOID.some(([k, , f]) => a.avoid.includes(k) && f(c)) || B_JOINTS.some(([k, , re]) => a.joints.includes(k) && re.test(c.name))
    || (a.gym === 'home' && (c.type === 'machine' || c.type === 'barbell'))
    || (a.gym === 'small' && /plate-loaded|hack|donkey|glute kickback machine|reverse hyper|rotary|high row|t-bar|meadows|glute-ham/i.test(c.name));
  const machineLike = (c) => c.type === 'machine' || c.bwMode === 'assisted';
  const style = { machines: (c) => (machineLike(c) ? 3 : c.type === 'dumbbell' ? 1 : c.type === 'barbell' ? -2 : 0), mix: (c) => (c.type === 'bodyweight' && c.bwMode !== 'assisted' ? 0 : 1), free: (c) => (c.type === 'barbell' || c.type === 'dumbbell' ? 2 : 0) }[a.style];
  const joint = a.joints.length ? (c) => (machineLike(c) ? 1 : 0) : () => 0;
  return [...own, ...libs].filter((c) => all || !blocked(c)).map((c) => ({ ...c, score: style(c) + joint(c) + (a.keepMine && c.owned ? 3 + (c.recent ? 2 : 0) : 0) - (c.order || 0) * 0.001 }));
}
const bEqLabel = (c) => ({ machine: 'Machine', dumbbell: 'Dumbbell', barbell: 'Barbell' }[c.type] || (c.bwMode === 'assisted' ? 'Assisted machine' : 'Bodyweight'));
const bMap = (cands) => Object.fromEntries(cands.map((c) => [c.key, c]));
const bOptions = (slot, cands) => cands.filter(B_SLOTS[slot].t).sort((x, y) => y.score - x.score);

/** Recovery and experience scale the weekly volume; returns { f, maxSets, why[] }. */
function bRecovery(a) {
  let f = 1; const why = [];
  if (a.sleep === '<6') { f -= 0.15; why.push('short sleep'); } else if (a.sleep === '6-7') f -= 0.05;
  if (a.stress === 'high') { f -= 0.1; why.push('high stress'); }
  if (a.job === 'manual') { f -= 0.05; why.push('a physical job'); }
  if (a.steps === '12+') f -= 0.05;
  if (a.cardio === '3+') { f -= 0.05; why.push('regular cardio'); }
  if (a.years === '<1') { f -= 0.15; why.push('being newer to training'); }
  if (a.consistent === 'onoff') { f -= 0.1; why.push('training on and off lately'); }
  if (a.goal === 'fat') f -= 0.05;
  f = Math.max(0.7, Math.round(f * 100) / 100);
  return { f, maxSets: ['2-4', '4+'].includes(a.years) && f >= 0.9 ? 4 : 3, why };
}

const bLevel = (slot) => bAns().levels[B_SLOTS[slot]?.g] || 'normal';
function bExSecs(c, sets) {
  const reps = ((c.repMin || 8) + (c.repMax || 12)) / 2;
  return 60 + sets * (reps * 3 + 10) + sets * (c.rest || 90);
}
const bDaySecs = (day, map) => 5 * 60 + sum(day.items.map((it) => (map[it.key] ? bExSecs(map[it.key], it.sets) : 0)));

/** Build the whole plan from the answers. */
function buildPlan() {
  const a = bAns(), cands = bCandidates(), map = bMap(cands), rec = bRecovery(a);
  const days = [...a.days].sort((x, y) => x - y), limit = a.minutes * 60;
  const tpls = B_SPLITS[days.length][a.legDays];
  const rank = { grow: 0, normal: 1, keep: 2 };
  const plan = { days: tpls.map((tpl, k) => {
    const slots = B_TEMPLATES[tpl][1];
    const order = [...slots].sort((x, y) => (B_SLOTS[y].c || 0) - (B_SLOTS[x].c || 0) || rank[bLevel(x)] - rank[bLevel(y)] || slots.indexOf(x) - slots.indexOf(y));
    const day = { dow: days[k], name: `${k + 1} · ${B_TEMPLATES[tpl][0]}`, tpl, items: [] };
    order.forEach((slot) => {
      const pick = bOptions(slot, cands).find((c) => !day.items.some((it) => it.key === c.key));
      if (!pick) return;
      const sets = bLevel(slot) === 'keep' ? 2 : 3;
      if (day.items.length >= 3 && bDaySecs({ items: [...day.items, { key: pick.key, sets }] }, map) > limit) return;
      day.items.push({ key: pick.key, slot, sets });
    });
    day.items.sort((x, y) => (B_SLOTS[y.slot].c || 0) - (B_SLOTS[x.slot].c || 0) || slots.indexOf(x.slot) - slots.indexOf(y.slot));
    return day;
  }) };
  // Balance pass: add sets for muscles you want to grow, trim ones you only want to keep.
  for (let round = 0; round < 6; round++) {
    const vol = bVolume(plan, map);
    let changed = false;
    MUSCLES.forEach((m) => {
      const g = B_GROUPS.find(([, ms]) => ms.includes(m))?.[0], target = B_VOL[a.levels[g] || 'normal'] * rec.f;
      if (vol[m] < target - 1) {
        for (const day of plan.days) {
          const it = day.items.find((x) => map[x.key]?.muscles[m] === 1 && x.sets < rec.maxSets && !B_SLOTS[x.slot]?.c);
          if (it && bDaySecs(day, map) + bExSecs(map[it.key], 1) - 60 <= limit) { it.sets++; changed = true; break; }
        }
      } else if (vol[m] > target + (a.levels[g] === 'keep' ? 4 : 8)) {
        for (const day of plan.days) {
          const it = day.items.find((x) => map[x.key]?.muscles[m] === 1 && x.sets > 2 && !B_SLOTS[x.slot]?.c);
          if (it) { it.sets--; changed = true; break; }
        }
      }
    });
    if (!changed) break;
  }
  return plan;
}

function bVolume(plan, map) {
  const out = Object.fromEntries(MUSCLES.map((m) => [m, 0]));
  plan.days.forEach((d) => d.items.forEach((it) => Object.entries(map[it.key]?.muscles || {}).forEach(([m, f]) => { if (m in out) out[m] += it.sets * f; })));
  return out;
}

/** Main lifts: one exercise per big movement (press, overhead, row, pulldown, legs, glutes), up to 6. */
function bMainLifts(plan, map) {
  const out = [], items = plan.days.flatMap((d) => d.items).filter((it) => map[it.key] && !repsOnly(map[it.key]));
  ['chestPress', 'shoulderPress', 'row', 'vPull', 'quad', 'glute', 'hinge', 'chest2', 'back2'].forEach((slot) => {
    const it = items.find((x) => x.slot === slot && !out.includes(x.key));
    if (it && out.length < 6) out.push(it.key);
  });
  return out;
}

// ----- Builder screens -----

    <span class="block font-semibold ${on ? 'text-indigo-700 dark:text-indigo-300' : ''}">${label}</span>${sub ? `<span class="mt-0.5 block text-xs muted">${sub}</span>` : ''}

function bStepError(step) {

}

function builderView() {

function builderPreview() {
  const a = bAns(), plan = state.planner.plan, cands = bCandidates();
  const map = bMap(bCandidates(true)); // look-ups include anything you picked by hand
  const vol = bVolume(plan, map), rec = bRecovery(a), mains = bMainLifts(plan, map);
  const splitName = plan.days.map((d) => d.name.replace(/^\d · /, '')).join(' · ');
  const mins = plan.days.map((d) => Math.round(bDaySecs(d, map) / 60));
  const notes = [];
  const avoided = [...B_AVOID.filter(([k]) => a.avoid.includes(k)).map(([, l]) => l.toLowerCase()), ...B_JOINTS.filter(([k]) => a.joints.includes(k)).map(([, l]) => `anything hard on ${l === 'Hypermobility' ? 'loose joints' : `your ${l.toLowerCase()}`}`)];
  if (avoided.length) notes.push(`Left out: ${avoided.join(', ')}.`);
  B_JOINTS.filter(([k]) => a.joints.includes(k)).forEach(([, , , tip]) => notes.push(tip));
  if (rec.f < 1) notes.push(`Volume is set to about ${Math.round(rec.f * 100)}% of normal${rec.why.length ? ` because of ${rec.why.join(', ')}` : ''}. Build up later if you’re recovering well.`);
  if (a.goal === 'strength') notes.push('Main lifts come first in each session. In Block 3 they go heavy at 5–8 reps.');
  if (a.rpe === 'new') notes.push('RPE: rate how hard the last set felt. 10 = nothing left, 8 = two more reps in you. You get better at it within a few weeks.');
  const used = new Set(plan.days.map((d) => d.dow));
  const bars = MUSCLES.filter((m) => m !== 'Core' || vol[m] > 0).map((m) => {
    const v = vol[m], g = B_GROUPS.find(([, ms]) => ms.includes(m))[0], target = B_VOL[a.levels[g]] * rec.f;
    return `<div class="grid grid-cols-[5.5rem_1fr_2.25rem] items-center gap-2 text-xs">

      <span class="relative h-2 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-800"><span class="absolute inset-y-0 left-0 rounded-full ${v >= target - 1 ? 'bg-emerald-500' : 'bg-amber-500'}" style="width:${Math.min(100, (v / 22) * 100)}%"></span><span class="absolute inset-y-0 w-0.5 bg-slate-900 dark:bg-slate-100" style="left:${Math.min(100, (target / 22) * 100)}%"></span></span>
      <span class="text-right font-bold tabular-nums">${fmt(v)}</span>
    </div>`;
  }).join('');

  return `<section class="mb-4 flex items-center justify-between gap-3">
      <button class="link" data-b="answers">‹ Change answers</button>
      <button class="link text-rose-600 dark:text-rose-400" data-b="cancel">Cancel plan</button>
    </section>
    <section class="card relative mb-4 overflow-hidden pl-7">
      <span class="absolute bottom-4 left-0 top-4 w-2.5 rounded-r-full bg-indigo-500" aria-hidden="true"></span>
      <p class="eyebrow">Your new plan · not saved yet</p>
      <h2 class="mt-1 text-[2.2rem] leading-[0.95]">${esc(splitName)}</h2>
      <div class="mt-3 flex flex-wrap gap-1.5">
        <span class="badge bg-slate-100 dark:bg-slate-800">${plan.days.length} days</span>
        <span class="badge bg-slate-100 dark:bg-slate-800">≈ ${Math.min(...mins)}–${Math.max(...mins)} min</span>
        <span class="badge bg-slate-100 dark:bg-slate-800">${sum(plan.days.map((d) => sum(d.items.map((x) => x.sets))))} sets a week</span>
      </div>
      <p class="mt-3 text-sm muted">Change anything below: days, names, exercises and sets. Nothing in your app changes until you save.</p>
    </section>
    ${notes.length ? `<section class="card mb-4"><h3 class="display text-xl">Built around you</h3><ul class="mt-2 space-y-1.5 text-sm">${notes.map((n) => `<li class="flex gap-2"><span class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-indigo-500"></span><span>${esc(n)}</span></li>`).join('')}</ul></section>` : ''}
    ${plan.days.map((d, di) => {
      const m = Math.round(bDaySecs(d, map) / 60), dot = PLATE_COLORS[di % PLATE_COLORS.length];
      const have = new Set(d.items.map((x) => x.key));
      const addable = cands.filter((c) => !have.has(c.key)).sort((x, y) => x.name.localeCompare(y.name));
      return `<section class="card mb-3">
        <div class="flex items-center gap-2">
          <span class="h-3.5 w-3.5 shrink-0 rounded-full ${dot}"></span>
          <input class="input display min-w-0 flex-1 py-1.5 text-xl" maxlength="30" value="${esc(d.name)}" data-bp="name" data-d="${di}" aria-label="Session name">
          <select class="input w-auto py-2 text-sm" data-bp="dow" data-d="${di}" aria-label="Day">${DAYS.map((n, i) => `<option value="${i}" ${d.dow === i ? 'selected' : ''} ${used.has(i) && d.dow !== i ? 'disabled' : ''}>${n}</option>`).join('')}</select>
        </div>
        <p class="mt-1 text-xs ${m > a.minutes ? 'font-semibold text-amber-700 dark:text-amber-300' : 'muted'}">≈ ${m} min${m > a.minutes ? ` · over your ${a.minutes} min` : ''} · ${sum(d.items.map((x) => x.sets))} sets</p>
        <ul class="mt-2 divide-y divide-slate-200 dark:divide-slate-800">
          ${d.items.map((it, ii) => {
            const c = map[it.key];
            if (!c) return '';
            const alts = it.slot ? bOptions(it.slot, cands).filter((x) => x.key === it.key || !have.has(x.key)).slice(0, 10) : [];
            if (!alts.some((x) => x.key === it.key)) alts.unshift(c);
            return `<li class="py-2">
              <select class="w-full truncate rounded-lg bg-transparent py-1 font-semibold outline-none focus:ring-2 focus:ring-indigo-500/40" data-bp="swap" data-d="${di}" data-i="${ii}" aria-label="Swap exercise">${alts.map((x) => `<option value="${esc(x.key)}" ${x.key === it.key ? 'selected' : ''}>${esc(x.name)}${x.owned ? '' : ' (new)'}</option>`).join('')}</select>
              <div class="flex items-center gap-1">
                <span class="min-w-0 flex-1 text-xs muted">${c.repMin}–${c.repMax} reps · ${bEqLabel(c)}${mains.includes(it.key) ? ' · <b class="text-indigo-600 dark:text-indigo-400">main lift</b>' : ''}${alts.length > 1 && ii === 0 ? ' · tap a name to swap it' : ''}</span>
                <button class="icon-btn h-9 w-9" data-b="sets" data-d="${di}" data-i="${ii}" data-dir="-1" ${it.sets <= 1 ? 'disabled' : ''} aria-label="One set fewer">−</button>
                <span class="w-12 text-center text-sm font-bold tabular-nums">${it.sets} set${it.sets === 1 ? '' : 's'}</span>
                <button class="icon-btn h-9 w-9" data-b="sets" data-d="${di}" data-i="${ii}" data-dir="1" ${it.sets >= 6 ? 'disabled' : ''} aria-label="One more set">+</button>
                <button class="icon-btn h-9 w-9" data-b="remove" data-d="${di}" data-i="${ii}" aria-label="Remove">${ICON_X}</button>
              </div>
            </li>`;
          }).join('')}
        </ul>
        <select class="input mt-2 py-2 text-sm" data-bp="add" data-d="${di}"><option value="">+ Add an exercise…</option>${addable.map((c) => `<option value="${esc(c.key)}">${esc(c.name)}${c.owned ? '' : ' (new)'}</option>`).join('')}</select>
      </section>`;
    }).join('')}
    <section class="card mb-4">
      <h3 class="display text-xl">Sets per muscle each week</h3>
      <p class="mb-3 text-xs muted">Working sets (secondary muscles count ½). The line marks what your answers aim for.</p>
      <div class="space-y-2">${bars}</div>
      <p class="mt-3 text-sm"><span class="muted">Main lifts:</span> ${mains.map((k) => esc(map[k]?.name)).join(', ') || 'none'}</p>
    </section>
    <section class="card mb-4 space-y-3">
      <label class="flex items-start justify-between gap-3"><span><span class="block font-semibold">Update my food profile</span><span class="text-xs muted">Saves your age, height and weight there. Your calorie targets stay as they are until you recalculate them.</span></span>
        <input type="checkbox" class="mt-1 h-6 w-6 shrink-0 accent-indigo-600" id="b-food" ${state.food.profile ? 'checked' : ''}></label>
      <p class="text-xs muted">Saving replaces your routines and weekly schedule. Your workout history, records${state.programme ? ', the 12-week programme (blocks, deloads, check-ins)' : ''} and food logs are kept.${state.programme ? ' Main lifts in the programme switch to the ones above.' : ''}</p>
    </section>
    <div class="grid grid-cols-[1fr_2fr] gap-3">
      <button class="btn-ghost" data-b="cancel">Cancel</button>
      <button class="btn-primary display text-lg tracking-[0.08em]" data-b="save">Save this plan</button>
    </div>`;
}

function savePlan() {
  const a = bAns(), plan = state.planner.plan, created = [];
  const map = bMap(bCandidates(true));
  const exFor = (key) => (key.startsWith('own:') ? exById(key.slice(4)) : planExercise(key.slice(4), created));
  const today = todayISO(), keys = {};
  const routines = [...plan.days].sort((x, y) => x.dow - y.dow).map((d, k) => {
    const ids = [], sets = {};
    d.items.forEach((it) => {
      const ex = exFor(it.key);
      if (!ex || ids.includes(ex.id)) return;
      keys[it.key] = ex.id;
      ids.push(ex.id);
      if (it.sets !== (ex.sets || 3)) sets[ex.id] = it.sets;
    });
    return { id: state.routines[k]?.id || uid(), name: d.name.trim() || `Day ${k + 1}`, exerciseIds: ids, sets, links: {}, dow: d.dow };
  });
  state.routines = routines.map(({ dow: _d, ...r }) => r);
  state.schedule.weekly = Object.fromEntries(routines.map((r) => [r.dow, r.id]));
  Object.keys(state.schedule.overrides).forEach((d) => { if (d >= today) delete state.schedule.overrides[d]; });
  const mains = bMainLifts(plan, map).map((k) => keys[k]).filter(Boolean);
  if (state.programme) state.programme.main = mains;
  if (document.getElementById('b-food')?.checked) {
    state.food.profile = { activity: 1.55, goal: 'lose-slow', ...(state.food.profile || {}), sex: a.sex, age: Number(a.age), height: Number(a.height), weight: Number(a.weight) };
  }
  if (a.goalKg && state.programme && !state.programme.goalKg) state.programme.goalKg = Number(a.goalKg);
  state.settings.planLoaded = NEW_PLAN.id; // the one-off "new plan" card is no longer needed
  state.planner = { ...state.planner, plan: null, step: 'intro', main: mains, savedAt: today };
  return created;
}

function builderCard() {
  return `<button class="card relative mb-4 block w-full overflow-hidden pl-7 text-left transition active:scale-[0.99]" data-action="builder-open">
    <span class="absolute bottom-4 left-0 top-4 w-2.5 rounded-r-full bg-violet-500" aria-hidden="true"></span>
    <p class="eyebrow">${state.planner.plan ? 'Plan in progress' : 'Plan builder'}</p>
    <h3 class="display mt-1 text-2xl leading-none">${state.planner.plan ? 'Finish reviewing your plan' : state.planner.savedAt ? 'Build a new plan' : 'Build my plan'}</h3>
    <p class="mt-1 text-sm muted">${state.planner.plan ? 'Pick up where you left off. Nothing is saved yet.' : 'Answer questions about you, your body and your week. See the plan, change it, and only save it if you like it.'}</p>
  </button>`;
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-b]');
  if (!b || view !== 'builder') return;
  const pl = state.planner, a = pl.answers, step = pl.step || 'intro';
  switch (b.dataset.b) {
    case 'pick': a[b.dataset.key] = typeof a[b.dataset.key] === 'number' ? Number(b.dataset.val) : b.dataset.val; break;
    case 'toggle': {
      const k = b.dataset.key, v = k === 'days' ? Number(b.dataset.val) : b.dataset.val;
      a[k] = a[k].includes(v) ? a[k].filter((x) => x !== v) : [...a[k], v];
      break;
    }
    case 'level': a.levels[b.dataset.g] = b.dataset.val; break;
    case 'back': pl.step = B_STEPS[Math.max(0, B_STEPS.indexOf(step) - 1)]; window.scrollTo(0, 0); break;
    case 'next': {
      const err = bStepError(step);
      if (err) { const el = document.getElementById('b-error'); el.textContent = err; el.classList.remove('hidden'); return; }
      const i = B_STEPS.indexOf(step);
      if (i === B_STEPS.length - 1) pl.plan = buildPlan();
      else pl.step = B_STEPS[i + 1];
      window.scrollTo(0, 0);
      break;
    }
    case 'answers': pl.plan = null; pl.step = B_STEPS[B_STEPS.length - 1]; window.scrollTo(0, 0); break;
    case 'cancel': {
      if (pl.plan && !confirm('Cancel this plan? Your current routines and schedule stay exactly as they are.')) return;
      pl.plan = null; pl.step = 'intro'; view = 'plan'; window.scrollTo(0, 0);
      toast('Plan cancelled. Nothing was changed.');
      break;
    }
    case 'sets': { const it = pl.plan.days[b.dataset.d].items[b.dataset.i]; it.sets = Math.max(1, Math.min(6, it.sets + Number(b.dataset.dir))); break; }
    case 'remove': pl.plan.days[b.dataset.d].items.splice(Number(b.dataset.i), 1); break;
    case 'save': {
      if (!pl.plan.days.every((d) => d.items.length)) { toast('Every day needs at least one exercise'); return; }
      if (!confirm('Save this plan? Your routines and weekly schedule are replaced. History, records, food logs and the 12-week programme are kept.')) return;
      const created = savePlan();
      view = 'plan'; window.scrollTo(0, 0);
      toast(`New plan saved${created.length ? `. Added ${created.length} new exercise${created.length === 1 ? '' : 's'}` : ''}`);
      break;
    }
    default: return;
  }
  saveState(); render();
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (view !== 'builder') return;
  const pl = state.planner;
  if (el.dataset.bq) { pl.answers[el.dataset.bq] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value; saveState(); return; }
  const bp = el.dataset.bp;
  if (!bp || !pl.plan) return;
  const d = pl.plan.days[el.dataset.d];
  if (bp === 'name') d.name = el.value;
  if (bp === 'dow') d.dow = Number(el.value);
  if (bp === 'swap') d.items[el.dataset.i].key = el.value;
  if (bp === 'add' && el.value) {
    const c = bMap(bCandidates(true))[el.value];
    const slot = Object.keys(B_SLOTS).find((s) => c && B_SLOTS[s].t(c)) || null;
    d.items.push({ key: el.value, slot, sets: 3 });
  }
  saveState(); render();
});

/** Main muscles a routine trains (primary muscles, most sets first). */
function routineFocus(r) {
  const vol = {};
  r.exerciseIds.map(exById).filter(Boolean).forEach((ex) => Object.entries(ex.muscles || {}).forEach(([m, f]) => { if (f === 1) vol[m] = (vol[m] || 0) + (r.sets?.[ex.id] || ex.sets || 3); }));
  return Object.keys(vol).sort((a, b) => vol[b] - vol[a]).slice(0, 4).join(', ');
}

/** The week as a table: day, session (plate colour, focus) and status. */
function planTable(start) {
  const today = todayISO();
  const rows = DAYS.map((name, i) => {
    const d = addDays(start, i), r = plannedRoutine(d), st = dayStatus(d);
    const done = state.history.filter((h) => h.date === d);
    const moved = state.schedule.overrides[d] !== undefined;
    const vol = {};
    done.forEach((h) => Object.entries(exById(h.exerciseId)?.muscles || {}).forEach(([m, f]) => { if (f === 1) vol[m] = (vol[m] || 0) + h.sets.length; }));
    const doneName = Object.keys(vol).sort((a, b) => vol[b] - vol[a]).slice(0, 2).join(' & ') || 'Workout';
    const status = { done: '<span class="text-emerald-600 dark:text-emerald-400">Done ✓</span>', missed: '<span class="text-rose-600 dark:text-rose-400">Missed</span>', planned: d === today ? '<span class="text-indigo-600 dark:text-indigo-400">Today</span>' : '<span class="muted">—</span>', rest: '<span class="muted">Rest</span>' }[st];
    return `<button class="grid w-full grid-cols-[3.25rem_1fr_4.25rem] items-center gap-2 px-3 py-2.5 text-left transition active:bg-slate-100 dark:active:bg-slate-800 ${d === today ? 'bg-indigo-500/10' : ''} ${st === 'rest' ? 'opacity-60' : ''}" data-action="open-day" data-date="${d}">
      <span><span class="block text-sm font-bold">${name}</span><span class="block text-[11px] muted">${parseISO(d).getDate()} ${parseISO(d).toLocaleDateString('en-GB', { month: 'short' })}</span></span>
      <span class="min-w-0">
        <span class="flex items-center gap-2">${r && st !== 'done' ? plateDot(r) : ''}<span class="display truncate text-lg leading-tight">${esc(st === 'done' ? doneName : r ? r.name : 'Rest')}${moved ? '*' : ''}</span></span>
        ${st === 'done' ? `<span class="block truncate text-[11px] muted">${done.length} exercise${done.length === 1 ? '' : 's'} logged</span>` : r ? `<span class="block truncate text-[11px] muted">${esc(routineFocus(r))}</span>` : ''}
      </span>
      <span class="text-right text-xs font-semibold">${status}</span>
    </button>`;
  });
  return `<div class="overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800">
    <div class="grid grid-cols-[3.25rem_1fr_4.25rem] gap-2 border-b-2 border-indigo-500 px-3 py-2 text-[11px] font-bold uppercase tracking-[0.12em] muted"><span>Day</span><span>Session</span><span class="text-right">Status</span></div>
    <div class="divide-y divide-slate-200 dark:divide-slate-800">${rows.join('')}</div>
  </div>`;
}

          <p class="text-xs muted">${names.length} exercise${names.length === 1 ? '' : 's'}${days.length ? ` · ${days.join(', ')}` : ' · not scheduled'}${names.length ? ` · ≈ ${sessionMinutes(r, addDays(planWeek, Math.max(0, DAYS.findIndex((_, i) => state.schedule.weekly[i] === r.id))))} min` : ''}</p>

  }).join('')}</div>`;

        <button class="icon-btn h-9 w-9" data-action="routine-move" data-k="${k}" data-dir="-1" ${k === 0 ? 'disabled' : ''} aria-label="Move up">↑</button>
        <button class="icon-btn h-9 w-9" data-action="routine-move" data-k="${k}" data-dir="1" ${k === arr.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button>
        <button class="icon-btn h-9 w-9" data-action="routine-remove" data-k="${k}" aria-label="Remove">${ICON_X}</button>
      </li>`).join('') || '<li class="text-sm muted">No exercises yet. Add some below.</li>'}
    </ol>
    ${available.length ? `<select class="input mt-2" data-action="routine-add">
      <option value="">+ Add exercise…</option>
      ${available.map((e) => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}
    </select>` : ''}
    <div class="mt-4 flex gap-3">
      <button class="btn-ghost flex-1" data-action="cancel-routine">Cancel</button>
      <button class="btn-primary flex-1" data-action="save-routine">Save routine</button>
    </div>
  </article>`;
}

// ----- Stats tab -----
/** Food for a finished day: calories and protein each rated good / close / low (null = nothing logged). */
function foodDayRating(date) {
  const t = targetsFor(date), got = dayTotals(date);
  if (!t || got.kcal < 800) return null;
  const k = got.kcal / t.kcal, p = got.protein / t.protein;
  return {
    kcal: k >= 0.9 && k <= 1.1 ? 'good' : k >= 0.8 && k <= 1.2 ? 'close' : 'off',
    protein: p >= 0.95 ? 'good' : p >= 0.8 ? 'close' : 'off',
  };
}

/** Month calendar: top box = gym session, bottom box = food (left half calories, right half protein). */
function monthCard() {
  const [y, m] = statsMonth.split('-').map(Number), first = `${statsMonth}-01`, today = todayISO();
  const days = new Date(y, m, 0).getDate(), pad = dow(first);
  const tone = { good: 'bg-emerald-500', close: 'bg-amber-500', off: 'bg-rose-500' };
  let gym = 0, foodGood = 0, both = 0, weighs = 0;
  const firstLog = state.history.map((h) => h.date).sort()[0] || today; // planned days before you used the app aren't "missed"
  const cells = Array.from({ length: days }, (_, i) => {
    const d = `${statsMonth}-${String(i + 1).padStart(2, '0')}`;
    const future = d > today, trained = state.history.some((h) => h.date === d);
    const planned = plannedRoutine(d), f = !future && d < today ? foodDayRating(d) : null;
    const inProgress = d === today && dayTotals(d).kcal > 0;
    const allGood = f && f.kcal === 'good' && f.protein === 'good';
    if (trained) gym++;
    if (allGood) foodGood++;
    if (trained && allGood) both++;
    if (state.food.weights[d] != null) weighs++;
    const gymBox = trained ? 'bg-emerald-500' : planned && d < today && d >= firstLog ? 'bg-rose-500/30' : planned && d >= today ? plateColor(planned) + ' opacity-60' : 'bg-slate-200 dark:bg-slate-800';
    const foodBox = f ? `<span class="flex h-2 overflow-hidden rounded-sm"><span class="flex-1 ${tone[f.kcal]}"></span><span class="flex-1 ${tone[f.protein]}"></span></span>`
      : `<span class="block h-2 rounded-sm ${inProgress ? 'border border-dashed border-slate-400 dark:border-slate-500' : 'bg-slate-200 dark:bg-slate-800'}"></span>`;
    return `<div class="flex min-w-0 flex-col gap-1 rounded-lg p-1 ${d === today ? 'ring-2 ring-slate-900 dark:ring-slate-100' : ''} ${future ? 'opacity-40' : ''}">
      <span class="text-xs font-bold tabular-nums">${i + 1}</span>
      <span class="block h-2 rounded-sm ${gymBox}"></span>${foodBox}
    </div>`;
  });
  const label = parseISO(first).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const stat = (l, v) => `<div class="bg-white p-2.5 dark:bg-slate-900"><p class="text-[10px] font-bold uppercase tracking-[0.12em] muted">${l}</p><p class="display text-2xl leading-none tabular-nums">${v}</p></div>`;
  return `<section class="card mb-4">
    <div class="mb-3 flex items-center justify-between">
      <button class="icon-btn text-2xl" data-action="stats-month" data-dir="-1" aria-label="Previous month">‹</button>
      <h3 class="display text-xl">${label}</h3>
      <button class="icon-btn text-2xl" data-action="stats-month" data-dir="1" ${statsMonth >= today.slice(0, 7) ? 'disabled' : ''} aria-label="Next month">›</button>
    </div>
    <div class="mb-3 grid grid-cols-4 gap-px overflow-hidden rounded-xl border border-slate-200 bg-slate-200 dark:border-slate-800 dark:bg-slate-800">
      ${stat('Gym', gym)}${stat('Food ✓', foodGood)}${stat('Both ✓', both)}${stat('Weighed', weighs)}
    </div>
    <div class="grid grid-cols-7 gap-0.5 text-center text-[10px] font-bold uppercase tracking-wider muted">${DAYS.map((d) => `<span>${d.slice(0, 2)}</span>`).join('')}</div>
    <div class="mt-1 grid grid-cols-7 gap-0.5">${'<div></div>'.repeat(pad)}${cells.join('')}</div>
    <div class="mt-3 space-y-1 text-[11px] muted">
      <p><b class="text-slate-700 dark:text-slate-200">Top bar, gym:</b> <span class="inline-block h-2 w-3 rounded-sm bg-emerald-500"></span> done · <span class="inline-block h-2 w-3 rounded-sm bg-rose-500/30"></span> missed · faded colour = planned</p>
      <p><b class="text-slate-700 dark:text-slate-200">Bottom bar, food</b> (left calories, right protein): <span class="inline-block h-2 w-3 rounded-sm bg-emerald-500"></span> on target · <span class="inline-block h-2 w-3 rounded-sm bg-amber-500"></span> close · <span class="inline-block h-2 w-3 rounded-sm bg-rose-500"></span> well off · <span class="inline-block h-2 w-3 rounded-sm border border-dashed border-slate-400"></span> today so far</p>
    </div>
  </section>`;
}

const kgLifted = (h) => (isBW(exById(h.exerciseId) || {}) ? 0 : tonnage(h.sets)); // bodyweight/assist kg isn't load moved

function weekVolume(start) {
  const end = addDays(start, 6);
  return sum(state.history.filter((h) => h.date >= start && h.date <= end).map(kgLifted));
}

function muscleVolume(start) {
  const end = addDays(start, 6);
  const out = Object.fromEntries(MUSCLES.map((m) => [m, { sets: 0, kg: 0 }]));
  let untagged = 0;
  state.history.filter((h) => h.date >= start && h.date <= end).forEach((h) => {
    const ex = exById(h.exerciseId);
    if (!ex) return;
    const ev = evaluate(ex, h.sets);
    const n = ev.working.length, kg = isBW(ex) ? 0 : tonnage(ev.working);
    const ms = Object.entries(ex.muscles || {});
    if (!ms.length) { untagged += n; return; }
    ms.forEach(([m, f]) => { if (out[m]) { out[m].sets += n * f; out[m].kg += kg * f; } });
  });
  return { out, untagged };
}

function weekStreak() {
  const weeks = new Set(state.history.map((h) => weekStart(h.date)));
  let w = weekStart(todayISO());
  if (!weeks.has(w)) w = addDays(w, -7); // this week isn't over yet
  let n = 0;
  while (weeks.has(w)) { n++; w = addDays(w, -7); }
  return n;
}

function statsView() {
  if (!state.history.length) {
    return `<h2 class="mb-4 text-3xl">Stats</h2>` + journeyCard() + monthCard() + nutritionCard() + measuresCard() +
      emptyState('No workouts yet', 'Log your first workout and your progress, volume and records will show up here.', 'Start a workout', 'goto-today');
  }
  const thisWeek = weekStart(todayISO());
  const weekDates = DAYS.map((_, i) => addDays(thisWeek, i));
  const doneDays = weekDates.filter((d) => state.history.some((h) => h.date === d)).length;
  const plannedDays = weekDates.filter((d) => plannedRoutine(d)).length;
  const since = addDays(todayISO(), -30);
  const prCount = state.history.filter((h) => h.date >= since && prsFor(h).length).length;

  const tile = (label, value, sub) => `<div class="tile">
    <p class="text-xs font-semibold uppercase tracking-wide muted">${label}</p>
    <p class="display mt-1 text-3xl leading-none tabular-nums">${value}</p>
    <p class="text-xs muted">${sub}</p>
  </div>`;

  let html = `<h2 class="mb-4 text-3xl">Stats</h2>
  <section class="mb-4 grid grid-cols-2 gap-3">
    ${tile('This week', `${doneDays}${plannedDays ? `<span class="font-sans text-base font-bold normal-case muted"> / ${plannedDays}</span>` : ''}`, plannedDays ? 'workouts done / planned' : 'workout days')}
    ${tile('Streak', weekStreak(), 'weeks in a row')}
    ${tile('Volume', fmtKg(weekVolume(thisWeek)), 'kg lifted this week')}
    ${tile('Records', prCount, 'PR sessions, last 30 days')}
  </section>`;
  html += journeyCard();
  html += monthCard();
  html += recapHtml(statsWeek, false) || '';
  html += nutritionCard();

  // Weekly sets per muscle
  const { out, untagged } = muscleVolume(statsWeek);
  const maxSets = Math.max(25, ...Object.values(out).map((v) => v.sets));
  const pct = (v) => `${(v / maxSets) * 100}%`;
  html += `<section class="card mb-4">
    <h3 class="font-semibold">Weekly sets per muscle</h3>
    <p class="text-xs muted">Working sets · secondary muscles count ½ · shaded band = ${SET_TARGET[0]}–${SET_TARGET[1]} sets, a common growth target</p>
    <div class="my-3 flex items-center justify-between">
      <button class="icon-btn text-2xl" data-action="stats-week" data-dir="-1" aria-label="Previous week">‹</button>
      <span class="text-sm font-semibold">${statsWeek === thisWeek ? 'This week' : `${fmtShort(statsWeek)} – ${fmtShort(addDays(statsWeek, 6))}`}</span>
      <button class="icon-btn text-2xl" data-action="stats-week" data-dir="1" ${statsWeek >= thisWeek ? 'disabled' : ''} aria-label="Next week">›</button>
    </div>
    <div class="space-y-2.5">
      ${MUSCLES.map((m) => {
        const v = out[m];
        const status = v.sets === 0 ? '—' : v.sets < SET_TARGET[0] ? 'Low' : v.sets <= SET_TARGET[1] ? 'On target' : 'High';
        return `<div class="grid grid-cols-[5.5rem_1fr_4.5rem] items-center gap-2" title="${m}: ${fmt(v.sets)} sets, ${fmtKg(v.kg)} kg">
          <span class="text-sm font-medium">${m}</span>
          <div class="relative h-5">
            <div class="absolute inset-y-0 rounded bg-slate-200/70 dark:bg-slate-800" style="left:${pct(SET_TARGET[0])};width:${pct(SET_TARGET[1] - SET_TARGET[0])}"></div>
            <div class="absolute inset-y-1 left-0 rounded-r-[4px] bg-indigo-500" style="width:${v.sets ? pct(v.sets) : '0'}"></div>
          </div>
          <span class="text-right text-xs leading-tight"><b class="tabular-nums">${fmt(v.sets)}</b> <span class="muted">sets</span><br><span class="muted">${status}</span></span>
        </div>`;
      }).join('')}
    </div>
    ${untagged ? `<p class="mt-3 text-xs muted">${fmt(untagged)} sets came from exercises with no muscles tagged. Tag them in Exercises.</p>` : ''}
  </section>`;

  // Weekly volume trend (8 weeks)
  const weeks = Array.from({ length: 8 }, (_, k) => addDays(thisWeek, -7 * (7 - k)));
  const vols = weeks.map(weekVolume);
  const maxVol = Math.max(1, ...vols);
  html += `<section class="card mb-4" data-chart="bars">
    <h3 class="font-semibold">Total volume per week</h3>
    <p class="text-sm muted" data-readout>Week of ${fmtShort(weeks[7])}: <b class="text-slate-900 dark:text-slate-100">${fmtKg(vols[7])} kg</b></p>
    <div class="mt-3 flex h-36 items-end gap-2 border-b border-slate-200 dark:border-slate-800">
      ${weeks.map((w, k) => `<button class="flex h-full flex-1 items-end justify-center" data-action="bar" data-readout="Week of ${fmtShort(w)}: <b class='text-slate-900 dark:text-slate-100'>${fmtKg(vols[k])} kg</b>" aria-label="Week of ${fmtShort(w)}: ${fmtKg(vols[k])} kg">
        <span class="block w-full max-w-[24px] rounded-t-[4px] ${vols[k] ? 'bg-indigo-500' : 'bg-slate-300 dark:bg-slate-700'}" style="height:${vols[k] ? Math.max(3, (vols[k] / maxVol) * 100) : 2}%"></span>
      </button>`).join('')}
    </div>
    <div class="mt-1 flex gap-2 text-center text-[10px] muted">${weeks.map((w) => `<span class="flex-1">${fmtShort(w).replace(' ', ' ')}</span>`).join('')}</div>
  </section>`;

  html += muscleTrendCard();

  // Per-exercise progress
  const logged = state.exercises.filter((e) => sessionsFor(e.id).length);
  if (!statsExId || !logged.some((e) => e.id === statsExId)) statsExId = logged[0]?.id || null;
  const ex = exById(statsExId);
  if (ex) {
    const ss = sessionsFor(ex.id).slice().reverse();
    const bw = isBW(ex);
    const pts = ss.map((h) => {
      const ev = evaluate(ex, h.sets);
      return { date: h.date, v: bw ? Math.max(...ev.reps) : Math.round(bestE1(h.sets) * 10) / 10, top: ev };
    });
    const first = pts[0].v, lastV = pts[pts.length - 1].v;
    const change = first ? ((lastV - first) / first) * 100 : 0;
    const best = Math.max(...pts.map((p) => p.v));
    const tops = ss.map((h) => evaluate(ex, h.sets).top);
    const hardest = isAssisted(ex) ? Math.min(...tops) : Math.max(...tops);
    const bestSet = bw
      ? ss.flatMap((h) => h.sets).reduce((b, s) => (harder(ex, s.weight, b.weight) || (s.weight === b.weight && s.reps > b.reps) ? s : b))
      : ss.flatMap((h) => h.sets).reduce((b, s) => (s.weight * s.reps > b.weight * b.reps ? s : b));
    html += `<section class="card mb-4">
      <h3 class="font-semibold">Exercise progress</h3>
      <p class="mb-3 text-xs muted">${bw ? 'Most reps in a working set, per session.' : 'Estimated 1-rep max per session (Epley formula).'} Tap the chart for details.</p>
      <select class="input mb-3" data-action="stats-ex">${logged.map((e) => `<option value="${e.id}" ${e.id === ex.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select>
      ${pts.length > 1 ? lineChart(pts, ex) : '<p class="rounded-xl bg-slate-100 p-4 text-center text-sm muted dark:bg-slate-800/60">Log one more session to see a trend line.</p>'}
      <div class="mt-4 grid grid-cols-2 gap-3 text-sm">
        <div><p class="muted">${bw ? 'Most reps (one set)' : 'Best est. 1RM'}</p><p class="text-lg font-bold tabular-nums">${fmt(best)}${bw ? '' : ' kg'}</p></div>
        ${bw ? `<div><p class="muted">Sessions logged</p><p class="text-lg font-bold tabular-nums">${ss.length}</p></div>`
          : `<div><p class="muted">Change since first</p><p class="text-lg font-bold tabular-nums">${change >= 0 ? '+' : ''}${change.toFixed(1)}%</p></div>`}
        <div><p class="muted">${isAssisted(ex) ? 'Least assistance' : bw ? 'Most added weight' : 'Heaviest weight'}</p><p class="text-lg font-bold tabular-nums">${loadLabel(ex, hardest)}</p></div>
        <div><p class="muted">Best set</p><p class="text-lg font-bold tabular-nums">${repsOnly(ex) ? `${bestSet.reps} reps` : `${loadLabel(ex, bestSet.weight)} × ${bestSet.reps}`}</p></div>
      </div>
    </section>`;
  }
  return html + measuresCard();
}

// ----- Weekly nutrition summary -----
function nutritionCard() {
  const t0 = state.food.targets;
  if (!t0 || !Object.keys(state.food.log).length) return '';
  const thisWeek = weekStart(todayISO());
  const days = DAYS.map((name, i) => {
    const date = addDays(statsWeek, i);
    return { name, date, tot: dayTotals(date), t: targetsFor(date), logged: dayEntries(date).length > 0, future: date > todayISO() };
  });
  const logged = days.filter((d) => d.logged);
  const avg = (f) => (logged.length ? Math.round(sum(logged.map(f)) / logged.length) : 0);
  const onKcal = logged.filter((d) => Math.abs(d.tot.kcal - d.t.kcal) <= d.t.kcal * 0.1).length;
  const onProtein = logged.filter((d) => d.tot.protein >= d.t.protein * 0.9).length;
  const max = Math.max(1, ...days.map((d) => Math.max(d.tot.kcal, d.t.kcal))) * 1.1;
  const pct = (v) => `${(v / max) * 100}%`;
  const readout = (d) => d.logged
    ? `${fmtDay(d.date)}: <b class='text-slate-900 dark:text-slate-100'>${fmtKg(d.tot.kcal)}</b> of ${fmtKg(d.t.kcal)} kcal · ${Math.round(d.tot.protein)} g protein`
    : `${fmtDay(d.date)}: ${d.future ? 'still to come' : 'nothing logged'}`;
  const latest = [...days].reverse().find((d) => d.logged) || days[0];
  const tile = (label, value, sub) => `<div class="rounded-xl bg-slate-100 p-2.5 dark:bg-slate-800/60"><p class="text-xs muted">${label}</p><p class="text-lg font-bold tabular-nums">${value}</p><p class="text-[11px] muted">${sub}</p></div>`;
  return `<section class="card mb-4" data-chart="bars">
    <div class="flex items-center justify-between gap-2">
      <h3 class="font-semibold">Nutrition</h3>
      <div class="flex items-center">
        <button class="icon-btn h-8 w-8 text-xl" data-action="stats-week" data-dir="-1" aria-label="Previous week">‹</button>
        <span class="text-sm font-semibold">${statsWeek === thisWeek ? 'This week' : `w/c ${fmtShort(statsWeek)}`}</span>
        <button class="icon-btn h-8 w-8 text-xl" data-action="stats-week" data-dir="1" ${statsWeek >= thisWeek ? 'disabled' : ''} aria-label="Next week">›</button>
      </div>
    </div>
    ${logged.length ? `<div class="mt-2 grid grid-cols-2 gap-2">
      ${tile('Avg calories', fmtKg(avg((d) => d.tot.kcal)), `target ${fmtKg(avg((d) => d.t.kcal))}`)}
      ${tile('Avg protein', `${avg((d) => d.tot.protein)} g`, `target ${avg((d) => d.t.protein)} g`)}
      ${tile('Calories on target', `${onKcal} / ${logged.length}`, 'logged days within 10%')}
      ${tile('Protein hit', `${onProtein} / ${logged.length}`, 'logged days at 90%+')}
    </div>
    <p class="mt-3 text-sm muted" data-readout>${readout(latest)}</p>
    <div class="mt-2 flex h-28 items-end gap-2 border-b border-slate-200 dark:border-slate-800">
      ${days.map((d) => `<button class="relative flex h-full flex-1 items-end justify-center" data-action="bar" data-readout="${readout(d)}" aria-label="${esc(readout(d).replace(/<[^>]+>/g, ''))}">
        <span class="block w-full max-w-[24px] rounded-t-[4px] ${d.logged ? 'bg-indigo-500' : 'bg-slate-300 dark:bg-slate-700'}" style="height:${d.logged ? pct(d.tot.kcal) : '2px'}"></span>
        <span class="absolute left-1/2 w-[30px] -translate-x-1/2 border-t-2 border-slate-900 dark:border-slate-100" style="bottom:${pct(d.t.kcal)}"></span>
      </button>`).join('')}
    </div>
    <div class="mt-1 flex gap-2 text-center text-[10px] muted">${days.map((d) => `<span class="flex-1">${d.name}</span>`).join('')}</div>
    <p class="mt-2 flex items-center gap-4 text-xs muted">
      <span class="flex items-center gap-1.5"><span class="inline-block h-2.5 w-2.5 rounded-sm bg-indigo-500"></span>Eaten</span>
      <span class="flex items-center gap-1.5"><span class="inline-block h-0.5 w-4 bg-slate-900 dark:bg-slate-100"></span>Target</span>
    </p>` : '<p class="mt-2 text-sm muted">No food logged this week.</p>'}
  </section>`;
}

// ----- Body measurements -----
const MEASURES = [['waist', 'Waist'], ['chest', 'Chest'], ['hips', 'Hips'], ['arms', 'Arms (flexed)'], ['thighs', 'Thighs'], ['neck', 'Neck']];

function measureSeries(key) {
  return Object.keys(state.body.measures).sort().filter((d) => state.body.measures[d][key] > 0).map((d) => ({ date: d, v: state.body.measures[d][key] }));
}

function measuresCard() {
  const dates = Object.keys(state.body.measures).sort();
  const rows = MEASURES.map(([key, label]) => ({ key, label, series: measureSeries(key) })).filter((r) => r.series.length);
  const signed = (v) => `${v > 0 ? '+' : ''}${fmt(round1(v))}`;
  return `<section class="card mb-4">
    <div class="flex items-center justify-between gap-2">
      <h3 class="font-semibold">Body measurements</h3>
      ${dates.length ? `<span class="text-xs muted">Last: ${fmtShort(dates[dates.length - 1])}</span>` : ''}
    </div>
    ${rows.length ? `<ul class="mt-2 divide-y divide-slate-200 dark:divide-slate-800">${rows.map(({ label, series }) => {
      const last = series[series.length - 1], first = series[0];
      return `<li class="flex items-center justify-between gap-3 py-2">
        <span class="min-w-0"><span class="block text-sm font-medium">${label}</span>
          <span class="text-xs muted">${series.length > 1 ? `${signed(last.v - first.v)} cm since ${fmtShort(first.date)}` : 'First entry'}</span></span>
        <span class="flex items-center gap-3">${series.length > 1 ? sparkSvg(series.map((x) => x.v)) : ''}<b class="w-16 text-right tabular-nums">${fmt(last.v)} cm</b></span>
      </li>`;
    }).join('')}</ul>`
      : '<p class="mt-1 text-sm muted">Track waist, chest, arms and more every couple of weeks. Useful when the scale barely moves but your shape is changing.</p>'}
    <button class="btn-ghost mt-3 w-full py-2.5" data-action="open-measures">${dates.length ? 'Log or edit measurements' : 'Log measurements'}</button>
  </section>`;
}

      <p class="text-xs muted">Measure first thing in the morning, tape snug but not tight, same spot each time. Leave any blank.</p>
      <button type="submit" class="btn-primary w-full">Save</button>

const PLATE_STYLE = { 25: 'bg-red-600 h-28', 20: 'bg-blue-600 h-28', 15: 'bg-yellow-400 h-24', 10: 'bg-green-600 h-20', 5: 'bg-slate-100 border border-slate-400 h-16', 2.5: 'bg-red-500 h-12', 1.25: 'bg-slate-400 h-10' };

function platesModal() {
  const bar = modal.bar ?? state.settings.barWeight;
  return `${modalHead('Plate calculator')}
    <div class="grid grid-cols-[1fr_7.5rem] gap-3">
      <label class="block"><span class="label">Total weight (kg)</span>
        <input class="input text-lg font-semibold" type="number" inputmode="decimal" step="any" min="0" data-pc="total" value="${esc(modal.total ?? '')}" placeholder="e.g. 82.5"></label>
      <label class="block"><span class="label">Bar</span>
        <select class="input" data-pc="bar">${[20, 15, 10, 7.5].map((w) => `<option value="${w}" ${bar === w ? 'selected' : ''}>${w} kg</option>`).join('')}</select></label>
    </div>
    <div id="pc-result" class="mt-4">${platesResult()}</div>`;
}

function platesResult() {
  const total = parseFloat(modal.total), bar = Number(modal.bar ?? state.settings.barWeight);
  if (!(total > 0)) return '<p class="text-sm muted">Enter the total weight on the bar, including the bar itself.</p>';
  if (total < bar) return `<p class="text-sm muted">That’s lighter than the ${fmt(bar)} kg bar.</p>`;
  let side = round2((total - bar) / 2);
  const used = [];
  for (const pl of PLATES) while (side >= pl - 0.001) { used.push(pl); side = round2(side - pl); }
  const loaded = round2(bar + 2 * sum(used));
  return `<div class="rounded-xl bg-slate-100 p-3 dark:bg-slate-800/60">
      <p class="text-sm muted">Each side</p>
      <p class="text-xl font-bold">${used.length ? used.map(fmt).join(' + ') : 'Nothing: empty bar'}</p>
      ${side > 0.01 ? `<p class="mt-1 text-sm text-amber-700 dark:text-amber-400">Can’t make exactly ${fmt(total)} kg with standard plates; closest is <b>${fmt(loaded)} kg</b>.</p>` : ''}
    </div>
    ${used.length ? `<div class="mt-4 flex items-center" aria-hidden="true">
      <div class="h-3 w-16 rounded-l bg-slate-400"></div>
      <div class="h-8 w-2 bg-slate-500"></div>
      ${used.map((pl) => `<div class="${PLATE_STYLE[pl]} mx-px flex w-5 items-center justify-center rounded-sm"></div>`).join('')}
      <div class="h-3 w-6 rounded-r bg-slate-400"></div>
    </div>
    <p class="mt-1 flex flex-wrap gap-x-3 text-xs muted">${[...new Set(used)].map((pl) => `<span>${fmt(pl)} kg × ${used.filter((x) => x === pl).length}</span>`).join('')}</p>` : ''}`;
}

/** Single-series line chart (inline SVG) with a tap/hover tooltip. */
function lineChart(points, ex) {
  const bw = ex && isBW(ex);
  const W = 340, H = 190, pl = 40, pr = 14, pt = 14, pb = 24;
  const vs = points.map((p) => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = (hi - lo) * 0.15 || Math.max(2, hi * 0.05);
  lo = Math.max(0, lo - pad); hi += pad;
  const raw = (hi - lo) / 3;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const ticks = [];
  for (let t = lo; t <= hi + 1e-9; t += step) ticks.push(round2(t));

  const t0 = parseISO(points[0].date).getTime(), t1 = parseISO(points[points.length - 1].date).getTime();
  const x = (d) => pl + (t1 === t0 ? (W - pl - pr) / 2 : ((parseISO(d).getTime() - t0) / (t1 - t0)) * (W - pl - pr));
  const y = (v) => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const xy = points.map((p) => ({ x: round2(x(p.date)), y: round2(y(p.v)),
    label: `<b>${fmt(p.v)}${bw ? ' reps</b> best set' : ' kg</b> est. 1RM'}<br><span class='opacity-80'>${fmtShort(p.date)} · ${ex ? loadLabel(ex, p.top.top) : `${fmt(p.top.top)} kg`} × ${p.top.reps.join('/')}</span>` }));
  const path = xy.map((p, k) => `${k ? 'L' : 'M'}${p.x},${p.y}`).join(' ');
  const lastP = xy[xy.length - 1];

  return `<div class="relative" data-chart="line" data-w="${W}" data-h="${H}" data-points="${esc(JSON.stringify(xy))}">
    <svg viewBox="0 0 ${W} ${H}" class="h-auto w-full touch-none select-none overflow-visible" role="img" aria-label="Estimated 1RM trend">
      ${ticks.map((t) => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" class="stroke-slate-200 dark:stroke-slate-800" stroke-width="1"/>
        <text x="${pl - 6}" y="${y(t) + 3.5}" text-anchor="end" font-size="10" class="fill-slate-500 dark:fill-slate-400">${fmt(t)}</text>`).join('')}
      <text x="${pl}" y="${H - 6}" font-size="10" class="fill-slate-500 dark:fill-slate-400">${fmtShort(points[0].date)}</text>
      <text x="${W - pr}" y="${H - 6}" font-size="10" text-anchor="end" class="fill-slate-500 dark:fill-slate-400">${fmtShort(points[points.length - 1].date)}</text>
      <line data-cross x1="0" x2="0" y1="${pt}" y2="${H - pb}" class="stroke-slate-400 dark:stroke-slate-500" stroke-width="1" visibility="hidden"/>
      <path d="${path}" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${xy.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#6366f1" class="stroke-white dark:stroke-slate-900" stroke-width="2"/>`).join('')}
      <circle data-focus r="6" fill="#6366f1" class="stroke-white dark:stroke-slate-900" stroke-width="2" visibility="hidden"/>
      <text x="${Math.min(lastP.x, W - pr)}" y="${lastP.y - 10}" text-anchor="end" font-size="11" font-weight="700" class="fill-slate-900 dark:fill-slate-100">${fmt(points[points.length - 1].v)}</text>
    </svg>
    <div data-tip class="pointer-events-none absolute z-10 hidden -translate-x-1/2 -translate-y-full whitespace-nowrap rounded-lg bg-slate-900 px-2.5 py-1.5 text-xs text-white shadow-lg dark:bg-slate-100 dark:text-slate-900"></div>
  </div>`;
}

function attachCharts() {
  document.querySelectorAll('[data-chart=line]').forEach((wrap) => {
    const pts = JSON.parse(wrap.dataset.points);
    const W = +wrap.dataset.w, H = +wrap.dataset.h;
    const svg = wrap.querySelector('svg'), tip = wrap.querySelector('[data-tip]');
    const focus = svg.querySelector('[data-focus]'), cross = svg.querySelector('[data-cross]');
    const show = (e) => {
      const rect = svg.getBoundingClientRect();
      const vx = ((e.clientX - rect.left) / rect.width) * W;
      const p = pts.reduce((b, q) => (Math.abs(q.x - vx) < Math.abs(b.x - vx) ? q : b));
      focus.setAttribute('cx', p.x); focus.setAttribute('cy', p.y); focus.setAttribute('visibility', 'visible');
      cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x); cross.setAttribute('visibility', 'visible');
      tip.innerHTML = p.label;
      tip.style.left = `${Math.min(80, Math.max(20, (p.x / W) * 100))}%`;
      tip.style.top = `${(p.y / H) * 100 - 4}%`;
      tip.classList.remove('hidden');
    };
    svg.addEventListener('pointermove', show);
    svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointerleave', (e) => {
      if (e.pointerType !== 'mouse') return; // keep the tooltip on touch
      tip.classList.add('hidden'); focus.setAttribute('visibility', 'hidden'); cross.setAttribute('visibility', 'hidden');
    });
  });
  document.querySelectorAll('[data-chart=bars] [data-action=bar]').forEach((b) =>
    b.addEventListener('pointerenter', () => b.click()));
}

        <div class="flex gap-1">${[3, 4].map((s) => `<button class="rounded-lg px-3 py-1.5 font-semibold ${lib.step === s ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}" data-action="lib-step" data-step="${s}">${s} kg</button>`).join('')}</div>
      </div>
      <button class="btn-primary w-full" data-action="lib-add" id="lib-add" ${lib.picked.size ? '' : 'disabled'}>${libAddLabel()}</button>
    </div>`;
}

const libAddLabel = () => (lib.picked.size ? `Add ${lib.picked.size} exercise${lib.picked.size === 1 ? '' : 's'}` : 'Tick exercises to add');

function libraryList() {
  const owned = ownedNames();
  const q = lib.query.trim().toLowerCase();
  const items = LIBRARY.map((item, idx) => ({ item, idx })).filter(({ item }) =>
    (!q || item.name.toLowerCase().includes(q)) &&
    (!lib.eq || item.type === lib.eq) &&
    (!lib.muscle || item.muscles[lib.muscle]));
  if (!items.length) return '<p class="py-6 text-center text-sm muted">No exercises match.</p>';
  return `<ul class="divide-y divide-slate-200 dark:divide-slate-800">${items.map(({ item, idx }) => {
    const have = owned.has(item.name.toLowerCase());
    const picked = lib.picked.has(idx);
    return `<li class="py-2">
      <label class="flex items-center gap-3 ${have ? 'opacity-50' : 'cursor-pointer'}">
        <input type="checkbox" class="h-5 w-5 shrink-0 accent-indigo-600" data-lib-pick="${idx}" ${picked ? 'checked' : ''} ${have ? 'disabled' : ''}>
        <span class="min-w-0 flex-1">
          <span class="block truncate font-medium">${esc(item.name)}</span>
          <span class="block truncate text-xs muted">${isAssisted(item) ? 'Assisted machine' : EQUIPMENT_LABEL[item.type]} · ${item.repMin}–${item.repMax} reps · ${muscleLabel(item)}</span>
        </span>
        ${have ? '<span class="badge shrink-0 bg-slate-500/10 text-slate-600 dark:text-slate-300">Added</span>' : ''}
      </label>
      ${picked ? `<div class="mt-2 flex items-center gap-2 pl-8 text-sm">
        <span class="muted">Starting weight</span>
        <input class="input w-24 py-1.5 text-center" type="number" inputmode="decimal" step="any" min="0" data-lib-weight="${idx}" value="${esc(lib.picked.get(idx))}" placeholder="${item.startWeight}">
        <span class="muted">kg</span>
      </div>` : ''}
    </li>`;
  }).join('')}</ul>`;
}

const EQUIPMENT_LABEL = { dumbbell: 'Dumbbell', machine: 'Machine', barbell: 'Barbell', bodyweight: 'Bodyweight' };

function refreshLibrary() {
  document.getElementById('lib-list').innerHTML = libraryList();
  const add = document.getElementById('lib-add');
  add.disabled = !lib.picked.size;
  add.textContent = libAddLabel();
}

function addFromLibrary() {
  const owned = ownedNames();
  let added = 0;
  lib.picked.forEach((weight, idx) => {
    const item = LIBRARY[idx];
    if (owned.has(item.name.toLowerCase())) return;
    const w = parseFloat(weight);
    state.exercises.push({
      id: uid(), ...item, muscles: { ...item.muscles }, machineStep: lib.step,
      startWeight: Number.isFinite(w) && w >= 0 ? w : item.startWeight,
    });
    added++;
  });
  lib = { query: '', eq: '', muscle: '', step: lib.step, picked: new Map() };
  modal = null;
  saveState();
  render();
  toast(`Added ${added} exercise${added === 1 ? '' : 's'}`);
}

function dayModal(date) {
  const r = plannedRoutine(date);
  const weekly = routineById(state.schedule.weekly[dow(date)]);
  const overridden = state.schedule.overrides[date] !== undefined;
  const logged = state.history.filter((h) => h.date === date).map((h) => exById(h.exerciseId)?.name).filter(Boolean);
  const statusText = { done: '✓ Workout logged', missed: 'Missed', planned: 'Planned', rest: 'Rest day' }[dayStatus(date)];

  return `<div class="mb-4 flex items-start justify-between gap-2">
      <div>
        <p class="text-xs font-bold uppercase tracking-wider muted">${statusText}${overridden ? ' · changed' : ''}</p>
        <h3 class="text-xl font-bold">${fmtDay(date)}</h3>
        <p class="text-sm muted">${r ? `Workout: <b class="text-slate-900 dark:text-slate-100">${esc(r.name)}</b>` : 'No workout planned'}</p>
      </div>
      <button class="icon-btn -mr-2" data-action="close-modal" aria-label="Close">${ICON_X}</button>
    </div>
    ${logged.length ? `<p class="mb-4 rounded-xl bg-emerald-500/10 p-3 text-sm">Logged: ${logged.map(esc).join(', ')}</p>` : ''}
    <div class="space-y-4">
      <label class="block">
        <span class="label">Workout on this day</span>
        <select class="input" data-action="day-set" data-date="${date}" ${state.routines.length ? '' : 'disabled'}>
          <option value="">Rest / skip</option>
          ${state.routines.map((x) => `<option value="${x.id}" ${r?.id === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
        </select>
      </label>
      ${r ? `<div>
        <span class="label">Move ${esc(r.name)} to another day</span>
        <div class="flex gap-2">
          <input type="date" id="move-to" class="input" value="${addDays(date, 1)}">
          <button class="btn-primary shrink-0" data-action="day-move" data-date="${date}">Move</button>
        </div>
      </div>` : ''}
      ${overridden ? `<button class="btn-ghost w-full" data-action="day-reset" data-date="${date}">Reset to weekly plan (${weekly ? esc(weekly.name) : 'Rest'})</button>` : ''}
      ${r && date === todayISO() && !(state.draft && state.draft.entries.length) ? `<button class="btn-success w-full" data-action="start-routine" data-id="${r.id}">Start ${esc(r.name)} now</button>` : ''}
    </div>`;
}

function swapModal() {
  const entry = state.draft?.entries[modal.e];
  const cur = entry && exById(entry.exerciseId);
  if (!cur) return `${modalHead('Swap exercise')}<p class="muted">That exercise is no longer in this workout.</p>`;
  const inDraft = new Set(state.draft.entries.map((x) => x.exerciseId));
  const overlap = (ex) => sum(Object.entries(ex.muscles || {}).map(([m, f]) => Math.min(f, cur.muscles?.[m] || 0)));
  const options = state.exercises.filter((ex) => !inDraft.has(ex.id))
    .map((ex) => ({ ex, score: overlap(ex) }))
    .sort((a, b) => b.score - a.score || a.ex.name.localeCompare(b.ex.name));
  return `${modalHead(`Swap ${esc(cur.name)}`)}
    <p class="-mt-1 mb-2 text-sm muted">Machine taken? Pick a replacement for this workout. Your routine stays the same.</p>
    ${options.length ? `<ul class="divide-y divide-slate-200 dark:divide-slate-800">${options.map(({ ex, score }) => {
      const p = targetFor(ex);
      return `<li><button class="flex w-full items-center justify-between gap-3 py-2.5 text-left" data-action="swap-to" data-id="${ex.id}">
        <span class="min-w-0">
          <span class="block truncate font-medium">${esc(ex.name)} ${score > 0 ? '<span class="badge ml-1 bg-indigo-500/15 text-indigo-700 dark:text-indigo-300">Similar</span>' : ''}</span>
          <span class="block truncate text-xs muted">${muscleLabel(ex) || eqLabel(ex)}</span>
        </span>
        <span class="shrink-0 text-right text-sm font-semibold tabular-nums">${loadLabel(ex, p.weight)}</span>
      </button></li>`;
    }).join('')}</ul>` : '<p class="text-sm muted">No other exercises yet. Add some in the Exercises tab.</p>'}`;
}

function clockText(d) {
  const mins = Math.max(0, Math.floor((Date.now() - d.startedAt) / 60000));
  return `⏱ ${mins < 60 ? `${mins} min` : `${Math.floor(mins / 60)} h ${mins % 60} min`}`;
}
function tickClock() {
  const el = document.getElementById('workout-clock');
  if (el && state.draft?.startedAt) el.textContent = clockText(state.draft);
}
setInterval(tickClock, 15000);

function summaryModal() {
  const { saved, prs, ups, stalls, mins, sets, volume } = modal;
  const stat = (label, value) => `<div class="rounded-xl bg-slate-100 p-2 dark:bg-slate-800/60"><p class="text-lg font-bold tabular-nums">${value}</p><p class="text-xs muted">${label}</p></div>`;
  return `<div class="text-center">
      <p class="text-4xl">${prs.length ? '🏆' : '💪'}</p>
      <h3 class="mt-2 text-2xl font-bold">Workout saved</h3>
      <p class="text-sm muted">${saved} exercise${saved === 1 ? '' : 's'} logged</p>
    </div>
    <div class="mt-4 grid grid-cols-3 gap-2 text-center">
      ${stat('Duration', mins === null || mins === undefined ? '—' : mins < 1 ? '<1 min' : `${mins} min`)}${stat('Sets', sets ?? '—')}${stat('Kg lifted', volume ? fmtKg(volume) : '—')}
    </div>
    ${prs.length ? `<div class="mt-4 rounded-xl bg-amber-500/10 p-3">
      <p class="font-semibold text-amber-800 dark:text-amber-300">New personal records</p>
      <ul class="mt-1 space-y-0.5 text-sm">${prs.map((p) => `<li><b>${esc(p.name)}</b> · ${p.items.join(' · ')}</li>`).join('')}</ul>
    </div>` : ''}
    ${ups.length ? `<div class="mt-3 rounded-xl bg-emerald-500/10 p-3">
      <p class="font-semibold text-emerald-800 dark:text-emerald-300">Moving up next time</p>
      <ul class="mt-1 space-y-0.5 text-sm">${ups.map((u) => `<li><b>${esc(u.name)}</b> → ${esc(u.label)}</li>`).join('')}</ul>
    </div>` : ''}
    ${stalls.length ? `<div class="mt-3 rounded-xl bg-slate-100 p-3 dark:bg-slate-800/60">
      <p class="font-semibold">Plateau watch</p>
      <p class="text-sm muted">${stalls.map(esc).join(', ')}: no progress for 3 sessions. A deload will be offered next time.</p>
    </div>` : ''}
    <button class="btn-primary mt-5 w-full" data-action="close-modal">Done</button>`;
}

const productFood = (r) => ({

  portions: r[11] > 0 ? [{ label: '1 serving', g: r[11] }] : [],
});
const cofidFood = (r) => ({
  id: `cofid:${r[0]}`, src: 'cofid', name: r[1], brand: '',
  n: { kcal: r[2], protein: r[3], carbs: r[4], sugar: r[5], fat: r[6], satfat: r[7], fibre: r[8], salt: r[9] },
  portions: [],
});

function offlineFood(id) {
  const [, src, code] = id.match(/^([a-z]+):(.*)$/) || [];
  if (src === 'off' && foodData.byCode?.has(code)) return productFood(foodData.products.rows[foodData.byCode.get(code)]);
  const row = src === 'cofid' && foodData.cofid?.rows.find((r) => r[0] === code);
  return row ? cofidFood(row) : null;
}

/** Search a prebuilt lowercase index; earlier rows (more popular) win ties. */
function searchIndex(index, rows, q, limit, toFood) {
  const words = q.split(/\s+/).filter(Boolean);
  const hits = [];
  for (let i = 0; i < index.length && hits.length < 300; i++) {
    if (words.every((w) => index[i].includes(w))) hits.push(i);
  }
  const starts = (i) => (index[i].startsWith(words[0]) ? 0 : 1);
  return hits.sort((a, b) => starts(a) - starts(b) || a - b).slice(0, limit).map((i) => toFood(rows[i]));
}

/** Nutrients for a given weight of a food (per-100 g values scaled). */
function scaleN(n, grams) {
  const out = {};
  NKEYS.forEach((k) => (out[k] = round1(((n[k] || 0) * grams) / 100)));
  out.kcal = Math.round(((n.kcal || 0) * grams) / 100);
  return out;
}

function dayTotals(date, meal) {
  const t = Object.fromEntries(NKEYS.map((k) => [k, 0]));
  dayEntries(date).filter((e) => !meal || e.meal === meal).forEach((e) => NKEYS.forEach((k) => (t[k] += e.n[k] || 0)));
  NKEYS.forEach((k) => (t[k] = round1(t[k])));
  return t;
}

/**
 * Daily targets: Mifflin-St Jeor BMR × activity, adjusted for the goal.
 * Protein first (g per kg), fat at least 25% of calories, carbs fill the rest.
 */
function calcTargets(p) {
  const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'female' ? -161 : 5);
  const delta = (GOALS.find((g) => g[0] === p.goal) || GOALS[2])[1];
  const kcal = Math.max(p.sex === 'female' ? 1200 : 1500, Math.round((bmr * p.activity + delta) / 10) * 10);
  const protein = Math.round(((p.goal.startsWith('lose') ? 2 : 1.8) * p.weight) / 5) * 5;
  const fat = Math.max(Math.round((kcal * 0.25) / 9), Math.round(0.6 * p.weight));
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return { kcal, protein, carbs, fat, ...fixedTargets(kcal) };
}
const fixedTargets = (kcal) => ({ fibre: 30, sugar: 90, satfat: Math.round((kcal * 0.11) / 9), salt: 6 });

function recentFoodIds() {
  const ids = [];
  Object.keys(state.food.log).sort().reverse().forEach((d) =>
    [...state.food.log[d]].reverse().forEach((e) => { if (e.foodId && !ids.includes(e.foodId) && foodById(e.foodId)) ids.push(e.foodId); }));
  return ids.slice(0, 15);
}

const amountLabel = (e) => (!e.foodId ? '' : e.unit === 'g' ? `${fmt(e.qty)} g` : `${fmt(e.qty)} × ${e.unit.replace(/^1 /, '')} (${fmt(e.g)} g)`);

// ----- Weight trend, weekly check-in, training days -----
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const KCAL_PER_KG = 7700;

/** Weigh-ins smoothed into a trend (exponential moving average, 10% per day). */
function weightSeries() {
  let trend = null, prev = null;
  return Object.keys(state.food.weights).sort().map((date) => {
    const kg = state.food.weights[date];
    trend = trend === null ? kg : trend + (1 - 0.9 ** Math.max(1, daysBetween(prev, date))) * (kg - trend);
    prev = date;
    return { date, kg, trend: round2(trend) };
  });
}

/** Trend change in kg per week over (up to) the last 14 days of the series. */
function weeklyRate(series) {
  if (series.length < 2) return null;
  const last = series[series.length - 1];
  const first = series.find((p) => daysBetween(p.date, last.date) <= 14);
  const days = daysBetween(first.date, last.date);
  return days >= 6 ? ((last.trend - first.trend) / days) * 7 : null;
}

/**
 * Weekly check-in: estimate real maintenance calories from the last 3 weeks
 * of logged food and the weight trend, then suggest a target for the goal.
 * Days with under 800 kcal logged are treated as incomplete and skipped.
 */
function checkinEstimate() {
  const t = state.food.targets, p = state.food.profile;
  if (!t || !p) return null;
  const end = addDays(todayISO(), -1), start = addDays(end, -20);
  const intakes = [];
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const kcal = dayTotals(d).kcal;
    if (kcal >= 800) intakes.push(kcal);
  }
  const pts = weightSeries().filter((w) => w.date >= start);
  if (intakes.length < 10 || pts.length < 4) return null;
  const span = daysBetween(pts[0].date, pts[pts.length - 1].date);
  if (span < 10) return null;
  const kgPerDay = (pts[pts.length - 1].trend - pts[0].trend) / span;
  const avg = Math.round(sum(intakes) / intakes.length);
  const tdee = Math.round(avg - kgPerDay * KCAL_PER_KG);
  const delta = (GOALS.find((g) => g[0] === p.goal) || GOALS[2])[1];
  const ideal = Math.round((tdee + delta) / 10) * 10;
  const target = Math.max(p.sex === 'female' ? 1200 : 1500, Math.min(t.kcal + 200, Math.max(t.kcal - 200, ideal)));
  return { avg, days: intakes.length, span, kgPerWeek: kgPerDay * 7, tdee, target, current: t.kcal };
}

function checkinDue() {
  // A maintenance week (and the water weight it brings back) would skew the estimate.
  if (dietBreakOn(todayISO()) || dietBreakOn(addDays(todayISO(), -7))) return null;
  const last = state.food.checkins[state.food.checkins.length - 1];
  return last && daysBetween(last.date, todayISO()) < 7 ? null : checkinEstimate();
}

function applyCheckin(accept) {
  const est = checkinEstimate(), t = state.food.targets;
  if (!est) return;
  state.food.checkins.push({ date: todayISO(), tdee: est.tdee, from: t.kcal, to: accept ? est.target : t.kcal });
  if (accept && est.target !== t.kcal) {
    // Keep protein and fat; the change goes into carbs.
    Object.assign(t, { carbs: Math.max(0, t.carbs + Math.round((est.target - t.kcal) / 4)), kcal: est.target }, fixedTargets(est.target));
  }
  const series = weightSeries();
  if (series.length) state.food.profile.weight = round1(series[series.length - 1].trend);
}

const trainingDaysPerWeek = () => DAYS.filter((_, i) => routineById(state.schedule.weekly[i])).length;

/**
 * Training days sit `gap` kcal above rest days, split around the normal
 * target so the weekly total is unchanged (e.g. 2,300 with 3 training days
 * and a 200 gap → ~2,414 training, ~2,214 rest).
 */
function trainingShift(gap, n) {
  return { training: Math.round((gap * (7 - n)) / 7), rest: -Math.round((gap * n) / 7) };
}

const dietBreakOn = (date) => !!state.food.prefs.dietBreak && isDeloadWeek(date);

/** Maintenance calories: the latest check-in estimate (last 5 weeks), else the formula. */
function maintenanceKcal() {
  const t = state.food.targets, p = state.food.profile;
  const c = [...state.food.checkins].reverse().find((x) => x.tdee && daysBetween(x.date, todayISO()) <= 35);
  const m = c ? c.tdee : p ? calcTargets({ ...p, goal: 'maintain' }).kcal : null;
  if (!m || !t) return null;
  return Math.round(Math.min(m, t.kcal + 700) / 10) * 10; // sanity cap
}

/** Daily targets with a diet break applied: deload weeks go up to maintenance, as carbs. */
function baseTargets(date) {
  const t = state.food.targets, m = dietBreakOn(date) && maintenanceKcal();
  if (!m || m <= t.kcal) return { ...t, dietBreak: false };
  return { ...t, kcal: m, carbs: t.carbs + Math.round((m - t.kcal) / 4), ...fixedTargets(m), dietBreak: true, breakExtra: m - t.kcal };
}

/** Targets for a date: calories (as carbs) shift from rest days to training days; the weekly total is unchanged. */
function targetsFor(date) {
  if (!state.food.targets) return null;
  const t = baseTargets(date);
  const n = trainingDaysPerWeek(), pr = state.food.prefs;
  if (!pr.trainingOn || n === 0 || n === 7) return { ...t, dayType: null, dayDelta: 0 };
  const training = !!plannedRoutine(date) || state.history.some((h) => h.date === date);
  const d = trainingShift(pr.trainingGap, n)[training ? 'training' : 'rest'];
  return { ...t, kcal: t.kcal + d, carbs: Math.max(0, t.carbs + Math.round(d / 4)), dayType: training ? 'training' : 'rest', dayDelta: d };
}
