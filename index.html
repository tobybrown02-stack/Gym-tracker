<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <header class="sticky top-0 z-20 border-b border-slate-200 bg-slate-50/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
    <div class="mx-auto flex max-w-xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2">
        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-600 text-white ring-4 ring-indigo-600/20">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>
        </div>
        <div>
          <h1 class="text-2xl leading-none">Overload<span class="text-indigo-500">.</span></h1>
          <p class="mt-0.5 text-[11px] font-semibold uppercase tracking-[0.14em] muted leading-tight" id="hdr-sub">Train with a plan</p>
        </div>
      </div>
      <button class="icon-btn" data-action="toggle-theme" aria-label="Toggle light/dark mode">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="mx-auto max-w-xl px-4 pb-48 pt-4"></main>

  <nav class="fixed inset-x-0 bottom-0 z-20 border-t border-slate-200 bg-white/95 backdrop-blur dark:border-slate-800 dark:bg-slate-900/95" style="padding-bottom: env(safe-area-inset-bottom)">
    <!-- Rest timer (shown while resting) -->
    <div id="rest-timer" class="mx-auto hidden max-w-xl px-4 pt-3">
      <div class="flex items-center gap-2 rounded-2xl bg-indigo-600 px-3 py-2 text-white">
        <div class="min-w-0 flex-1">
          <div class="flex items-baseline justify-between gap-2">
            <span class="truncate text-xs font-semibold uppercase tracking-wide opacity-80" id="rest-label">Rest</span>
            <span class="text-2xl font-extrabold tabular-nums" id="rest-time">0:00</span>
          </div>
          <div class="mt-1 h-1.5 overflow-hidden rounded-full bg-white/25"><div id="rest-bar" class="h-full rounded-full bg-white transition-[width] duration-200"></div></div>
        </div>
        <button class="rounded-lg bg-white/15 px-2.5 py-2 text-sm font-bold" data-action="rest-adjust" data-sec="-15">−15</button>
        <button class="rounded-lg bg-white/15 px-2.5 py-2 text-sm font-bold" data-action="rest-adjust" data-sec="15">+15</button>
        <button class="rounded-lg bg-white/15 px-2.5 py-2 text-sm font-bold" data-action="rest-skip">Skip</button>
      </div>
    </div>
    <div class="mx-auto flex max-w-xl">
      <button class="nav-btn" data-action="nav" data-view="today">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Workout
      </button>
      <button class="nav-btn" data-action="nav" data-view="food">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a2 2 0 0 0 2 2v9M4 3v5M8 3v5M18 21V3c-2 1.5-3 4-3 7 0 1.5 1 2.5 3 2.5"/></svg>Food
      </button>
      <button class="nav-btn" data-action="nav" data-view="plan">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan
      </button>
      <button class="nav-btn" data-action="nav" data-view="stats">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Stats
      </button>
      <button class="nav-btn" data-action="nav" data-view="exercises">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Exercises
      </button>
      <button class="nav-btn" data-action="nav" data-view="history">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History
      </button>
    </div>
  </nav>

  <div id="modal" class="fixed inset-0 z-40 hidden items-end justify-center bg-black/50 sm:items-center sm:p-4">
    <div id="modal-body" class="max-h-[88vh] w-full max-w-xl overflow-y-auto rounded-t-3xl bg-white p-5 shadow-xl dark:bg-slate-900 sm:rounded-3xl" style="padding-bottom: calc(1.25rem + env(safe-area-inset-bottom))"></div>
  </div>

  <button id="update-banner" class="fixed inset-x-0 top-16 z-50 mx-auto hidden w-[calc(100%-2rem)] max-w-md rounded-xl bg-indigo-600 px-4 py-3 text-left text-sm font-semibold text-white shadow-lg" data-action="apply-update">
    A new version of the app is ready. <span class="underline">Tap to update</span>
  </button>

  <div id="toast" class="pointer-events-none fixed inset-x-0 top-16 z-50 flex justify-center px-4 opacity-0 transition-opacity duration-300">
    <div id="toast-msg" class="rounded-xl bg-slate-900 px-4 py-3 text-sm font-medium text-white shadow-lg dark:bg-slate-100 dark:text-slate-900"></div>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" class="hidden">

Hanging Knee Raise|r|10-15|0|Core||
Decline Sit-up|w|10-15|0|Core||
Ab Wheel Rollout|r|6-12|0|Core||
Reverse Crunch|r|10-20|0|Core||
Pallof Press|m|10-15|10|Core||
Dumbbell Side Bend|d|12-15|16|Core||
Rotary Torso Machine|m|10-15|20|Core||
`.trim().split('\n').map((line) => {
  const [name, t, range, start, primary, secondary, restSecs] = line.split('|');
  const [repMin, repMax] = range.split('-').map(Number);
  const muscles = {};
  secondary.split(',').filter(Boolean).forEach((m) => (muscles[m] = 0.5));
  primary.split(',').filter(Boolean).forEach((m) => (muscles[m] = 1));
  const type = { d: 'dumbbell', m: 'machine', b: 'barbell' }[t] || 'bodyweight';
  const bwMode = { w: 'weighted', r: 'reps', a: 'assisted' }[t] || 'weighted';
  const rest = Number(restSecs) || (repMax <= 8 ? 150 : repMin >= 12 ? 60 : 90);
  return { name, type, bwMode, repMin, repMax, sets: 3, startWeight: Number(start), muscles, rest };
});

// ---------- Small helpers -------------------------------------------------
const round2 = (x) => Math.round(x * 100) / 100;
const sum = (arr) => arr.reduce((a, b) => a + b, 0);
const fmt = (w) => String(round2(w));
const fmtKg = (n) => Math.round(n).toLocaleString();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

// Dates are local ISO strings (YYYY-MM-DD); weeks start on Monday.
const toISO = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const todayISO = () => toISO(new Date());
const parseISO = (iso) => new Date(iso + 'T12:00:00');
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const dow = (iso) => (parseISO(iso).getDay() + 6) % 7;
const weekStart = (iso) => addDays(iso, -dow(iso));
const fmtDate = (iso) => parseISO(iso).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const fmtShort = (iso) => parseISO(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const fmtDay = (iso) => parseISO(iso).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });
const fmtSecs = (s) => `${Math.floor(s / 60)}:${String(Math.max(0, s % 60)).padStart(2, '0')}`;

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.style.opacity = '0'), 2600);
}

// ---------- Equipment & rounding ----------------------------------------

// Bodyweight exercises come in three kinds: extra weight added (belt/vest),
// reps only, or an assisted machine where *less* assistance is progress.
const isBW = (ex) => ex.type === 'bodyweight';
const isAssisted = (ex) => isBW(ex) && ex.bwMode === 'assisted';
const repsOnly = (ex) => isBW(ex) && ex.bwMode === 'reps';
/** Is load a harder than load b? */
const harder = (ex, a, b) => (isAssisted(ex) ? a < b : a > b);

/** Smallest realistic load jump for this exercise's equipment. */
function stepFor(ex) {
  if (ex.type === 'dumbbell') return 2;
  if (ex.type === 'machine' || isAssisted(ex)) return ex.machineStep === 3 ? 3 : 4;
  if (repsOnly(ex)) return 0;
  return 2.5; // barbell / plates, or weight added to a bodyweight exercise
}

/** Round a weight to the nearest equipment step (never negative). */
function roundToStep(weight, ex) {
  const step = stepFor(ex);
  return step ? round2(Math.max(0, Math.round(weight / step) * step)) : round2(Math.max(0, weight));
}

function eqLabel(ex) {
  if (ex.type === 'machine') return `Machine · ${stepFor(ex)}kg steps`;
  if (ex.type === 'dumbbell') return 'Dumbbell · 2kg steps';
  if (isAssisted(ex)) return `Assisted machine · ${stepFor(ex)}kg steps`;
  if (repsOnly(ex)) return 'Bodyweight · reps';
  if (isBW(ex)) return 'Bodyweight · add 2.5kg steps';
  return 'Barbell · 2.5kg steps';
}

/** How to show a load: "60 kg", "Bodyweight", "BW + 5 kg" or "25 kg assist". */
function loadLabel(ex, w) {
  if (repsOnly(ex)) return 'Bodyweight';
  if (isAssisted(ex)) return w > 0 ? `${fmt(w)} kg assist` : 'No assistance';
  if (isBW(ex)) return w > 0 ? `BW + ${fmt(w)} kg` : 'Bodyweight';
  return `${fmt(w)} kg`;
}

function muscleLabel(ex) {
  const entries = Object.entries(ex.muscles || {});
  if (!entries.length) return '';
  return entries.sort((a, b) => b[1] - a[1]).map(([m, f]) => (f < 1 ? `${m} (½)` : m)).join(' · ');
}

// ---------- Progressive overload engine ----------------------------------

/** Normalise logged sets: numeric weight/reps, drop empty rows. */
function cleanSets(sets, fallbackWeight = NaN) {
  return sets
    .map((s) => {
      const w = s.weight === '' || s.weight == null ? fallbackWeight : parseFloat(s.weight);
      const out = { weight: round2(w), reps: parseInt(s.reps, 10) };
      const rpe = parseFloat(s.rpe);
      if (rpe >= 5 && rpe <= 10) out.rpe = rpe;
      if (s.warm) out.warm = true;
      return out;
    })
    .filter((s) => Number.isFinite(s.weight) && s.weight >= 0 && s.reps > 0);
}

/**
 * Evaluate one session. Sets marked as warm-ups are ignored; working sets =
 * the remaining sets done at the heaviest weight (lighter ones count as
 * warm-ups too).
 */
function evaluate(ex, allSets) {
  const sets = allSets.some((s) => !s.warm) ? allSets.filter((s) => !s.warm) : allSets;
  const loads = sets.map((s) => s.weight);
  const top = isAssisted(ex) ? Math.min(...loads) : Math.max(...loads); // hardest load
  const working = sets.filter((s) => s.weight === top);
  const reps = working.map((s) => s.reps);
  const total = sum(reps);
  const enoughSets = working.length >= ex.sets;
  const hitCeiling = enoughSets && reps.every((r) => r >= ex.repMax);
  return { top, working, reps, total, enoughSets, hitCeiling };
}

/** Sessions for an exercise, newest first. */
function sessionsFor(exId) {
  return state.history
    .filter((h) => h.exerciseId === exId && h.sets.length)
    .sort((a, b) => (b.date === a.date ? b.ts - a.ts : b.date < a.date ? -1 : 1));
}

/**
 * Next Session Predictor — Double Progression.
 * Rule 1: every working set hit the top of the rep range → add the smallest
 *         equipment increment, reset reps to the bottom of the range.
 * Rule 2: otherwise keep the weight and beat last session's rep total by ≥ 1.
 */
function predict(ex, date = state.draft?.date || todayISO()) {
  const last = sessionsFor(ex.id).find((h) => !h.pdl && !h.test); // programme deload weeks and rep-max tests don't count
  const step = stepFor(ex);

  if (!last) {
    const reps = Array(ex.sets).fill(ex.repMin);
    return {
      rule: 'start', weight: roundToStep(ex.startWeight || 0, ex), reps, total: sum(reps), last: null,
      reason: `First session. Start at ${ex.repMin} reps per set and build towards ${ex.repMax}.`,
    };
  }

  const ev = evaluate(ex, last.sets);
  const { rpe, set: rpeSet } = lastRpe(last, ev);
  if (state.settings.progression === 'rpe') {
    const r = rpePredict(ex, last, ev, date);
    if (r) return r;
  }

  // Way off (e.g. still finding a starting weight): re-pick the weight from
  // the reps you had left, aiming for the bottom of the range with ~2 left.
  if (rpe && !isBW(ex) && ev.top > 0) {
    const capable = rpeSet.reps + (10 - rpe);
    const ideal = floorToStep(ev.top * (1 + capable / 30) / (1 + (ex.repMin + 2) / 30), ex);
    const tooLight = capable >= ex.repMax + 3 && ideal > ev.top + step; // more than one normal step up
    const tooHeavy = capable < ex.repMin && ideal < ev.top;
    if (tooLight || tooHeavy) {
      const reps = Array(ex.sets).fill(ex.repMin);
      return {
        rule: 'calibrate', weight: ideal, reps, total: sum(reps), last, ev,
        reason: tooLight
          ? `Last time ${rpeSet.reps} reps at ${loadLabel(ex, ev.top)} was RPE ${fmt(rpe)}, so you had about ${10 - rpe} more in you. Jumping to ${loadLabel(ex, ideal)} for ${ex.repMin}–${ex.repMax} reps.`
          : `Last time you got ${rpeSet.reps} reps at RPE ${fmt(rpe)}, below the ${ex.repMin}–${ex.repMax} range. Dropping to ${loadLabel(ex, ideal)} so you land in the range.`,
      };
    }
  }

  const canStepUp = !repsOnly(ex) && !(isAssisted(ex) && ev.top <= 0);
  if (ev.hitCeiling && canStepUp) {
    const reps = Array(ex.sets).fill(ex.repMin);
    const weight = isAssisted(ex) ? round2(Math.max(0, roundToStep(ev.top, ex) - step)) : round2(roundToStep(ev.top, ex) + step);
    return {
      rule: 'up', weight, reps, total: sum(reps), last, ev,
      reason: `You hit ${ex.repMax} reps on all ${ev.working.length} working sets at ${loadLabel(ex, ev.top)}. ${isAssisted(ex) ? `Assistance −${fmt(step)} kg` : `Weight +${fmt(step)} kg`}, reps reset to ${ex.repMin}.${rpe >= 9.5 ? ` It was a grind (RPE ${fmt(rpe)}), so expect the new load to feel heavy at first.` : ''}`,
    };
  }

  // Rule 2: same weight, beat the previous rep total by at least one rep.
  const reps = ev.reps.slice();
  while (reps.length < ex.sets) reps.push(ex.repMin); // finish the missing working sets
  if (sum(reps) <= ev.total) {
    // Add one rep to the weakest set that still has room under the ceiling.
    let idx = -1;
    reps.forEach((r, i) => { if (r < ex.repMax && (idx === -1 || r < reps[idx])) idx = i; });
    if (idx === -1) idx = reps.length - 1;
    reps[idx] += 1;
  }
  const easy = rpe && rpe <= 7.5;
  if (easy) { // felt easy: aim for two more reps instead of one
    let idx = -1;
    reps.forEach((r, i) => { if (r < ex.repMax && (idx === -1 || r < reps[idx])) idx = i; });
    if (idx !== -1) reps[idx] += 1;
  }
  const total = Math.max(sum(reps), ev.total + (easy ? 2 : 1));

  let reason = `Not every set reached ${ex.repMax}. Keep ${loadLabel(ex, ev.top)} and beat last session's ${ev.total} total reps (aim for ${total}+).`;
  if (ev.hitCeiling && repsOnly(ex)) reason = `You hit the top of the range on every set. Keep adding reps (aim for ${total}+), or move to a harder variation.`;
  else if (ev.hitCeiling) reason = `You’re doing it with no assistance. Keep adding reps (aim for ${total}+), or switch this exercise to “Add weight”.`;
  else if (!ev.enoughSets && !repsOnly(ex)) reason += ` Complete all ${ex.sets} working sets to unlock ${isAssisted(ex) ? 'less assistance' : 'a weight increase'}.`;
  if (easy && !ev.hitCeiling) reason += ` It felt easy last time (RPE ${fmt(rpe)}), so aim for 2 more reps.`;
  else if (rpe >= 9.5 && !ev.hitCeiling) reason += ` Last time was close to your limit (RPE ${fmt(rpe)}): one more rep is plenty.`;
  const belowRange = ev.reps.every((r) => r < ex.repMin);

  return { rule: 'reps', weight: ev.top, reps, total, last, ev, reason, belowRange };
}

/**
 * Plateau: the last 3 sessions each failed to progress on the one before
 * (no heavier weight, and no extra reps at the same weight). A logged deload
 * (or a programme deload week) resets the count.
 */
function plateau(ex) {
  const ss = sessionsFor(ex.id);
  if (ss.length < 4) return null;
  for (let i = 0; i < 3; i++) {
    if (ss[i].deload || ss[i].pdl || ss[i].test) return null;
    const a = evaluate(ex, ss[i].sets), b = evaluate(ex, ss[i + 1].sets);
    if (harder(ex, a.top, b.top) || (a.top === b.top && a.total > b.total)) return null;
    const ea = ratedE1(ex, ss[i]), eb = ratedE1(ex, ss[i + 1]);
    if (state.settings.progression === 'rpe' && ea && eb && ea > eb * 1.005) return null; // stronger by the RPE estimate
  }
  const at = evaluate(ex, ss[0].sets).top;
  if (repsOnly(ex) || (isBW(ex) && !isAssisted(ex) && at <= 0)) return null; // nothing to take off
  if (isAssisted(ex)) return { at, weight: roundToStep(Math.max(at * 1.1, at + stepFor(ex)), ex) }; // a bit more help
  let weight = roundToStep(at * 0.9, ex);
  if (weight >= at) weight = round2(Math.max(0, at - stepFor(ex)));
  return { at, weight };
}

/** RPE of the last working set that has one (or the old per-exercise RPE). */
function lastRpe(h, ev) {
  const set = [...ev.working].reverse().find((x) => x.rpe);
  if (set) return { rpe: set.rpe, set };
  const old = parseFloat(h.rpe);
  return old >= 5 ? { rpe: old, set: ev.working[ev.working.length - 1] } : { rpe: null, set: null };
}

const floorToStep = (w, ex) => { const st = stepFor(ex); return round2(Math.max(0, st ? Math.floor(w / st) * st : w)); };


// ---------- RPE formula progression (Settings → Progression) -------------
const RPE_GROWTH = 0.01; // aim for ~1% stronger each week
/** Target RPE for the last set: rises through each programme block (8 → 8.5 → 9). */
function targetRpe(date) {
  const w = progWeek(date);
  return w ? [8, 8.5, 9, 8][(w - 1) % 4] : 8;
}

/**
 * Estimated max from the LAST rated working set of a session (null if none
 * rated). The target RPE is for the last set, so earlier (fresher) ratings
 * are just a record and don't change targets.
 */
function ratedE1(ex, h) {
  const set = [...evaluate(ex, h.sets).working].reverse().find((x) => x.rpe);
  return set ? e1rmRpe(set) : null;
}

/**
 * Estimated max = weight × (1 + (reps + reps left) ÷ 30), from the last
 * session's rated sets. Goal = that +1%. Reps at weight w for the week's
 * target RPE = 30 × (goal ÷ w − 1) − reps left; pick the heaviest weight
 * (within 3 steps) that still reaches the bottom of the rep range.
 * Weighted exercises only; bodyweight/assisted keep double progression.
 */
function rpePredict(ex, last, ev, date) {
  if (isBW(ex) || !(ev.top > 0)) return null;
  let e1 = ratedE1(ex, last);
  if (!e1) return null;
  // Once an exercise has a few rated sessions, one odd rating can only move the estimate a little.
  const rated = sessionsFor(ex.id).filter((h) => !h.pdl && !h.test && h !== last && ratedE1(ex, h));
  let capped = '';
  if (rated.length >= 2) {
    const prev = ratedE1(ex, rated[0]);
    const lo = prev * 0.95, hi = prev * 1.025;
    if (e1 > hi || e1 < lo) { e1 = Math.min(hi, Math.max(lo, e1)); capped = ' (capped so one session can’t swing it too far)'; }
  }
  const goal = e1 * (1 + RPE_GROWTH), rpeT = targetRpe(date), rir = 10 - rpeT, step = stepFor(ex);
  const repsAt = (w) => Math.round(30 * (goal / w - 1) - rir);
  const options = [];
  for (let k = -3; k <= 3; k++) { const w = round2(ev.top + k * step); if (w > 0) options.push(w); }
  let weight = options.filter((w) => repsAt(w) >= ex.repMin).pop();
  if (weight === undefined) weight = options[0]; // even the lightest option is too heavy for the range
  const n = Math.max(ex.repMin, Math.min(ex.repMax, repsAt(weight)));
  const reps = Array(ex.sets).fill(n);
  const src = [...ev.working].reverse().find((x) => x.rpe);
  return {
    rule: 'rpe', weight, reps, total: sum(reps), last, ev, rpeTarget: rpeT,
    reason: `Estimated max ${fmt(round1(e1))} kg from ${fmt(src.weight)} kg × ${src.reps} at RPE ${fmt(src.rpe)}${capped}. Aiming 1% stronger: ${n} reps a set at ${loadLabel(ex, weight)}, with your last set around RPE ${fmt(rpeT)}.`,
  };
}

// ---------- Records ------------------------------------------------------

/** Estimated one-rep max (Epley). */
const e1rm = (s) => (s.reps === 1 ? s.weight : s.weight * (1 + s.reps / 30));
const bestE1 = (sets) => Math.max(0, ...sets.map(e1rm));
/** Estimated 1RM counting the reps left in the tank when an RPE was logged. */
const e1rmRpe = (s) => s.weight * (1 + (s.reps + (s.rpe ? 10 - s.rpe : 0)) / 30);
const topWeight = (sets) => Math.max(0, ...sets.map((s) => s.weight));
const tonnage = (sets) => sum(sets.map((s) => s.weight * s.reps));

/** Which records a logged session set, compared with everything before it. */
function prsFor(h) {
  const earlier = state.history.filter((x) => x.exerciseId === h.exerciseId && x.id !== h.id &&
    (x.date < h.date || (x.date === h.date && x.ts < h.ts)));
  if (!earlier.length) return [];
  const ex = exById(h.exerciseId);
  if (ex && isBW(ex)) {
    // Bodyweight: most reps at this load or harder, and the hardest load so far.
    const top = evaluate(ex, h.sets).top;
    const best = Math.max(...h.sets.filter((s) => s.weight === top).map((s) => s.reps));
    const prevSets = earlier.flatMap((x) => x.sets);
    const comparable = prevSets.filter((s) => !harder(ex, top, s.weight)); // earlier sets at this load or harder
    const out = [];
    if (!repsOnly(ex) && !comparable.length) out.push(isAssisted(ex) ? `Least assistance: ${fmt(top)} kg` : `Most added: ${fmt(top)} kg`);
    else if (best > Math.max(...comparable.map((s) => s.reps))) out.push(`Most reps: ${best}`);
    return out;
  }
  const prevE1 = Math.max(...earlier.map((x) => bestE1(x.sets)));
  const prevW = Math.max(...earlier.map((x) => topWeight(x.sets)));
  const out = [];
  if (topWeight(h.sets) > prevW) out.push(`Heaviest: ${fmt(topWeight(h.sets))} kg`);
  if (bestE1(h.sets) > prevE1 + 0.01) out.push(`Est. 1RM: ${fmt(Math.round(bestE1(h.sets) * 10) / 10)} kg`);
  return out;
}

// ---------- Warm-ups & plates ------------------------------------------

/** Plates to load on EACH side of the bar for a total barbell weight. */
function platesFor(total) {
  const bar = state.settings.barWeight;
  let side = round2((total - bar) / 2);
  if (side < 0) return { text: `Lighter than the ${fmt(bar)} kg bar`, ok: false };
  if (side === 0) return { text: 'Empty bar', ok: true };
  const used = [];
  for (const p of PLATES) {
    while (side >= p - 0.001) { used.push(p); side = round2(side - p); }
  }
  return { text: used.map(fmt).join(' + ') + (side > 0.01 ? ` (+${fmt(side)} kg not loadable)` : ''), ok: side <= 0.01 };
}

/** Ramp-up sets before the working weight. */
function warmupsFor(ex, work) {
  const out = [];
  if (!(work > 0) || isBW(ex)) return out;
  const bar = state.settings.barWeight;
  if (ex.type === 'barbell' && work > bar) out.push({ weight: bar, reps: 10 });
  for (const [pct, reps] of [[0.5, 8], [0.7, 5], [0.85, 3]]) {
    const w = roundToStep(work * pct, ex);
    const prev = out[out.length - 1];
    if (w > 0 && w < work && (!prev || w > prev.weight) && !(ex.type === 'barbell' && w <= bar)) out.push({ weight: w, reps });
  }
  return out;
}

// ---------- State & persistence -----------------------------------------
function seedState() {
  const ex = (name, type, repMin, repMax, sets, startWeight, muscles, rest, machineStep = 4) =>
    ({ id: uid(), name, type, machineStep, repMin, repMax, sets, startWeight, muscles, rest });
  const exercises = [
    ex('Barbell Back Squat', 'barbell', 5, 8, 3, 60, { Quads: 1, Glutes: 1, Hamstrings: 0.5 }, 150),
    ex('Dumbbell Bench Press', 'dumbbell', 8, 12, 3, 20, { Chest: 1, Triceps: 0.5, Shoulders: 0.5 }, 120),
    ex('Lat Pulldown', 'machine', 8, 12, 3, 45, { Back: 1, Biceps: 0.5 }, 90, 3),
    ex('Leg Press', 'machine', 10, 15, 3, 100, { Quads: 1, Glutes: 0.5 }, 120, 4),
  ];
  return {
    exercises,
    history: [],
    routines: [{ id: uid(), name: 'Full Body', exerciseIds: exercises.map((e) => e.id) }],
    schedule: { weekly: {}, overrides: {} },
    settings: { barWeight: 20, progression: 'rpe' },
    food: emptyFood(),
    body: { measures: {}, journey: null },
    programme: null,
    pastProgrammes: [],
    planner: { answers: null, plan: null, step: 'intro', main: null, savedAt: null },
    draft: null,
  };
}

const emptyFood = () => ({
  profile: null, targets: null, foods: {}, log: {}, favs: [], weights: {}, water: {}, meals: [], checkins: [], calcPeople: [],
  prefs: { trainingOn: false, trainingGap: 200, water: 2500, dietBreak: false, trendOnly: false },
});

/** Accepts saved data from any version of the app and fills in new fields. */
function migrate(d) {
  return {
    exercises: (d.exercises || []).map((e) => ({ muscles: {}, rest: 90, machineStep: 4, bwMode: 'weighted', ...e })),
    history: d.history || [],
    routines: (d.routines || []).map((r) => ({ sets: {}, ...r })),
    schedule: { weekly: d.schedule?.weekly || {}, overrides: d.schedule?.overrides || {} },
    settings: { barWeight: 20, progression: 'rpe', ...(d.settings || {}) },
    food: { ...emptyFood(), ...(d.food || {}), prefs: { ...emptyFood().prefs, ...(d.food?.prefs || {}) } },
    body: { measures: {}, journey: null, ...(d.body || {}) },
    programme: d.programme ? { checkins: [], goalKg: null, main: null, ...d.programme } : null,
    pastProgrammes: d.pastProgrammes || [],
    planner: { answers: null, plan: null, step: 'intro', main: null, savedAt: null, ...(d.planner || {}) },
    draft: d.draft ? { routineId: null, pdl: false, ...d.draft, entries: d.draft.entries.map((en) => ({ note: '', rpe: '', deload: false, test: false, showWarmup: false, ...en })) } : null,
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { /* fall through to seed */ }
  return seedState();
}

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast('Could not save to this browser’s storage'); }
}

let state = loadState();
let view = 'today';
let editingId = null;      // exercise being edited
let routineEdit = null;    // { id, name, exerciseIds } while editing a routine
let modal = null;          // { type: 'day' | 'summary', ... }
let planWeek = weekStart(todayISO());
let statsWeek = weekStart(todayISO());
let statsExId = null;
let statsMuscle = 'Back';
let balanceDirect = true; // muscle balance counts only sets where the muscle is the main target
let balanceMode = 'typical'; // muscle balance: 'typical' weekly schedule or 'week' with one-off changes
let statsMonth = todayISO().slice(0, 7); // YYYY-MM shown in the month calendar
let lib = { query: '', eq: '', muscle: '', step: 4, picked: new Map() }; // library browser state

const exById = (id) => state.exercises.find((e) => e.id === id);
const routineById = (id) => state.routines.find((r) => r.id === id);
// Each routine gets a bumper-plate colour by its position: red, blue, yellow, green, white.
const PLATE_COLORS = ['bg-indigo-500', 'bg-violet-500', 'bg-amber-500', 'bg-emerald-500', 'bg-slate-100 ring-1 ring-inset ring-slate-400'];
const plateColor = (r) => PLATE_COLORS[Math.max(0, state.routines.indexOf(r)) % PLATE_COLORS.length];
const plateDot = (r, size = 'h-2.5 w-2.5') => (r ? `<span class="inline-block shrink-0 rounded-full ${size} ${plateColor(r)}" aria-hidden="true"></span>` : '');

// ---------- Schedule -----------------------------------------------------

/** The routine planned for a date: a one-off override wins over the weekly plan. */
function plannedRoutine(date) {
  const o = state.schedule.overrides[date];
  const id = o !== undefined ? (o === 'rest' ? null : o) : state.schedule.weekly[dow(date)];
  return id ? routineById(id) || null : null;
}

/** Set a one-off plan for a date; drops the override when it matches the weekly plan. */
function setDayPlan(date, routineId) {
  const weekly = routineById(state.schedule.weekly[dow(date)])?.id || null;
  if ((routineId || null) === weekly) delete state.schedule.overrides[date];
  else state.schedule.overrides[date] = routineId || 'rest';
}

function dayStatus(date) {
  const done = state.history.some((h) => h.date === date);
  const r = plannedRoutine(date);
  if (done) return 'done';
  if (r && date < todayISO()) return 'missed';
  if (r) return 'planned';
  return 'rest';
}

// ---------- Draft workout ------------------------------------------------
function ensureDraft() {
  if (!state.draft) state.draft = { date: todayISO(), routineId: null, entries: [], startedAt: Date.now(), pdl: isDeloadWeek(todayISO()) };
  return state.draft;
}

function addEntry(exId, n = 0) {
  const base = exById(exId);
  if (!base) return;
  const ex = n ? { ...base, sets: n } : base;
  const p = targetFor(ex, ensureDraft().pdl);
  state.draft.entries.push({
    exerciseId: exId, n,
    sets: p.reps.map(() => ({ weight: String(p.weight), reps: '' })),
    note: '', rpe: '', deload: false, test: false, showWarmup: false,
  });
}

function startRoutine(id, date = todayISO()) {
  const r = routineById(id);
  if (!r) return;
  state.draft = { date, routineId: id, entries: [], startedAt: Date.now(), pdl: isDeloadWeek(date) };
  r.exerciseIds.forEach((id) => addEntry(id, r.sets?.[id] || 0));
  state.draft.entries.forEach((en) => (en.ss = !!r.links?.[en.exerciseId]));
  view = 'today';
}

// ---------- Rest timer ---------------------------------------------------
let rest = null; // { end, total, label, alerted }
let audioCtx = null;

/** Rest after a finished set: straight on inside a superset, shorter after a warm-up. */
function restAfterSet(ei, si) {
  const entry = state.draft?.entries[ei];
  if (!entry) return;
  const key = `${ei}-${si}`;
  if (rest && rest.key === key) return; // already resting after this set
  const ex = progEx(entryEx(entry)), s = entry.sets[si];
  const nextEx = entry.ss && state.draft.entries[ei + 1] && exById(state.draft.entries[ei + 1].exerciseId);
  if (nextEx && !s.warm) return toast(`Superset: straight on to ${nextEx.name}`); // rest after the last exercise of the superset
  startRest(s.warm ? 60 : ex.rest || 90, ex.name, key);
}

function startRest(seconds, label, key = null) {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume?.();
  } catch (e) { /* audio is optional */ }
  rest = { end: Date.now() + seconds * 1000, total: seconds, label, alerted: false, key };
  tickRest();
}

function beep() {
  if (!audioCtx) return;
  try {
    const t0 = audioCtx.currentTime;
    [0, 0.25, 0.5].forEach((t) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0 + t);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + 0.18);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + t);
      o.stop(t0 + t + 0.2);
    });
  } catch (e) { /* ignore */ }
}

function tickRest() {
  const box = document.getElementById('rest-timer');
  if (!rest) { box.classList.add('hidden'); return; }
  const left = Math.max(0, Math.ceil((rest.end - Date.now()) / 1000));
  box.classList.remove('hidden');
  document.getElementById('rest-label').textContent = left ? `Rest · ${rest.label}` : 'Rest over — next set!';
  document.getElementById('rest-time').textContent = fmtSecs(left);
  document.getElementById('rest-bar').style.width = `${Math.min(100, (left / rest.total) * 100)}%`;
  if (!left && !rest.alerted) {
    rest.alerted = true;
    navigator.vibrate?.([250, 120, 250, 120, 250]);
    beep();
    const done = rest;
    setTimeout(() => { if (rest === done) { rest = null; tickRest(); } }, 6000);
  }
}
setInterval(tickRest, 250);

function emptyState(title, body, cta, action) {
  return `<div class="card py-10 text-center">
    <p class="text-lg font-semibold">${title}</p>
    <p class="mt-1 text-sm muted">${body}</p>
    ${cta ? `<button class="btn-primary mt-5" data-action="${action}">${cta}</button>` : ''}
  </div>`;
}

// ----- Week calendar strip -----
function weekStrip(start) {
  const today = todayISO();
  return `<div class="grid grid-cols-7 gap-1.5">${DAYS.map((name, i) => {
    const d = addDays(start, i);
    const r = plannedRoutine(d);
    const st = dayStatus(d);
    const label = { done: '✓ Done', missed: 'Missed', planned: r ? r.name.replace(/^\d+\s*·\s*/, '') : '', rest: 'Rest' }[st];
    const tone = {
      done: 'text-emerald-700 dark:text-emerald-400',
      missed: 'text-rose-600 dark:text-rose-400',
      planned: 'text-indigo-700 dark:text-indigo-300',
      rest: 'text-slate-400 dark:text-slate-500',
    }[st];
    const moved = state.schedule.overrides[d] !== undefined;
    return `<button class="flex min-w-0 flex-col items-center rounded-xl border px-0.5 py-2 transition active:scale-95 ${d === today ? 'border-indigo-500 bg-indigo-500/10' : 'border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900'}"
        data-action="open-day" data-date="${d}" aria-label="${fmtDay(d)}: ${esc(label)}">
      <span class="text-[10px] font-semibold uppercase muted">${name}</span>
      <span class="flex items-center gap-1 text-base font-bold tabular-nums">${parseISO(d).getDate()}${st === 'planned' || st === 'missed' ? plateDot(r, 'h-1.5 w-1.5') : ''}</span>
      <span class="mt-0.5 w-full truncate px-0.5 text-center text-[10px] font-semibold leading-4 ${tone}">${esc(label)}${moved ? '*' : ''}</span>
    </button>`;
  }).join('')}</div>`;
}

/** Four headline numbers under today's card: weight trend, sessions, calories left, next check-in. */
function todayTiles(today) {
  const ws = weekStart(today), tiles = [];
  const series = weightSeries(), last = series[series.length - 1];
  const goal = state.programme?.goalKg ?? state.body.journey?.goal;
  if (last) {
    const start = state.body.journey?.kg ?? series[0].kg;
    const pct = goal && start > goal ? Math.max(2, Math.min(100, ((start - last.trend) / (start - goal)) * 100)) : null;
    tiles.push(`<p class="label">Weight trend</p><p class="display text-3xl leading-none tabular-nums">${fmt(round1(last.trend))}<span class="ml-1 font-sans text-sm font-semibold normal-case muted">kg</span></p>
      ${pct !== null ? `<div class="mt-2 h-1.5 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-800"><div class="h-full rounded-full bg-indigo-500" style="width:${pct}%"></div></div><p class="mt-1 text-xs muted">${fmt(round1(Math.max(0, last.trend - goal)))} kg to ${fmt(goal)} kg</p>` : '<p class="mt-1 text-xs muted">Smoothed average</p>'}`);
  }
  const planned = DAYS.filter((_, i) => plannedRoutine(addDays(ws, i))).length;
  const trained = new Set(state.history.filter((h) => h.date >= ws && h.date <= addDays(ws, 6)).map((h) => h.date)).size;
  if (planned || trained) tiles.push(`<p class="label">This week</p><p class="display text-3xl leading-none tabular-nums">${trained}<span class="ml-1 font-sans text-sm font-semibold normal-case muted">/ ${planned} sessions</span></p>
    <div class="mt-2 flex gap-1">${DAYS.map((_, i) => { const d = addDays(ws, i), r = plannedRoutine(d), st = dayStatus(d); return r || st === 'done' ? `<span class="h-3 w-3 rounded-full ${st === 'done' ? 'bg-emerald-500' : r ? plateColor(r) + ' opacity-35' : ''}"></span>` : ''; }).join('')}</div>`);
  const t = targetsFor(today);
  if (t) {
    const left = t.kcal - dayTotals(today).kcal, pLeft = t.protein - dayTotals(today).protein;
    tiles.push(`<p class="label">Calories left</p><p class="display text-3xl leading-none tabular-nums ${left < 0 ? 'text-rose-500' : ''}">${fmtKg(Math.abs(left))}<span class="ml-1 font-sans text-sm font-semibold normal-case muted">${left < 0 ? 'kcal over' : 'kcal'}</span></p>
      <p class="mt-1 text-xs muted">${pLeft > 0 ? `${fmtKg(pLeft)} g protein to go` : 'Protein hit ✓'}${t.dayType ? ` · ${t.dayType} day` : ''}</p>`);
  }
  const p = state.programme;
  if (p) {
    const due = dueCheckin(), next = PROG_CHECKS.find((n) => !progCheckin(n) && checkinDate(n) > today);
    if (due) tiles.push(`<p class="label">Check-in</p><p class="display text-3xl leading-none text-indigo-600 dark:text-indigo-400">Due now</p><button class="link mt-1 text-xs" data-action="prog-checkin" data-week="${due}">Do week ${due} check-in</button>`);
    else if (next) { const cd = checkinDate(next); tiles.push(`<p class="label">Next check-in</p><p class="display text-3xl leading-none tabular-nums">${DAYS[dow(cd)]} ${parseISO(cd).getDate()}<span class="ml-1 font-sans text-sm font-semibold normal-case muted">${parseISO(cd).toLocaleDateString('en-GB', { month: 'short' })}</span></p><p class="mt-1 text-xs muted">End of week ${next}</p>`); }
  }
  if (tiles.length < 2) return '';
  const list = tiles.length === 3 ? tiles.slice(0, 2) : tiles;
  return `<section class="mb-4 grid grid-cols-2 gap-px overflow-hidden rounded-2xl border border-slate-200 bg-slate-200 dark:border-slate-800 dark:bg-slate-800">
    ${list.map((x) => `<div class="min-w-0 bg-white p-3 dark:bg-slate-900">${x}</div>`).join('')}
  </section>`;
}

// ----- Workout tab -----
function todayView() {
  if (!state.exercises.length) {
    return emptyState('No exercises yet', 'Add exercises to your database to get automatic targets.', 'Add an exercise', 'goto-exercises');
  }
  const today = todayISO();
  const d = state.draft;
  const active = d && d.entries.length;

  let html = `<section class="mb-4">${weekStrip(weekStart(today))}
    <div class="mt-2 flex justify-end"><button class="link text-xs" data-action="open-plates">Plate calculator</button></div>
  </section>`;
  if (!active) html += newPlanCard();
  html += progBanner(active ? d.date : today);
  const dl = active ? d.pdl : isDeloadWeek(today);

  if (!active) {
    const r = plannedRoutine(today);
    const doneToday = state.history.some((h) => h.date === today);
    html += `<section class="card relative mb-4 overflow-hidden pl-7">
      <span class="absolute bottom-4 left-0 top-4 w-2.5 rounded-r-full ${r && !doneToday ? plateColor(r) : doneToday ? 'bg-emerald-500' : 'bg-slate-300 dark:bg-slate-700'}" aria-hidden="true"></span>
      <p class="eyebrow">Today · ${fmtDay(today)}</p>`;
    if (doneToday) {
      html += `<h2 class="mt-1 text-4xl leading-none">Workout logged ✓</h2>
        <p class="mt-2 text-sm muted">Nice work. Check your progress in Stats, or log more below.</p>`;
    }
    if (r && !doneToday) {
      const w = progWeek(today), exs = r.exerciseIds.map(exById).filter(Boolean);
      const reps = w ? (dl ? 'Deload' : BLOCKS[blockOf(w)].reps.replace(' on main lifts', ' main lifts')) : '';
      html += `<h2 class="mt-1 text-[2.6rem] leading-[0.95]">${esc(r.name)}</h2>
        <div class="mt-3 flex flex-wrap gap-1.5">
          ${reps ? `<span class="badge bg-indigo-500/10 text-indigo-700 ring-1 ring-inset ring-indigo-500/40 dark:text-indigo-300">${reps}</span>` : ''}
          <span class="badge bg-slate-100 dark:bg-slate-800">${exs.length} exercise${exs.length === 1 ? '' : 's'}</span>
          <span class="badge bg-slate-100 dark:bg-slate-800">≈ ${sessionMinutes(r, today, dl)} min</span>
        </div>
        ${sessionMinutes(r, today, dl) > 60 ? `<p class="mt-2 rounded-lg bg-amber-500/10 px-2 py-1 text-xs text-amber-800 dark:text-amber-300">Over your hour. Shorter rests on isolation exercises (60–90 s) or pairing two into a superset will bring it down.</p>` : ''}
        <ul class="mt-3 divide-y divide-slate-200 dark:divide-slate-800">
          ${exs.map((ex) => {
            const p = targetFor(routineEx(r, ex), dl);
            return `<li class="flex items-center justify-between gap-3 py-2">
              <span class="min-w-0 truncate font-medium">${esc(ex.name)}</span>
              <span class="shrink-0 text-right font-bold tabular-nums">${loadLabel(ex, p.weight)} <span class="font-medium muted">× ${p.reps.join('/')}</span></span>
            </li>`;
          }).join('')}
        </ul>
        <button class="btn-primary display mt-3 w-full text-lg tracking-[0.08em]" data-action="start-routine" data-id="${r.id}">Start workout →</button>`;
    } else if (!doneToday) {
      html += `<h2 class="mt-1 text-4xl leading-none">Rest day</h2>
        <p class="mt-2 text-sm muted">${state.routines.length ? 'Nothing scheduled. Recover, or start a workout below.' : 'Create routines and a weekly schedule in the Plan tab, or build a plan from a questionnaire.'}</p>
        ${state.routines.length ? '' : '<button class="btn-primary mt-3 w-full" data-action="builder-open">Build my plan</button>'}`;
    }
    html += `</section>`;
    html += todayTiles(today);
    const lastWeek = addDays(weekStart(today), -7);
    if (dow(today) <= 1 && !snoozed(`recap-${lastWeek}`)) html += recapHtml(lastWeek, true); // Monday & Tuesday

    const others = state.routines.filter((x) => doneToday || x.id !== r?.id);
    if (others.length) {
      html += `<section class="mb-4">
        <h3 class="mb-2 text-sm font-bold uppercase tracking-wide muted">${r && !doneToday ? 'Or start another routine' : 'Start a routine'}</h3>
        <div class="grid grid-cols-2 gap-2">${others.map((x) => `<button class="btn-ghost justify-start truncate text-left" data-action="start-routine" data-id="${x.id}">${esc(x.name)}</button>`).join('')}</div>
      </section>`;
    }
  } else {
    const r = routineById(d.routineId);
    html += `<section class="mb-4 flex items-end justify-between gap-3">
      <div class="min-w-0">
        <h2 class="truncate text-3xl">${r ? esc(r.name) : 'Today’s workout'}</h2>
        <p class="text-sm muted">${d.pdl ? 'Deload targets' : 'Targets come from your last session'}${d.startedAt ? ` · <span id="workout-clock" class="font-semibold">${clockText(d)}</span>` : ''}</p>
      </div>
      <input type="date" class="input w-auto py-2 text-sm" data-action="draft-date" value="${d.date}" aria-label="Workout date">
    </section>`;
    if (d.pdl || isDeloadWeek(d.date)) {
      html += `<p class="-mt-2 mb-4 text-right"><button class="link text-xs" data-action="toggle-pdl">${d.pdl ? 'Train normally today instead' : 'Use deload targets'}</button></p>`;
    }
    html += d.entries.map((entry, i) => entryCard(entry, i)).join('');
  }

  const inDraft = new Set((d?.entries || []).map((e) => e.exerciseId));
  const remaining = state.exercises.filter((e) => !inDraft.has(e.id));
  if (remaining.length) {
    html += `<details class="card mb-4">
      <summary class="flex cursor-pointer list-none items-center justify-between font-semibold">
        <span>${active ? 'Add another exercise' : 'Build a one-off workout'}</span>
        <span class="link">Show</span>
      </summary>
      <div class="mt-3 space-y-2">
        ${remaining.length > 1 ? `<button class="link" data-action="add-all">Add all ${remaining.length}</button>` : ''}
        ${remaining.map((ex) => {
          const p = targetFor(ex, dl);
          return `<button class="flex w-full items-center justify-between gap-3 rounded-xl border border-slate-200 px-3 py-3 text-left transition hover:border-indigo-400 active:scale-[0.99] dark:border-slate-800" data-action="add-entry" data-id="${ex.id}">
            <span class="min-w-0">
              <span class="block truncate font-medium">${esc(ex.name)}</span>
              <span class="text-xs muted">${eqLabel(ex)} · ${ex.repMin}–${ex.repMax} reps</span>
            </span>
            <span class="shrink-0 text-right">
              <span class="block font-bold tabular-nums">${loadLabel(ex, p.weight)}</span>
              <span class="text-xs tabular-nums muted">${p.reps.join(' / ')}</span>
            </span>
          </button>`;
        }).join('')}
      </div>
    </details>`;
  }

  if (active) {
    html += `<div class="grid grid-cols-[1fr_2fr] gap-3">
      <button class="btn-ghost" data-action="discard">Discard</button>
      <button class="btn-success" data-action="finish">Finish &amp; save workout</button>
    </div>`;
  }
  return html;
}

function setText(ex, s) {
  return (s.warm ? 'W ' : '') + setLoadText(ex, s) + (s.rpe ? ` @${fmt(s.rpe)}` : '');
}
function setLoadText(ex, s) {
  if (ex && repsOnly(ex)) return `${s.reps}`;
  if (ex && isBW(ex) && !isAssisted(ex)) return s.weight > 0 ? `+${fmt(s.weight)}×${s.reps}` : `BW×${s.reps}`;
  return `${fmt(s.weight)}×${s.reps}`;
}
const setsText = (ex, sets, sep = ', ') => sets.map((s) => setText(ex, s)).join(sep);

function lastLine(p, ex) {
  if (!p.last) return '';
  const sets = setsText(ex, p.last.sets);
  const extra = [p.last.rpe ? `RPE ${p.last.rpe}` : '', p.last.note ? `“${esc(p.last.note)}”` : ''].filter(Boolean).join(' · ');
  return `<p class="mt-2 text-xs muted">Last (${fmtShort(p.last.date)}): ${sets}${extra ? `<br>${extra}` : ''}</p>`;
}

/**
 * Warm-up ramp and plates for the weight actually being lifted: the heaviest
 * weight typed into the set rows, else the (deload) target.
 */
function warmupHtml(entry, ex, p, stall) {
  if (!entry.showWarmup) return '';
  const typed = entry.sets.map((s) => parseFloat(s.weight)).filter((w) => w > 0);
  const workWeight = typed.length ? round2(Math.max(...typed)) : entry.deload && stall ? stall.weight : p.weight;
  const warm = warmupsFor(ex, workWeight);
  return `<div class="mt-2 space-y-1 rounded-xl bg-slate-100 p-3 text-sm dark:bg-slate-800/60">
      ${warm.length ? warm.map((w, k) => `<div class="flex justify-between gap-3"><span><span class="muted">Warm-up ${k + 1}:</span> <b class="tabular-nums">${fmt(w.weight)} kg × ${w.reps}</b></span>${ex.type === 'barbell' ? `<span class="text-right text-xs muted">${platesFor(w.weight).text}</span>` : ''}</div>`).join('')
        : '<p class="muted">Light enough to skip warm-ups. Do a few easy reps first.</p>'}
      <div class="flex justify-between gap-3 border-t border-slate-200 pt-1 dark:border-slate-700"><span><span class="muted">Working:</span> <b class="tabular-nums">${loadLabel(ex, workWeight)}</b></span>${ex.type === 'barbell' ? `<span class="text-right text-xs font-semibold">Per side: ${platesFor(workWeight).text}</span>` : ''}</div>
      ${ex.type === 'barbell' ? `<p class="text-xs muted">Plates per side, ${fmt(state.settings.barWeight)} kg bar. <button class="link text-xs" data-action="open-plates" data-total="${workWeight}">Open plate calculator</button></p>` : ''}
    </div>`;
}

function entryCard(entry, i) {
  const raw = entryEx(entry);
  if (!raw) return '';
  const ex = progEx(raw);
  const p = entryTarget(entry);
  const stall = ['deload', 'test', 'block'].includes(p.rule) ? null : plateau(ex);

  let stallHtml = '';
  if (stall && !entry.deload) {
    stallHtml = `<div class="mt-3 rounded-xl border border-amber-500/40 bg-amber-500/10 p-3 text-sm">
      <p class="font-semibold text-amber-800 dark:text-amber-300">⚠ Plateau: no progress for 3 sessions at ${loadLabel(ex, stall.at)}</p>
      <p class="mt-0.5 text-slate-700 dark:text-slate-300">${isAssisted(ex) ? 'A little more assistance' : 'A ~10% deload'} (<b>${loadLabel(ex, stall.weight)}</b>) lets you build momentum and push past it.</p>
      <button class="mt-2 rounded-lg bg-amber-500 px-3 py-1.5 text-sm font-semibold text-white" data-action="apply-deload" data-e="${i}">Apply deload</button>
    </div>`;
  } else if (entry.deload && stall) {
    stallHtml = `<div class="mt-3 flex items-center justify-between gap-2 rounded-xl bg-amber-500/10 p-3 text-sm">
      <span class="text-amber-800 dark:text-amber-300">Deload applied: ${loadLabel(ex, stall.weight)}. Build back up from here.</span>
      <button class="link shrink-0" data-action="undo-deload" data-e="${i}">Undo</button>
    </div>`;
  }

  const entries = state.draft.entries;
  const next = entries[i + 1] && exById(entries[i + 1].exerciseId);
  const inSuperset = entry.ss || entries[i - 1]?.ss;
  return `<article class="card mb-4 ${inSuperset ? 'border-indigo-500 dark:border-indigo-500' : ''}" data-entry="${i}">
    ${inSuperset ? `<p class="mb-1 text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-300">⛓ Superset${entry.ss && next ? ` · then ${esc(next.name)}` : ''}</p>` : ''}
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <h3 class="truncate text-lg font-bold">${esc(ex.name)}</h3>
        <p class="text-xs muted">${eqLabel(ex)} · ${ex.repMin}–${ex.repMax} reps · ${ex.sets} sets</p>
      </div>
      <div class="-mr-2 -mt-1 flex">
        <button class="icon-btn" data-action="swap-entry" data-e="${i}" aria-label="Swap for another exercise">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
        </button>
        <button class="icon-btn" data-action="remove-entry" data-e="${i}" aria-label="Remove exercise">${ICON_X}</button>
      </div>
    </div>

    <div class="mt-3 rounded-xl bg-indigo-500/10 p-3">
      <div class="flex items-center justify-between gap-2">
        <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-300">Target today</span>
        ${badge(p.rule)}
      </div>
      <p class="mt-1 text-3xl font-extrabold tabular-nums">${loadLabel(ex, p.weight)} <span class="text-xl font-bold text-slate-500 dark:text-slate-400">× ${p.reps.join(' / ')}</span></p>
      <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">${p.reason}</p>
      ${p.belowRange ? `<p class="mt-1 text-sm font-medium text-rose-600 dark:text-rose-400">All sets were below ${ex.repMin} reps — consider dropping ${fmt(stepFor(ex))} kg if this repeats.</p>` : ''}
      ${lastLine(p, ex)}
      ${sparkHtml(ex)}
    </div>
    ${stallHtml}
    ${canTest(ex) ? `<button class="link mt-3 block" data-action="toggle-test" data-e="${i}">${entry.test ? '↩ Back to deload sets' : '🎯 Test a rep max instead (optional)'}</button>` : ''}

    ${isBW(ex) ? '' : `<button class="link mt-3" data-action="toggle-warmup" data-e="${i}">${entry.showWarmup ? '▾' : '▸'} Warm-up${ex.type === 'barbell' ? ' & plates' : ' sets'}</button>`}
    <div id="warm-${i}">${warmupHtml(entry, ex, p, stall)}</div>

    <div class="mt-3 grid grid-cols-[1.75rem_1fr_1fr_3.25rem_2.75rem_2rem] gap-1.5 px-1 text-[11px] font-semibold uppercase tracking-wide muted">
      <span class="text-center">Set</span><span class="text-center">${repsOnly(ex) ? '' : isAssisted(ex) ? 'Assist kg' : isBW(ex) ? '+ kg' : 'kg'}</span><span class="text-center">Reps</span><span class="text-center">RPE</span><span></span><span></span>
    </div>
    <div class="mt-1 space-y-1">
      ${entry.sets.map((s, j) => setRow(i, j, s, p, ex)).join('')}
    </div>
    <p class="mt-1 px-1 text-[11px] muted">Tap a set number to mark it <b class="text-amber-600 dark:text-amber-400">W</b> (warm-up or finding your weight) so it’s ignored. RPE: 10 = nothing left, 9 = 1 rep left, 8 = 2 left, 7 = 3 left.</p>

    <div class="mt-3 flex items-center justify-between gap-3">
      <div class="flex shrink-0 gap-4">
        <button class="link" data-action="add-set" data-e="${i}">+ Set</button>
        <button class="link" data-action="rest-start" data-e="${i}">⏱ ${fmtSecs(ex.rest || 90)}</button>
        ${next ? `<button class="link ${entry.ss ? '' : 'opacity-70'}" data-action="toggle-ss" data-e="${i}" aria-pressed="${!!entry.ss}">${entry.ss ? '⛓ Unlink' : '⛓ Superset'}</button>` : ''}
      </div>
      <p class="text-right text-sm" id="progress-${i}">${progressHtml(entry, ex, p)}</p>
    </div>

    <div class="mt-3">
      <input class="input py-2 text-sm" data-entry-field="note" data-e="${i}" maxlength="140" placeholder="Note (seat height, grip, how it felt…)" value="${esc(entry.note)}">
    </div>
  </article>`;
}

/** Tiny single-series trend line (no axes) for inline use. */
function sparkSvg(vals) {
  const lo = Math.min(...vals), hi = Math.max(...vals), W = 84, H = 24;
  const pts = vals.map((v, k) => [round2((k / (vals.length - 1)) * (W - 4) + 2), round2(hi === lo ? H / 2 : H - 3 - ((v - lo) / (hi - lo)) * (H - 6))]);
  const [lx, ly] = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" class="h-6 w-20 shrink-0 overflow-visible" aria-hidden="true">
      <polyline points="${pts.map((q) => q.join(',')).join(' ')}" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${lx}" cy="${ly}" r="2.5" fill="#6366f1"/>
    </svg>`;
}

/** Small trend line of the last few sessions: est. 1RM, or best-set reps for bodyweight. */
function sparkHtml(ex) {
  const ss = sessionsFor(ex.id).filter((h) => !h.pdl && !h.test).slice(0, 8).reverse();
  if (ss.length < 2) return '';
  const bw = isBW(ex);
  const vals = ss.map((h) => (bw ? Math.max(...evaluate(ex, h.sets).reps) : round1(bestE1(h.sets))));
  const strong = (t) => `<b class="text-slate-700 dark:text-slate-200">${t}</b>`;
  return `<div class="mt-2 flex items-center gap-2 text-xs muted">
    ${sparkSvg(vals)}
    <span>${bw ? `Best set: ${vals[0]} → ${strong(`${vals[vals.length - 1]} reps`)}` : `Est. 1RM: ${fmt(vals[0])} → ${strong(`${fmt(vals[vals.length - 1])} kg`)}`} · last ${vals.length} sessions</span>
  </div>`;
}

function targetReps(p, ex, j) {
  return p.reps[j] ?? p.reps[p.reps.length - 1] ?? ex.repMin;
}

function setRow(i, j, s, p, ex) {
  const done = parseInt(s.reps, 10) > 0;
  const rpeOpts = ['6', '7', '7.5', '8', '8.5', '9', '9.5', '10'];
  return `<div class="set-row ${s.warm ? 'warm' : done ? 'done' : ''}" id="row-${i}-${j}">
    <button class="h-9 text-center font-bold ${s.warm ? 'text-amber-600 dark:text-amber-400' : 'muted'}" data-action="toggle-warm" data-e="${i}" data-s="${j}" aria-label="Set ${j + 1}: ${s.warm ? 'warm-up (tap for working set)' : 'working set (tap to mark as warm-up)'}">${s.warm ? 'W' : j + 1}</button>
    ${repsOnly(ex) ? '<span class="input text-center text-sm font-semibold muted" aria-label="Bodyweight">BW</span>'
      : `<input class="input text-center text-lg font-semibold tabular-nums" type="number" inputmode="decimal" step="any" min="0"
      data-field="weight" data-e="${i}" data-s="${j}" value="${esc(s.weight)}" placeholder="${fmt(p.weight)}" aria-label="Set ${j + 1} ${isAssisted(ex) ? 'assistance' : 'weight'}">`}
    <input class="input text-center text-lg font-semibold tabular-nums" type="number" inputmode="numeric" step="1" min="0"
      data-field="reps" data-e="${i}" data-s="${j}" value="${esc(s.reps)}" placeholder="${s.warm ? '' : targetReps(p, ex, j)}" aria-label="Set ${j + 1} reps">
    <select class="input appearance-none px-0 text-center text-sm font-semibold tabular-nums" data-field="rpe" data-e="${i}" data-s="${j}" aria-label="Set ${j + 1} RPE">
      <option value="">${s.warm ? '–' : 'RPE'}</option>${rpeOpts.map((v) => `<option value="${v}" ${String(s.rpe ?? '') === v ? 'selected' : ''}>${v}</option>`).join('')}
    </select>
    <button class="check" data-action="fill-set" data-e="${i}" data-s="${j}" aria-label="Mark set ${j + 1} done">✓</button>
    <button class="icon-btn h-8 w-8" data-action="remove-set" data-e="${i}" data-s="${j}" aria-label="Remove set ${j + 1}">
      <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
  </div>`;
}

function progressHtml(entry, ex, p) {
  const sets = cleanSets(entry.sets, p.weight);
  if (!sets.length) return `<span class="muted">Goal: <b class="text-slate-900 dark:text-slate-100">${p.total}</b> reps</span>`;
  const ev = evaluate(ex, sets);
  if (p.rule === 'deload') return `<span class="muted">@ ${loadLabel(ex, ev.top)}: </span><b class="tabular-nums">${ev.total}</b><span class="muted"> reps · easy</span>`;
  if (p.rule === 'test') return `<span class="muted">Est. 1RM </span><b class="tabular-nums">${fmt(round1(bestE1(sets)))} kg</b>`;
  if (ev.hitCeiling && p.rule !== 'rpe') {
    return `<span class="font-semibold text-emerald-700 dark:text-emerald-400">Ceiling hit → +${fmt(stepFor(ex))} kg next</span>`;
  }
  const sameWeight = ev.top === p.weight;
  const beat = sameWeight && ev.total >= p.total;
  const colour = beat ? 'text-emerald-700 dark:text-emerald-400' : 'text-slate-900 dark:text-slate-100';
  return `<span class="muted">@ ${loadLabel(ex, ev.top)}: </span><b class="tabular-nums ${colour}">${ev.total}</b>${sameWeight ? `<span class="muted"> / ${p.total} reps</span>` : '<span class="muted"> reps</span>'}`;
}

// ----- 12-week programme -----
// Runs on top of the routines and weekly schedule. Three 4-week blocks: weeks
// 1–3 of each block build, week 4 is a deload. Each block sets its own rep
// range (and extra volume) for the exercises; the double-progression engine
// does the rest.
const PROG_WEEKS = 12;
const PROG_CHECKS = [4, 8, 12]; // check-ins at the end of each block (plus one at the start)
const BLOCKS = {
  1: { name: 'Base', reps: '10–15 reps', cell: 'bg-indigo-500', dot: 'bg-indigo-500',
    tip: 'Higher reps (10–15) to build a base. Leave 1–2 reps in the tank and beat last time by a rep or a weight step.' },
  2: { name: 'Build', reps: '8–12 reps', cell: 'bg-violet-500', dot: 'bg-violet-500',
    tip: 'Moderate reps (8–12) and one extra set on your main lifts. Leave 1–2 reps in the tank.' },
  3: { name: 'Strength', reps: '5–8 reps on main lifts', cell: 'bg-emerald-600', dot: 'bg-emerald-600',
    tip: 'Main lifts go heavy (5–8 reps) with longer rests; other exercises stay at 8–12. Leave 1–2 reps in the tank.' },
};
const DELOAD_TIP = 'Deload: about 10% lighter, half the sets, easy effort (stop with 3–4 reps left). Fatigue drops so the next block starts fresh.';
const FEEL = [['great', 'Strong, recovering well'], ['ok', 'Fine'], ['beaten', 'Run down or achy']];

const blockOf = (w) => Math.ceil(w / 4);
const progEnd = () => addDays(state.programme.start, PROG_WEEKS * 7 - 1);
const checkinDate = (w) => addDays(state.programme.start, w * 7 - 1); // Sunday at the end of week w
const progCheckin = (w) => state.programme?.checkins.find((c) => c.week === w);

/** Programme week (1–12) a date falls in, or null outside the programme. */
function progWeek(date) {
  const p = state.programme;
  if (!p || date < p.start) return null;
  const w = Math.floor(daysBetween(p.start, date) / 7) + 1;
  return w <= PROG_WEEKS ? w : null;
}

const isDeloadWeek = (date) => [4, 8, 12].includes(progWeek(date));
const programmeLifts = () => [...new Set(state.routines.flatMap((r) => r.exerciseIds))].map(exById).filter(Boolean);
/** Main lifts get the strength rep range and extra volume. Default: compound moves (more than one muscle). */
const defaultMain = () => programmeLifts().filter((e) => !repsOnly(e) && Object.keys(e.muscles || {}).length >= 2).map((e) => e.id);
const isMain = (ex) => (state.programme?.main ?? defaultMain()).includes(ex.id);

/** The exercise as the programme wants it on a date: block rep range, sets and rest. */
function progEx(ex, date = state.draft?.date || todayISO()) {
  const w = progWeek(date);
  if (!w || repsOnly(ex)) return ex;
  const b = blockOf(w), main = isMain(ex);
  const [repMin, repMax] = b === 1 ? [10, 15] : b === 3 && main ? [5, 8] : [8, 12];
  return { ...ex, repMin, repMax, sets: ex.sets + (b === 2 && main ? 1 : 0), rest: b === 3 && main ? Math.max(ex.rest || 90, 150) : ex.rest };
}

/**
 * First session of a new block (new rep range): pick the weight from the
 * estimated 1RM so the bottom of the new range is ~2 reps short of failure.
 */
function rebase(e, date) {
  const w = progWeek(date);
  if (!w || isBW(e)) return null;
  const last = sessionsFor(e.id).find((h) => !h.pdl); // a rep-max test counts here
  if (!last) return null;
  const lastWeek = progWeek(last.date);
  if (lastWeek && blockOf(lastWeek) === blockOf(w)) return null;
  const before = progEx(exById(e.id), last.date);
  if (before.repMin === e.repMin && before.repMax === e.repMax) return null;
  const e1 = ratedE1(e, last) ?? Math.max(0, ...last.sets.filter((x) => !x.warm).map(e1rmRpe));
  if (!e1) return null;
  const weight = floorToStep(e1 / (1 + (e.repMin + 2) / 30), e);
  const reps = Array(e.sets).fill(e.repMin);
  return {
    rule: 'block', weight, reps, total: sum(reps), last,
    reason: `New block: ${e.repMin}–${e.repMax} reps × ${e.sets} sets. Weight set from your estimated 1RM (${fmt(round1(e1))} kg) so ${e.repMin} reps feels like 2 left in the tank. Build up from here.`,
  };
}

/** Last real working load (ignores deload weeks and rep-max tests). */
function lastTop(e) {
  const last = sessionsFor(e.id).find((h) => !h.pdl && !h.test);
  return last ? evaluate(e, last.sets).top : null;
}

/** Today's target: the block's progression, or the deload-week version of it. */
function targetFor(ex, deload = !!state.draft?.pdl, date = state.draft?.date || todayISO()) {
  const e = progEx(ex, date);
  const p = rebase(e, date) || predict(e, date);
  if (!deload) return p;
  const top = lastTop(e) ?? p.weight, step = stepFor(e);
  let weight = top;
  if (isAssisted(e)) weight = roundToStep(Math.max(top * 1.1, top + step), e); // a bit more help
  else if (!isBW(e) || top > 0) {
    weight = roundToStep(top * 0.9, e);
    if (weight >= top) weight = round2(Math.max(0, top - step));
  }
  const n = Math.max(1, Math.ceil(e.sets / 2));
  const reps = Array(n).fill(e.repMin);
  return {
    rule: 'deload', weight, reps, total: sum(reps), last: p.last,
    reason: `Deload week: ${n} easy set${n === 1 ? '' : 's'} at ${loadLabel(e, weight)}${weight !== top ? ` (down from ${loadLabel(e, top)})` : ''}, stopping with 3–4 reps left. Back to building next week.`,
  };
}

/** Week 12 option: one all-out set at the last working weight to measure progress. */
function testTarget(ex) {
  const e = progEx(ex), weight = lastTop(e) ?? predict(e).weight;
  return {
    rule: 'test', weight, reps: [e.repMax], total: e.repMax, last: predict(e).last,
    reason: `Rep-max test: warm up, then one set at ${loadLabel(e, weight)} for as many clean reps as you can. Stop when the next rep would break form. Your estimated 1RM is worked out from it.`,
  };
}

/** The exercise as this routine plans it (a routine can set its own number of sets). */
const routineEx = (r, ex) => (r?.sets?.[ex.id] ? { ...ex, sets: r.sets[ex.id] } : ex);
const entryEx = (entry) => { const ex = exById(entry.exerciseId); return ex && entry.n ? { ...ex, sets: entry.n } : ex; };
const entryTarget = (entry) => (entry.test ? testTarget(entryEx(entry)) : targetFor(entryEx(entry)));
const canTest = (ex) => progWeek(state.draft?.date || todayISO()) === 12 && isMain(ex) && !isBW(ex);

/** The check-in that's due now (latest first), if it hasn't been done. */
function dueCheckin() {
  if (!state.programme) return null;
  const today = todayISO();
  return [...PROG_CHECKS].reverse().find((w) => checkinDate(w) <= today && !progCheckin(w)) ?? null;
}

/** Smoothed weight on (or just before) a date, falling back to a typed weight. */
function trendAt(date, fallback) {
  const pts = weightSeries().filter((x) => x.date <= date);
  return pts.length ? pts[pts.length - 1].trend : fallback;
}

/** Strength change for one exercise: the last session before `from` against the latest by `to`. */
function liftChange(ex, from, to) {
  const ss = sessionsFor(ex.id).filter((h) => !h.pdl);
  const inside = ss.filter((h) => h.date >= from && h.date <= to);
  const base = ss.find((h) => h.date < from) || inside[inside.length - 1];
  const now = inside[0];
  if (!base || !now || base === now) return null;
  if (isBW(ex)) {
    const a = evaluate(ex, base.sets), b = evaluate(ex, now.sets);
    const best = (ev) => Math.max(...ev.reps);
    const dir = harder(ex, b.top, a.top) ? 1 : harder(ex, a.top, b.top) ? -1 : Math.sign(b.total - a.total);
    const txt = (ev) => (repsOnly(ex) ? `${best(ev)} reps` : `${loadLabel(ex, ev.top)} × ${best(ev)}`);
    return { ex, dir, pct: 0, text: `${txt(a)} → ${txt(b)}` };
  }
  const a = bestE1(base.sets), b = bestE1(now.sets);
  if (!a) return null;
  const pct = (b - a) / a;
  return { ex, dir: pct > 0.01 ? 1 : pct < -0.01 ? -1 : 0, pct, text: `${fmt(round1(a))} → ${fmt(round1(b))} kg est. 1RM` };
}

function strengthChanges(to) {
  return programmeLifts().map((ex) => liftChange(ex, state.programme.start, to)).filter(Boolean);
}

/** Headline for a programme week, e.g. "Block 2 · Build · week 3 of 4". */
function weekTitle(w) {
  const b = blockOf(w), k = w - (b - 1) * 4;
  return k === 4 ? `Block ${b} · Deload week` : `Block ${b} · ${BLOCKS[b].name} · week ${k} of 4`;
}
const weekTip = (w) => (isDeloadWeek(addDays(state.programme.start, (w - 1) * 7))
  ? DELOAD_TIP + (w === 12 ? ' Optional: test a rep max on your main lifts to see how far you’ve come.' : '')
  : BLOCKS[blockOf(w)].tip);

/** Small banner on the Workout tab: which week it is and how hard to train. */
function progBanner(date) {
  const w = progWeek(date);
  if (!w) return '';
  const easy = isDeloadWeek(date);
  return `<button class="mb-4 block w-full rounded-2xl border p-3 text-left ${easy ? 'border-amber-500/40 bg-amber-500/10' : 'border-indigo-500/30 bg-indigo-500/10'}" data-action="nav" data-view="plan">
    <p class="text-xs font-bold uppercase tracking-wider ${easy ? 'text-amber-700 dark:text-amber-300' : 'text-indigo-600 dark:text-indigo-300'}">Week ${w} of ${PROG_WEEKS} · ${weekTitle(w)}</p>
    <p class="mt-0.5 text-sm text-slate-700 dark:text-slate-300">${weekTip(w)}</p>
    ${dietBreakOn(date) && state.food.targets ? `<p class="mt-1 text-sm font-semibold text-amber-800 dark:text-amber-300">Diet break: eat at maintenance this week (${fmtKg(baseTargets(date).kcal)} kcal).</p>` : ''}
  </button>`;
}

function programmeCard() {
  const p = state.programme, today = todayISO();
  if (!p) {
    return `<section class="card mb-4 border-indigo-500 dark:border-indigo-500">
      <p class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-300">12-week programme</p>
      <h3 class="mt-1 text-lg font-bold">Three 4-week blocks, each ending in a deload</h3>
      <p class="mt-1 text-sm muted">Uses your routines and weekly schedule as they are. Block 1 builds a base at 10–15 reps, Block 2 moves to 8–12 with a bit more volume, Block 3 goes for strength at 5–8 reps on main lifts. Week 4 of each block is a deload; week 12 adds optional rep-max tests. Check-ins at the start and after each block.</p>
      <button class="btn-primary mt-3 w-full" data-action="prog-setup">Set up programme</button>
    </section>`;
  }
  const w = progWeek(today), done = today > progEnd();
  const shown = w || (done ? PROG_WEEKS + 1 : 0);
  const cells = Array.from({ length: PROG_WEEKS }, (_, i) => {
    const n = i + 1, deload = n % 4 === 0;
    return `<div class="relative">
      <div class="mx-auto flex aspect-square w-full max-w-[2rem] items-center justify-center rounded-full text-[11px] font-bold ${deload ? 'bg-amber-500 text-slate-950' : BLOCKS[blockOf(n)].cell + ' text-white'} ${n < shown ? 'opacity-90' : n === shown ? 'ring-2 ring-slate-900 ring-offset-1 ring-offset-white dark:ring-white dark:ring-offset-slate-900' : 'opacity-35'}">${n}</div>
      ${PROG_CHECKS.includes(n) ? `<p class="mt-0.5 text-center text-[10px] leading-3 ${progCheckin(n) ? 'text-emerald-600 dark:text-emerald-400' : 'muted'}">${progCheckin(n) ? '✓' : '●'}</p>` : ''}
    </div>`;
  }).join('');

  let head;
  if (w) head = `<h3 class="mt-1 text-xl font-bold">Week ${w} of ${PROG_WEEKS}</h3><p class="text-sm muted">${weekTitle(w)}${w % 4 ? ` · ${BLOCKS[blockOf(w)].reps}` : ''}</p>`;
  else if (done) head = `<h3 class="mt-1 text-xl font-bold">Programme complete 🎉</h3><p class="text-sm muted">${fmtShort(p.start)} – ${fmtShort(progEnd())}</p>`;
  else head = `<h3 class="mt-1 text-xl font-bold">Starts ${fmtDay(p.start)}</h3><p class="text-sm muted">Block 1 · Base · 10–15 reps</p>`;

  const ws = weekStart(today);
  const planned = DAYS.filter((_, i) => plannedRoutine(addDays(ws, i))).length;
  const trained = new Set(state.history.filter((h) => h.date >= ws && h.date <= addDays(ws, 6)).map((h) => h.date)).size;

function progReviewModal() {

  }

  const weeks = Math.max(1, daysBetween(prev.date, c.date) / 7);

  const total = kg(c) - kg(base);
  const lifts = strengthChanges(c.date);
  const up = lifts.filter((l) => l.dir > 0), down = lifts.filter((l) => l.dir < 0);
  const waistBase = [...p.checkins].filter((x) => x.waist && x.week < c.week).sort((a, b) => a.week - b.week)[0];
  const stat = (label, value, sub) => `<div class="rounded-xl bg-slate-100 p-2 text-center dark:bg-slate-800/60"><p class="text-lg font-bold tabular-nums">${value}</p><p class="text-[11px] muted">${label}</p>${sub ? `<p class="text-[10px] muted">${sub}</p>` : ''}</div>`;

  html += `<div class="grid grid-cols-3 gap-2">

  } else if (p.goalKg) html += `<p class="mt-3 text-sm font-semibold text-emerald-700 dark:text-emerald-400">You’ve reached your ${fmt(p.goalKg)} kg goal! Consider switching Food → Targets to maintain or lean gain.</p>`;

  if (lifts.length) {
    html += `<div class="mt-4"><p class="label">Strength since the start</p>
      <p class="text-sm"><b class="text-emerald-700 dark:text-emerald-400">${up.length} up</b> · ${lifts.length - up.length - down.length} same · <b class="${down.length ? 'text-rose-600 dark:text-rose-400' : ''}">${down.length} down</b></p>
      <ul class="mt-1 divide-y divide-slate-200 text-sm dark:divide-slate-800">${[...up.sort((a, b) => b.pct - a.pct), ...down].slice(0, 8).map((l) => `<li class="flex items-center justify-between gap-2 py-1.5">

  }

  const advice = [];
  if (rate < -0.75) advice.push('You’re losing faster than a slow cut (0.25–0.5 kg a week). To hold on to muscle while you build strength, add about 150 kcal a day in Food → Targets & profile.');
  else if (rate <= -0.15) advice.push('Weight loss is right in the slow-cut zone. Keep your calories as they are.');
  else if (up.length > down.length && c.waist && prev.waist && c.waist < prev.waist) advice.push('The scale is flat, but your waist is down and lifts are up: that’s recomposition. Keep going.');

  if (down.length > up.length) advice.push('More lifts went down than up. Prioritise sleep (7–9 hours), keep protein around 2 g per kg, and don’t cut calories any further for now.');

// ----- Session length & weekly recap -----
/**
 * Rough minutes for a routine on a date: each set ~3 s a rep + 10 s, the rest
 * timer after every set (almost none inside a superset), a minute to set up
 * each exercise and 5 minutes of general warm-up.
 */
function sessionMinutes(r, date, deload = isDeloadWeek(date)) {
  let secs = 5 * 60;
  r.exerciseIds.map(exById).filter(Boolean).map((ex) => routineEx(r, ex)).forEach((ex) => {
    const e = progEx(ex, date), t = targetFor(ex, deload, date);
    const rest = r.links?.[ex.id] ? 15 : e.rest || 90;
    secs += 60 + sum(t.reps.map((n) => n * 3 + 10)) + t.reps.length * rest;
  });
  return Math.round(secs / 60);
}

function minutesHtml(r, date, deload) {
  const m = sessionMinutes(r, date, deload);
  const sets = sum(r.exerciseIds.map(exById).filter(Boolean).map((ex) => targetFor(routineEx(r, ex), deload, date).reps.length));
  return `<p class="mt-1 text-sm muted">≈ <b class="text-slate-900 dark:text-slate-100">${m} min</b> · ${sets} sets</p>
    ${m > 60 ? `<p class="mt-1 rounded-lg bg-amber-500/10 px-2 py-1 text-xs text-amber-800 dark:text-amber-300">Over your hour. Shorter rests on isolation exercises (60–90 s) or pairing two into a superset will bring it down.</p>` : ''}`;
}

/** Summary of one week (Mon start): sessions, sets, volume, PRs, muscles, food and weight. */
function weekRecap(start) {
  const end = addDays(start, 6), prevStart = addDays(start, -7);
  const inWeek = (h, a, b) => h.date >= a && h.date <= b;
  const hs = state.history.filter((h) => inWeek(h, start, end));
  const prevHs = state.history.filter((h) => inWeek(h, prevStart, addDays(start, -1)));
  const workSets = (list) => sum(list.map((h) => { const ex = exById(h.exerciseId); return ex ? evaluate(ex, h.sets).working.length : 0; }));
  const days = DAYS.map((_, i) => addDays(start, i));
  const prMap = new Map(); // one line per exercise: its latest record this week
  [...hs].sort((a, b) => (a.date === b.date ? a.ts - b.ts : a.date < b.date ? -1 : 1)).forEach((h) => {
    const items = prsFor(h), name = exById(h.exerciseId)?.name;
    if (name && items.length) prMap.set(h.exerciseId, { name, items });
  });
  const prs = [...prMap.values()];
  const { out } = muscleVolume(start);
  const low = MUSCLES.filter((m) => out[m].sets > 0 && out[m].sets < SET_TARGET[0]);
  const foodDays = days.filter((d) => dayTotals(d).kcal >= 800);
  const avg = (k) => (foodDays.length ? Math.round(sum(foodDays.map((d) => dayTotals(d)[k])) / foodDays.length) : null);
  const avgTarget = (k) => (foodDays.length && state.food.targets ? Math.round(sum(foodDays.map((d) => targetsFor(d)[k])) / foodDays.length) : null);
  const w0 = trendAt(addDays(start, -1), null), w1 = trendAt(end, null);
  return {
    start, end, week: progWeek(start),
    done: new Set(hs.map((h) => h.date)).size, planned: days.filter((d) => plannedRoutine(d)).length,
    sets: workSets(hs), prevSets: workSets(prevHs),
    kg: sum(hs.map(kgLifted)), prevKg: sum(prevHs.map(kgLifted)),
    prs, low, foodDays: foodDays.length, kcal: avg('kcal'), kcalT: avgTarget('kcal'), protein: avg('protein'), proteinT: avgTarget('protein'),
    weight: w1, weightChange: w0 !== null && w1 !== null && Object.keys(state.food.weights).some((d) => d >= start && d <= end) ? w1 - w0 : null,
  };
}

    ${r.prs.length ? `<p class="mt-2 text-sm"><span class="font-semibold text-amber-700 dark:text-amber-300">🏆 ${r.prs.length} PR${r.prs.length === 1 ? '' : 's'}:</span> ${r.prs.slice(0, 5).map((x) => `${esc(x.name)} (${x.items.join(', ')})`).join(' · ')}</p>` : ''}
    ${r.low.length && !(r.week && isDeloadWeek(start)) ? `<p class="mt-2 text-sm muted">Under ${SET_TARGET[0]} sets: ${r.low.join(', ')}</p>` : ''}

// ----- Muscle balance (planned sets) -----
/** Working sets per muscle the weekly plan will give you (secondary muscles count ½). */
/**
 * Planned working sets per muscle for a week. typical = the repeating weekly schedule
 * (ignores one-off day changes). Also returns, per muscle, which exercises the sets come from.
 */
/** The one muscle an exercise mainly trains: the library's first main muscle when the name matches, else the first one you marked as main. */
function mainMuscle(ex) {
  const lib = LIBRARY.find((it) => normName(it.name) === normName(ex.name));
  const pick = (mus) => MUSCLES.find((m) => mus?.[m] === 1);
  if (lib) { const libMain = (lib.muscles && Object.keys(lib.muscles).find((m) => lib.muscles[m] === 1)); if (libMain && ex.muscles?.[libMain]) return libMain; }
  return pick(ex.muscles) || null;
}

function plannedVolume(start, typical = false, direct = false) {
  const out = Object.fromEntries(MUSCLES.map((m) => [m, 0])), from = Object.fromEntries(MUSCLES.map((m) => [m, []])), days = [];
  DAYS.forEach((name, i) => {
    const d = addDays(start, i), r = typical ? routineById(state.schedule.weekly[i]) : plannedRoutine(d);
    if (!r) return;
    days.push(`${name} ${r.name.replace(/^\d+\s*·\s*/, '')}`);
    r.exerciseIds.map(exById).filter(Boolean).forEach((ex) => {
      const n = targetFor(routineEx(r, ex), isDeloadWeek(d), d).reps.length;
      const main = direct && mainMuscle(ex);
      Object.entries(ex.muscles || {}).forEach(([m, f]) => { if (m in out && (!direct || m === main)) { out[m] += n * (direct ? 1 : f); from[m].push({ name: ex.name, day: name, n, f: direct ? 1 : f }); } });
    });
  });
  return Object.assign(out, { [Symbol.for('from')]: from, [Symbol.for('days')]: days });
}

/** Library exercises that mainly train a muscle and aren't in your list yet (no squats or deadlifts). */
function fillers(muscle) {
  const owned = ownedNames(), order = { m: 0, machine: 0, dumbbell: 1, bodyweight: 2, barbell: 3 };
  return LIBRARY.filter((it) => it.muscles[muscle] === 1 && !owned.has(it.name.toLowerCase()) && !/squat|deadlift/i.test(it.name))
    .sort((a, b) => (order[a.type] ?? 4) - (order[b.type] ?? 4)).slice(0, 3).map((it) => it.name);
}
