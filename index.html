<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">

<script>
/* =========================================================================
   Overload Tracker — automatic progressive overload (double progression)
   ========================================================================= */

const STORE_KEY = 'pot.v1';
const SELF_CODE = document.currentScript?.textContent || ''; // used to spot newer published versions
const MAX_ROUTINES = 5;
const MUSCLES = ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Quads', 'Hamstrings', 'Glutes', 'Calves', 'Core'];
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
const SET_TARGET = [10, 20]; // weekly hard sets per muscle

/**
 * Built-in exercise library.
 * name | equipment (d = dumbbell, m = machine/cable, b = barbell) | rep range |
 * starting kg | primary muscles | secondary muscles | rest seconds (optional)
 */
const LIBRARY = `
Barbell Bench Press|b|5-8|40|Chest|Triceps,Shoulders|150
Incline Barbell Bench Press|b|6-10|35|Chest|Shoulders,Triceps|120
Dumbbell Bench Press|d|8-12|16|Chest|Triceps,Shoulders|120

Dumbbell Fly|d|10-15|8|Chest||

Incline Chest Press Machine|m|8-12|25|Chest|Shoulders,Triceps|
Pec Deck|m|10-15|25|Chest||

Deadlift|b|3-6|60|Back,Hamstrings,Glutes|Core|180
Barbell Row|b|6-10|40|Back|Biceps|120
Dumbbell Row|d|8-12|16|Back|Biceps|

Close-Grip Lat Pulldown|m|8-12|35|Back|Biceps|

Straight-Arm Pulldown|m|12-15|15|Back||

Dumbbell Shrug|d|10-15|20|Back||

Seated Dumbbell Shoulder Press|d|8-12|12|Shoulders|Triceps|
Arnold Press|d|8-12|10|Shoulders|Triceps|
Shoulder Press Machine|m|8-12|25|Shoulders|Triceps|
Dumbbell Lateral Raise|d|12-15|6|Shoulders||
Cable Lateral Raise|m|12-15|5|Shoulders||
Lateral Raise Machine|m|12-15|15|Shoulders||
Reverse Pec Deck|m|12-15|20|Shoulders|Back|
Dumbbell Rear Delt Fly|d|12-15|6|Shoulders|Back|
Face Pull|m|12-15|15|Shoulders|Back|
Barbell Curl|b|8-12|20|Biceps||
EZ-Bar Curl|b|8-12|15|Biceps||
Dumbbell Curl|d|8-12|10|Biceps||
Hammer Curl|d|8-12|10|Biceps||
Incline Dumbbell Curl|d|10-12|8|Biceps||
Preacher Curl Machine|m|10-12|20|Biceps||
Cable Curl|m|10-15|15|Biceps||
Close-Grip Bench Press|b|6-10|35|Triceps|Chest,Shoulders|120
EZ-Bar Skull Crusher|b|8-12|15|Triceps||
Tricep Pushdown|m|10-15|20|Triceps||
Overhead Cable Tricep Extension|m|10-15|15|Triceps||
Overhead Dumbbell Tricep Extension|d|10-12|12|Triceps||
Tricep Dip Machine|m|8-12|30|Triceps|Chest|
Barbell Back Squat|b|5-8|40|Quads,Glutes|Hamstrings,Core|150
Front Squat|b|5-8|30|Quads|Glutes,Core|150
Leg Press|m|10-15|80|Quads|Glutes|120
Hack Squat Machine|m|8-12|40|Quads|Glutes|120
Leg Extension|m|10-15|30|Quads||
Goblet Squat|d|10-15|16|Quads|Glutes|
Bulgarian Split Squat|d|8-12|8|Quads,Glutes||
Dumbbell Walking Lunge|d|10-12|10|Quads,Glutes||
Romanian Deadlift|b|6-10|40|Hamstrings|Glutes,Back|120
Dumbbell Romanian Deadlift|d|8-12|16|Hamstrings|Glutes|
Lying Leg Curl|m|10-15|25|Hamstrings||
Seated Leg Curl|m|10-15|30|Hamstrings||
Barbell Hip Thrust|b|8-12|40|Glutes|Hamstrings|
Hip Thrust Machine|m|8-12|40|Glutes|Hamstrings|
Hip Abduction Machine|m|12-15|30|Glutes||
Cable Glute Kickback|m|12-15|10|Glutes||
Standing Calf Raise Machine|m|10-15|40|Calves||
Seated Calf Raise|m|12-15|20|Calves||
Leg Press Calf Raise|m|12-15|60|Calves||
Cable Crunch|m|10-15|25|Core||
Ab Crunch Machine|m|10-15|25|Core||
Cable Woodchopper|m|12-15|10|Core||
Pull-up|w|5-10|0|Back|Biceps|120
Chin-up|w|5-10|0|Back,Biceps||120
Dips|w|6-12|0|Chest,Triceps|Shoulders|120
Back Extension|w|10-15|0|Hamstrings,Glutes|Back|
Push-up|r|10-20|0|Chest|Triceps,Shoulders|
Inverted Row|r|8-15|0|Back|Biceps|
Hanging Leg Raise|r|8-15|0|Core||
Assisted Pull-up Machine|a|8-12|30|Back|Biceps|
Assisted Dip Machine|a|8-12|30|Chest,Triceps||
`.trim().split('\n').map((line) => {
  const [name, t, range, start, primary, secondary, restSecs] = line.split('|');
  const [repMin, repMax] = range.split('-').map(Number);
  const muscles = {};
  secondary.split(',').filter(Boolean).forEach((m) => (muscles[m] = 0.5));
  primary.split(',').filter(Boolean).forEach((m) => (muscles[m] = 1));
  const type = { d: 'dumbbell', m: 'machine', b: 'barbell' }[t] || 'bodyweight';
  const bwMode = { w: 'weighted', r: 'reps', a: 'assisted' }[t] || 'weighted';
  const rest = Number(restSecs) || (repMax <= 8 ? 150 : repMin >= 12 ? 60 : 90);
  return { name, type, bwMode, repMin, repMax, sets: 3, startWeight: Number(start), muscles, rest };
});

// ---------- Small helpers -------------------------------------------------
const round2 = (x) => Math.round(x * 100) / 100;
const sum = (arr) => arr.reduce((a, b) => a + b, 0);
const fmt = (w) => String(round2(w));
const fmtKg = (n) => Math.round(n).toLocaleString();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

// Dates are local ISO strings (YYYY-MM-DD); weeks start on Monday.
const toISO = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const todayISO = () => toISO(new Date());
const parseISO = (iso) => new Date(iso + 'T12:00:00');
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const dow = (iso) => (parseISO(iso).getDay() + 6) % 7;
const weekStart = (iso) => addDays(iso, -dow(iso));
const fmtDate = (iso) => parseISO(iso).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const fmtShort = (iso) => parseISO(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const fmtDay = (iso) => parseISO(iso).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });
const fmtSecs = (s) => `${Math.floor(s / 60)}:${String(Math.max(0, s % 60)).padStart(2, '0')}`;

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.style.opacity = '0'), 2600);
}

// ---------- Equipment & rounding ----------------------------------------

// Bodyweight exercises come in three kinds: extra weight added (belt/vest),
// reps only, or an assisted machine where *less* assistance is progress.
const isBW = (ex) => ex.type === 'bodyweight';
const isAssisted = (ex) => isBW(ex) && ex.bwMode === 'assisted';
const repsOnly = (ex) => isBW(ex) && ex.bwMode === 'reps';
/** Is load a harder than load b? */
const harder = (ex, a, b) => (isAssisted(ex) ? a < b : a > b);

/** Smallest realistic load jump for this exercise's equipment. */
function stepFor(ex) {
  if (ex.type === 'dumbbell') return 2;
  if (ex.type === 'machine' || isAssisted(ex)) return ex.machineStep === 3 ? 3 : 4;
  if (repsOnly(ex)) return 0;
  return 2.5; // barbell / plates, or weight added to a bodyweight exercise
}

/** Round a weight to the nearest equipment step (never negative). */
function roundToStep(weight, ex) {
  const step = stepFor(ex);
  return step ? round2(Math.max(0, Math.round(weight / step) * step)) : round2(Math.max(0, weight));
}

function eqLabel(ex) {
  if (ex.type === 'machine') return `Machine · ${stepFor(ex)}kg steps`;
  if (ex.type === 'dumbbell') return 'Dumbbell · 2kg steps';
  if (isAssisted(ex)) return `Assisted machine · ${stepFor(ex)}kg steps`;
  if (repsOnly(ex)) return 'Bodyweight · reps';
  if (isBW(ex)) return 'Bodyweight · add 2.5kg steps';
  return 'Barbell · 2.5kg steps';
}

/** How to show a load: "60 kg", "Bodyweight", "BW + 5 kg" or "25 kg assist". */
function loadLabel(ex, w) {
  if (repsOnly(ex)) return 'Bodyweight';
  if (isAssisted(ex)) return w > 0 ? `${fmt(w)} kg assist` : 'No assistance';
  if (isBW(ex)) return w > 0 ? `BW + ${fmt(w)} kg` : 'Bodyweight';
  return `${fmt(w)} kg`;
}

function muscleLabel(ex) {
  const entries = Object.entries(ex.muscles || {});
  if (!entries.length) return '';
  return entries.sort((a, b) => b[1] - a[1]).map(([m, f]) => (f < 1 ? `${m} (½)` : m)).join(' · ');
}

// ---------- Progressive overload engine ----------------------------------

/** Normalise logged sets: numeric weight/reps, drop empty rows. */
function cleanSets(sets, fallbackWeight = NaN) {
  return sets
    .map((s) => {
      const w = s.weight === '' || s.weight == null ? fallbackWeight : parseFloat(s.weight);
      return { weight: round2(w), reps: parseInt(s.reps, 10) };
    })
    .filter((s) => Number.isFinite(s.weight) && s.weight >= 0 && s.reps > 0);
}

/**
 * Evaluate one session. Working sets = the sets done at the heaviest weight
 * (lighter sets are treated as warm-ups).
 */
function evaluate(ex, sets) {
  const loads = sets.map((s) => s.weight);
  const top = isAssisted(ex) ? Math.min(...loads) : Math.max(...loads); // hardest load
  const working = sets.filter((s) => s.weight === top);
  const reps = working.map((s) => s.reps);
  const total = sum(reps);
  const enoughSets = working.length >= ex.sets;
  const hitCeiling = enoughSets && reps.every((r) => r >= ex.repMax);
  return { top, working, reps, total, enoughSets, hitCeiling };
}

/** Sessions for an exercise, newest first. */
function sessionsFor(exId) {
  return state.history
    .filter((h) => h.exerciseId === exId && h.sets.length)
    .sort((a, b) => (b.date === a.date ? b.ts - a.ts : b.date < a.date ? -1 : 1));
}

/**
 * Next Session Predictor — Double Progression.
 * Rule 1: every working set hit the top of the rep range → add the smallest
 *         equipment increment, reset reps to the bottom of the range.
 * Rule 2: otherwise keep the weight and beat last session's rep total by ≥ 1.
 */
function predict(ex) {
  const last = sessionsFor(ex.id)[0];
  const step = stepFor(ex);

  if (!last) {
    const reps = Array(ex.sets).fill(ex.repMin);
    return {
      rule: 'start', weight: roundToStep(ex.startWeight || 0, ex), reps, total: sum(reps), last: null,
      reason: `First session. Start at ${ex.repMin} reps per set and build towards ${ex.repMax}.`,
    };
  }

  const ev = evaluate(ex, last.sets);

  const canStepUp = !repsOnly(ex) && !(isAssisted(ex) && ev.top <= 0);
  if (ev.hitCeiling && canStepUp) {
    const reps = Array(ex.sets).fill(ex.repMin);
    const weight = isAssisted(ex) ? round2(Math.max(0, roundToStep(ev.top, ex) - step)) : round2(roundToStep(ev.top, ex) + step);
    return {
      rule: 'up', weight, reps, total: sum(reps), last, ev,
      reason: `You hit ${ex.repMax} reps on all ${ev.working.length} working sets at ${loadLabel(ex, ev.top)}. ${isAssisted(ex) ? `Assistance −${fmt(step)} kg` : `Weight +${fmt(step)} kg`}, reps reset to ${ex.repMin}.`,
    };
  }

  // Rule 2: same weight, beat the previous rep total by at least one rep.
  const reps = ev.reps.slice();
  while (reps.length < ex.sets) reps.push(ex.repMin); // finish the missing working sets
  if (sum(reps) <= ev.total) {
    // Add one rep to the weakest set that still has room under the ceiling.
    let idx = -1;
    reps.forEach((r, i) => { if (r < ex.repMax && (idx === -1 || r < reps[idx])) idx = i; });
    if (idx === -1) idx = reps.length - 1;
    reps[idx] += 1;
  }
  const total = Math.max(sum(reps), ev.total + 1);

  let reason = `Not every set reached ${ex.repMax}. Keep ${loadLabel(ex, ev.top)} and beat last session's ${ev.total} total reps (aim for ${total}+).`;
  if (ev.hitCeiling && repsOnly(ex)) reason = `You hit the top of the range on every set. Keep adding reps (aim for ${total}+), or move to a harder variation.`;
  else if (ev.hitCeiling) reason = `You’re doing it with no assistance. Keep adding reps (aim for ${total}+), or switch this exercise to “Add weight”.`;
  else if (!ev.enoughSets && !repsOnly(ex)) reason += ` Complete all ${ex.sets} working sets to unlock ${isAssisted(ex) ? 'less assistance' : 'a weight increase'}.`;
  const belowRange = ev.reps.every((r) => r < ex.repMin);

  return { rule: 'reps', weight: ev.top, reps, total, last, ev, reason, belowRange };
}

/**
 * Plateau: the last 3 sessions each failed to progress on the one before
 * (no heavier weight, and no extra reps at the same weight). A logged deload
 * resets the count.
 */
function plateau(ex) {
  const ss = sessionsFor(ex.id);
  if (ss.length < 4) return null;
  for (let i = 0; i < 3; i++) {
    if (ss[i].deload) return null;
    const a = evaluate(ex, ss[i].sets), b = evaluate(ex, ss[i + 1].sets);
    if (harder(ex, a.top, b.top) || (a.top === b.top && a.total > b.total)) return null;
  }
  const at = evaluate(ex, ss[0].sets).top;
  if (repsOnly(ex) || (isBW(ex) && !isAssisted(ex) && at <= 0)) return null; // nothing to take off
  if (isAssisted(ex)) return { at, weight: roundToStep(Math.max(at * 1.1, at + stepFor(ex)), ex) }; // a bit more help
  let weight = roundToStep(at * 0.9, ex);
  if (weight >= at) weight = round2(Math.max(0, at - stepFor(ex)));
  return { at, weight };
}

// ---------- Records ------------------------------------------------------

/** Estimated one-rep max (Epley). */
const e1rm = (s) => (s.reps === 1 ? s.weight : s.weight * (1 + s.reps / 30));
const bestE1 = (sets) => Math.max(0, ...sets.map(e1rm));
const topWeight = (sets) => Math.max(0, ...sets.map((s) => s.weight));
const tonnage = (sets) => sum(sets.map((s) => s.weight * s.reps));

/** Which records a logged session set, compared with everything before it. */
function prsFor(h) {
  const earlier = state.history.filter((x) => x.exerciseId === h.exerciseId && x.id !== h.id &&
    (x.date < h.date || (x.date === h.date && x.ts < h.ts)));
  if (!earlier.length) return [];
  const ex = exById(h.exerciseId);
  if (ex && isBW(ex)) {
    // Bodyweight: most reps at this load or harder, and the hardest load so far.
    const top = evaluate(ex, h.sets).top;
    const best = Math.max(...h.sets.filter((s) => s.weight === top).map((s) => s.reps));
    const prevSets = earlier.flatMap((x) => x.sets);
    const comparable = prevSets.filter((s) => !harder(ex, top, s.weight)); // earlier sets at this load or harder
    const out = [];
    if (!repsOnly(ex) && !comparable.length) out.push(isAssisted(ex) ? `Least assistance: ${fmt(top)} kg` : `Most added: ${fmt(top)} kg`);
    else if (best > Math.max(...comparable.map((s) => s.reps))) out.push(`Most reps: ${best}`);
    return out;
  }
  const prevE1 = Math.max(...earlier.map((x) => bestE1(x.sets)));
  const prevW = Math.max(...earlier.map((x) => topWeight(x.sets)));
  const out = [];
  if (topWeight(h.sets) > prevW) out.push(`Heaviest: ${fmt(topWeight(h.sets))} kg`);
  if (bestE1(h.sets) > prevE1 + 0.01) out.push(`Est. 1RM: ${fmt(Math.round(bestE1(h.sets) * 10) / 10)} kg`);
  return out;
}

// ---------- Warm-ups & plates ------------------------------------------

/** Plates to load on EACH side of the bar for a total barbell weight. */
function platesFor(total) {
  const bar = state.settings.barWeight;
  let side = round2((total - bar) / 2);
  if (side < 0) return { text: `Lighter than the ${fmt(bar)} kg bar`, ok: false };
  if (side === 0) return { text: 'Empty bar', ok: true };
  const used = [];
  for (const p of PLATES) {
    while (side >= p - 0.001) { used.push(p); side = round2(side - p); }
  }
  return { text: used.map(fmt).join(' + ') + (side > 0.01 ? ` (+${fmt(side)} kg not loadable)` : ''), ok: side <= 0.01 };
}

/** Ramp-up sets before the working weight. */
function warmupsFor(ex, work) {
  const out = [];
  if (!(work > 0) || isBW(ex)) return out;
  const bar = state.settings.barWeight;
  if (ex.type === 'barbell' && work > bar) out.push({ weight: bar, reps: 10 });
  for (const [pct, reps] of [[0.5, 8], [0.7, 5], [0.85, 3]]) {
    const w = roundToStep(work * pct, ex);
    const prev = out[out.length - 1];
    if (w > 0 && w < work && (!prev || w > prev.weight) && !(ex.type === 'barbell' && w <= bar)) out.push({ weight: w, reps });
  }
  return out;
}

// ---------- State & persistence -----------------------------------------
function seedState() {
  const ex = (name, type, repMin, repMax, sets, startWeight, muscles, rest, machineStep = 4) =>

  const exercises = [

    ex('Dumbbell Bench Press', 'dumbbell', 8, 12, 3, 20, { Chest: 1, Triceps: 0.5, Shoulders: 0.5 }, 120),
    ex('Lat Pulldown', 'machine', 8, 12, 3, 45, { Back: 1, Biceps: 0.5 }, 90, 3),
    ex('Leg Press', 'machine', 10, 15, 3, 100, { Quads: 1, Glutes: 0.5 }, 120, 4),
  ];
  return {
    exercises,
    history: [],
    routines: [{ id: uid(), name: 'Full Body', exerciseIds: exercises.map((e) => e.id) }],
    schedule: { weekly: {}, overrides: {} },
    settings: { barWeight: 20 },

}

const emptyFood = () => ({
  profile: null, targets: null, foods: {}, log: {}, favs: [], weights: {}, water: {}, meals: [], checkins: [],
  prefs: { trainingOn: false, trainingGap: 200, water: 2500 },
});

/** Accepts saved data from any version of the app and fills in new fields. */
function migrate(d) {
  return {
    exercises: (d.exercises || []).map((e) => ({ muscles: {}, rest: 90, machineStep: 4, bwMode: 'weighted', ...e })),
    history: d.history || [],
    routines: d.routines || [],
    schedule: { weekly: d.schedule?.weekly || {}, overrides: d.schedule?.overrides || {} },
    settings: { barWeight: 20, ...(d.settings || {}) },
    food: { ...emptyFood(), ...(d.food || {}), prefs: { ...emptyFood().prefs, ...(d.food?.prefs || {}) } },
    draft: d.draft ? { routineId: null, ...d.draft, entries: d.draft.entries.map((en) => ({ note: '', rpe: '', deload: false, showWarmup: false, ...en })) } : null,
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { /* fall through to seed */ }
  return seedState();
}

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast('Could not save to this browser’s storage'); }
}

// ---------- Schedule -----------------------------------------------------

/** The routine planned for a date: a one-off override wins over the weekly plan. */
function plannedRoutine(date) {
  const o = state.schedule.overrides[date];
  const id = o !== undefined ? (o === 'rest' ? null : o) : state.schedule.weekly[dow(date)];
  return id ? routineById(id) || null : null;
}

/** Set a one-off plan for a date; drops the override when it matches the weekly plan. */
function setDayPlan(date, routineId) {
  const weekly = routineById(state.schedule.weekly[dow(date)])?.id || null;
  if ((routineId || null) === weekly) delete state.schedule.overrides[date];
  else state.schedule.overrides[date] = routineId || 'rest';
}

function dayStatus(date) {
  const done = state.history.some((h) => h.date === date);
  const r = plannedRoutine(date);
  if (done) return 'done';
  if (r && date < todayISO()) return 'missed';
  if (r) return 'planned';
  return 'rest';
}

// ---------- Draft workout ------------------------------------------------
function ensureDraft() {
  if (!state.draft) state.draft = { date: todayISO(), routineId: null, entries: [], startedAt: Date.now() };
  return state.draft;
}

function addEntry(exId) {
  const ex = exById(exId);
  if (!ex) return;
  const p = predict(ex);
  ensureDraft().entries.push({
    exerciseId: exId,
    sets: p.reps.map(() => ({ weight: String(p.weight), reps: '' })),
    note: '', rpe: '', deload: false, showWarmup: false,
  });
}

function startRoutine(id, date = todayISO()) {
  const r = routineById(id);
  if (!r) return;
  state.draft = { date, routineId: id, entries: [], startedAt: Date.now() };
  r.exerciseIds.forEach(addEntry);
  view = 'today';
}

// ---------- Rest timer ---------------------------------------------------
let rest = null; // { end, total, label, alerted }
let audioCtx = null;

function startRest(seconds, label) {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume?.();
  } catch (e) { /* audio is optional */ }
  rest = { end: Date.now() + seconds * 1000, total: seconds, label, alerted: false };
  tickRest();
}

function beep() {
  if (!audioCtx) return;
  try {
    const t0 = audioCtx.currentTime;
    [0, 0.25, 0.5].forEach((t) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0 + t);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + 0.18);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + t);
      o.stop(t0 + t + 0.2);
    });
  } catch (e) { /* ignore */ }
}

function tickRest() {
  const box = document.getElementById('rest-timer');
  if (!rest) { box.classList.add('hidden'); return; }
  const left = Math.max(0, Math.ceil((rest.end - Date.now()) / 1000));
  box.classList.remove('hidden');
  document.getElementById('rest-label').textContent = left ? `Rest · ${rest.label}` : 'Rest over — next set!';
  document.getElementById('rest-time').textContent = fmtSecs(left);
  document.getElementById('rest-bar').style.width = `${Math.min(100, (left / rest.total) * 100)}%`;
  if (!left && !rest.alerted) {
    rest.alerted = true;
    navigator.vibrate?.([250, 120, 250, 120, 250]);
    beep();
    const done = rest;
    setTimeout(() => { if (rest === done) { rest = null; tickRest(); } }, 6000);
  }
}
setInterval(tickRest, 250);

}
const setsText = (ex, sets, sep = ', ') => sets.map((s) => setText(ex, s)).join(sep);

function lastLine(p, ex) {

function entryCard(entry, i) {
  const ex = exById(entry.exerciseId);

  const p = predict(ex);

      <p class="font-semibold text-amber-800 dark:text-amber-300">⚠ Plateau: no progress for 3 sessions at ${loadLabel(ex, stall.at)}</p>
      <p class="mt-0.5 text-slate-700 dark:text-slate-300">${isAssisted(ex) ? 'A little more assistance' : 'A ~10% deload'} (<b>${loadLabel(ex, stall.weight)}</b>) lets you build momentum and push past it.</p>

  } else if (entry.deload && stall) {
    stallHtml = `<div class="mt-3 flex items-center justify-between gap-2 rounded-xl bg-amber-500/10 p-3 text-sm">
      <span class="text-amber-800 dark:text-amber-300">Deload applied: ${loadLabel(ex, stall.weight)}. Build back up from here.</span>

  return `<article class="card mb-4" data-entry="${i}">

        </button>
        <button class="icon-btn" data-action="remove-entry" data-e="${i}" aria-label="Remove exercise">${ICON_X}</button>

    </div>

      </div>
      <p class="mt-1 text-3xl font-extrabold tabular-nums">${loadLabel(ex, p.weight)} <span class="text-xl font-bold text-slate-500 dark:text-slate-400">× ${p.reps.join(' / ')}</span></p>

      ${lastLine(p, ex)}

    </div>
    ${stallHtml}

    ${isBW(ex) ? '' : `<button class="link mt-3" data-action="toggle-warmup" data-e="${i}">${entry.showWarmup ? '▾' : '▸'} Warm-up${ex.type === 'barbell' ? ' & plates' : ' sets'}</button>`}
    <div id="warm-${i}">${warmupHtml(entry, ex, p, stall)}</div>

    <div class="mt-3 grid grid-cols-[1.75rem_1fr_1fr_2.75rem_2.25rem] gap-2 px-1 text-[11px] font-semibold uppercase tracking-wide muted">

      <input class="input py-2 text-sm" data-entry-field="note" data-e="${i}" maxlength="140" placeholder="Note (seat height, grip, how it felt…)" value="${esc(entry.note)}">

}

/** Small trend line of the last few sessions: est. 1RM, or best-set reps for bodyweight. */
function sparkHtml(ex) {
  const ss = sessionsFor(ex.id).slice(0, 8).reverse();
  if (ss.length < 2) return '';
  const bw = isBW(ex);
  const vals = ss.map((h) => (bw ? Math.max(...evaluate(ex, h.sets).reps) : round1(bestE1(h.sets))));
  const lo = Math.min(...vals), hi = Math.max(...vals), W = 84, H = 24;
  const pts = vals.map((v, k) => [round2((k / (vals.length - 1)) * (W - 4) + 2), round2(hi === lo ? H / 2 : H - 3 - ((v - lo) / (hi - lo)) * (H - 6))]);
  const [lx, ly] = pts[pts.length - 1];
  const strong = (t) => `<b class="text-slate-700 dark:text-slate-200">${t}</b>`;
  return `<div class="mt-2 flex items-center gap-2 text-xs muted">
    <svg viewBox="0 0 ${W} ${H}" class="h-6 w-20 shrink-0 overflow-visible" aria-hidden="true">
      <polyline points="${pts.map((q) => q.join(',')).join(' ')}" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${lx}" cy="${ly}" r="2.5" fill="#6366f1"/>
    </svg>
    <span>${bw ? `Best set: ${vals[0]} → ${strong(`${vals[vals.length - 1]} reps`)}` : `Est. 1RM: ${fmt(vals[0])} → ${strong(`${fmt(vals[vals.length - 1])} kg`)}`} · last ${vals.length} sessions</span>
  </div>`;
}

function targetReps(p, ex, j) {
  return p.reps[j] ?? p.reps[p.reps.length - 1] ?? ex.repMin;
}

function setRow(i, j, s, p, ex) {
  const done = parseInt(s.reps, 10) > 0;
  return `<div class="set-row ${done ? 'done' : ''}" id="row-${i}-${j}">
    <span class="text-center font-bold muted">${j + 1}</span>
    ${repsOnly(ex) ? '<span class="input text-center text-sm font-semibold muted" aria-label="Bodyweight">BW</span>'
      : `<input class="input text-center text-lg font-semibold tabular-nums" type="number" inputmode="decimal" step="any" min="0"
      data-field="weight" data-e="${i}" data-s="${j}" value="${esc(s.weight)}" placeholder="${fmt(p.weight)}" aria-label="Set ${j + 1} ${isAssisted(ex) ? 'assistance' : 'weight'}">`}
    <input class="input text-center text-lg font-semibold tabular-nums" type="number" inputmode="numeric" step="1" min="0"
      data-field="reps" data-e="${i}" data-s="${j}" value="${esc(s.reps)}" placeholder="${targetReps(p, ex, j)}" aria-label="Set ${j + 1} reps">
    <button class="check" data-action="fill-set" data-e="${i}" data-s="${j}" aria-label="Mark set ${j + 1} done">✓</button>
    <button class="icon-btn h-9 w-9" data-action="remove-set" data-e="${i}" data-s="${j}" aria-label="Remove set ${j + 1}">
      <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
  </div>`;
}

function progressHtml(entry, ex, p) {
  const sets = cleanSets(entry.sets, p.weight);
  if (!sets.length) return `<span class="muted">Goal: <b class="text-slate-900 dark:text-slate-100">${p.total}</b> reps</span>`;
  const ev = evaluate(ex, sets);
  if (ev.hitCeiling) {
    return `<span class="font-semibold text-emerald-700 dark:text-emerald-400">Ceiling hit → +${fmt(stepFor(ex))} kg next</span>`;
  }
  const sameWeight = ev.top === p.weight;
  const beat = sameWeight && ev.total >= p.total;
  const colour = beat ? 'text-emerald-700 dark:text-emerald-400' : 'text-slate-900 dark:text-slate-100';
  return `<span class="muted">@ ${loadLabel(ex, ev.top)}: </span><b class="tabular-nums ${colour}">${ev.total}</b>${sameWeight ? `<span class="muted"> / ${p.total} reps</span>` : '<span class="muted"> reps</span>'}`;
}

// ----- Stats tab -----
const kgLifted = (h) => (isBW(exById(h.exerciseId) || {}) ? 0 : tonnage(h.sets)); // bodyweight/assist kg isn't load moved

function weekVolume(start) {
  const end = addDays(start, 6);
  return sum(state.history.filter((h) => h.date >= start && h.date <= end).map(kgLifted));
}

function muscleVolume(start) {
  const end = addDays(start, 6);
  const out = Object.fromEntries(MUSCLES.map((m) => [m, { sets: 0, kg: 0 }]));
  let untagged = 0;
  state.history.filter((h) => h.date >= start && h.date <= end).forEach((h) => {
    const ex = exById(h.exerciseId);
    if (!ex) return;
    const ev = evaluate(ex, h.sets);
    const n = ev.working.length, kg = isBW(ex) ? 0 : tonnage(ev.working);
    const ms = Object.entries(ex.muscles || {});
    if (!ms.length) { untagged += n; return; }
    ms.forEach(([m, f]) => { if (out[m]) { out[m].sets += n * f; out[m].kg += kg * f; } });
  });
  return { out, untagged };
}

function weekStreak() {
  const weeks = new Set(state.history.map((h) => weekStart(h.date)));
  let w = weekStart(todayISO());
  if (!weeks.has(w)) w = addDays(w, -7); // this week isn't over yet
  let n = 0;
  while (weeks.has(w)) { n++; w = addDays(w, -7); }
  return n;
}

function statsView() {
  if (!state.history.length) {
    return `<h2 class="mb-4 text-2xl font-bold">Stats</h2>` +
      emptyState('No data yet', 'Log your first workout and your progress, volume and records will show up here.', 'Start a workout', 'goto-today');
  }
  const thisWeek = weekStart(todayISO());
  const weekDates = DAYS.map((_, i) => addDays(thisWeek, i));
  const doneDays = weekDates.filter((d) => state.history.some((h) => h.date === d)).length;
  const plannedDays = weekDates.filter((d) => plannedRoutine(d)).length;
  const since = addDays(todayISO(), -30);
  const prCount = state.history.filter((h) => h.date >= since && prsFor(h).length).length;

  const tile = (label, value, sub) => `<div class="tile">
    <p class="text-xs font-semibold uppercase tracking-wide muted">${label}</p>
    <p class="mt-1 text-2xl font-extrabold tabular-nums">${value}</p>
    <p class="text-xs muted">${sub}</p>
  </div>`;

  let html = `<h2 class="mb-4 text-2xl font-bold">Stats</h2>
  <section class="mb-4 grid grid-cols-2 gap-3">
    ${tile('This week', `${doneDays}${plannedDays ? `<span class="text-base font-bold muted"> / ${plannedDays}</span>` : ''}`, plannedDays ? 'workouts done / planned' : 'workout days')}
    ${tile('Streak', weekStreak(), 'weeks in a row')}
    ${tile('Volume', fmtKg(weekVolume(thisWeek)), 'kg lifted this week')}
    ${tile('Records', prCount, 'PR sessions, last 30 days')}
  </section>`;

  // Weekly sets per muscle
  const { out, untagged } = muscleVolume(statsWeek);
  const maxSets = Math.max(25, ...Object.values(out).map((v) => v.sets));
  const pct = (v) => `${(v / maxSets) * 100}%`;
  html += `<section class="card mb-4">
    <h3 class="font-semibold">Weekly sets per muscle</h3>
    <p class="text-xs muted">Working sets · secondary muscles count ½ · shaded band = ${SET_TARGET[0]}–${SET_TARGET[1]} sets, a common growth target</p>
    <div class="my-3 flex items-center justify-between">
      <button class="icon-btn text-2xl" data-action="stats-week" data-dir="-1" aria-label="Previous week">‹</button>
      <span class="text-sm font-semibold">${statsWeek === thisWeek ? 'This week' : `${fmtShort(statsWeek)} – ${fmtShort(addDays(statsWeek, 6))}`}</span>
      <button class="icon-btn text-2xl" data-action="stats-week" data-dir="1" ${statsWeek >= thisWeek ? 'disabled' : ''} aria-label="Next week">›</button>
    </div>
    <div class="space-y-2.5">
      ${MUSCLES.map((m) => {
        const v = out[m];
        const status = v.sets === 0 ? '—' : v.sets < SET_TARGET[0] ? 'Low' : v.sets <= SET_TARGET[1] ? 'On target' : 'High';
        return `<div class="grid grid-cols-[5.5rem_1fr_4.5rem] items-center gap-2" title="${m}: ${fmt(v.sets)} sets, ${fmtKg(v.kg)} kg">
          <span class="text-sm font-medium">${m}</span>
          <div class="relative h-5">
            <div class="absolute inset-y-0 rounded bg-slate-200/70 dark:bg-slate-800" style="left:${pct(SET_TARGET[0])};width:${pct(SET_TARGET[1] - SET_TARGET[0])}"></div>
            <div class="absolute inset-y-1 left-0 rounded-r-[4px] bg-indigo-500" style="width:${v.sets ? pct(v.sets) : '0'}"></div>
          </div>
          <span class="text-right text-xs leading-tight"><b class="tabular-nums">${fmt(v.sets)}</b> <span class="muted">sets</span><br><span class="muted">${status}</span></span>
        </div>`;
      }).join('')}
    </div>
    ${untagged ? `<p class="mt-3 text-xs muted">${fmt(untagged)} sets came from exercises with no muscles tagged. Tag them in Exercises.</p>` : ''}
  </section>`;

  // Weekly volume trend (8 weeks)
  const weeks = Array.from({ length: 8 }, (_, k) => addDays(thisWeek, -7 * (7 - k)));
  const vols = weeks.map(weekVolume);
  const maxVol = Math.max(1, ...vols);
  html += `<section class="card mb-4" data-chart="bars">
    <h3 class="font-semibold">Total volume per week</h3>
    <p class="text-sm muted" data-readout>Week of ${fmtShort(weeks[7])}: <b class="text-slate-900 dark:text-slate-100">${fmtKg(vols[7])} kg</b></p>
    <div class="mt-3 flex h-36 items-end gap-2 border-b border-slate-200 dark:border-slate-800">
      ${weeks.map((w, k) => `<button class="flex h-full flex-1 items-end justify-center" data-action="bar" data-readout="Week of ${fmtShort(w)}: <b class='text-slate-900 dark:text-slate-100'>${fmtKg(vols[k])} kg</b>" aria-label="Week of ${fmtShort(w)}: ${fmtKg(vols[k])} kg">
        <span class="block w-full max-w-[24px] rounded-t-[4px] ${vols[k] ? 'bg-indigo-500' : 'bg-slate-300 dark:bg-slate-700'}" style="height:${vols[k] ? Math.max(3, (vols[k] / maxVol) * 100) : 2}%"></span>
      </button>`).join('')}
    </div>
    <div class="mt-1 flex gap-2 text-center text-[10px] muted">${weeks.map((w) => `<span class="flex-1">${fmtShort(w).replace(' ', ' ')}</span>`).join('')}</div>
  </section>`;

  // Per-exercise progress
  const logged = state.exercises.filter((e) => sessionsFor(e.id).length);
  if (!statsExId || !logged.some((e) => e.id === statsExId)) statsExId = logged[0]?.id || null;
  const ex = exById(statsExId);
  if (ex) {
    const ss = sessionsFor(ex.id).slice().reverse();
    const bw = isBW(ex);
    const pts = ss.map((h) => {
      const ev = evaluate(ex, h.sets);
      return { date: h.date, v: bw ? Math.max(...ev.reps) : Math.round(bestE1(h.sets) * 10) / 10, top: ev };
    });
    const first = pts[0].v, lastV = pts[pts.length - 1].v;
    const change = first ? ((lastV - first) / first) * 100 : 0;
    const best = Math.max(...pts.map((p) => p.v));
    const tops = ss.map((h) => evaluate(ex, h.sets).top);
    const hardest = isAssisted(ex) ? Math.min(...tops) : Math.max(...tops);
    const bestSet = bw
      ? ss.flatMap((h) => h.sets).reduce((b, s) => (harder(ex, s.weight, b.weight) || (s.weight === b.weight && s.reps > b.reps) ? s : b))
      : ss.flatMap((h) => h.sets).reduce((b, s) => (s.weight * s.reps > b.weight * b.reps ? s : b));
    html += `<section class="card mb-4">
      <h3 class="font-semibold">Exercise progress</h3>
      <p class="mb-3 text-xs muted">${bw ? 'Most reps in a working set, per session.' : 'Estimated 1-rep max per session (Epley formula).'} Tap the chart for details.</p>
      <select class="input mb-3" data-action="stats-ex">${logged.map((e) => `<option value="${e.id}" ${e.id === ex.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select>
      ${pts.length > 1 ? lineChart(pts, ex) : '<p class="rounded-xl bg-slate-100 p-4 text-center text-sm muted dark:bg-slate-800/60">Log one more session to see a trend line.</p>'}
      <div class="mt-4 grid grid-cols-2 gap-3 text-sm">

  }

}

/** Single-series line chart (inline SVG) with a tap/hover tooltip. */
function lineChart(points, ex) {
  const bw = ex && isBW(ex);
  const W = 340, H = 190, pl = 40, pr = 14, pt = 14, pb = 24;
  const vs = points.map((p) => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = (hi - lo) * 0.15 || Math.max(2, hi * 0.05);
  lo = Math.max(0, lo - pad); hi += pad;
  const raw = (hi - lo) / 3;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const ticks = [];
  for (let t = lo; t <= hi + 1e-9; t += step) ticks.push(round2(t));

  const t0 = parseISO(points[0].date).getTime(), t1 = parseISO(points[points.length - 1].date).getTime();
  const x = (d) => pl + (t1 === t0 ? (W - pl - pr) / 2 : ((parseISO(d).getTime() - t0) / (t1 - t0)) * (W - pl - pr));
  const y = (v) => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const xy = points.map((p) => ({ x: round2(x(p.date)), y: round2(y(p.v)),
    label: `<b>${fmt(p.v)}${bw ? ' reps</b> best set' : ' kg</b> est. 1RM'}<br><span class='opacity-80'>${fmtShort(p.date)} · ${ex ? loadLabel(ex, p.top.top) : `${fmt(p.top.top)} kg`} × ${p.top.reps.join('/')}</span>` }));
  const path = xy.map((p, k) => `${k ? 'L' : 'M'}${p.x},${p.y}`).join(' ');
  const lastP = xy[xy.length - 1];

  return `<div class="relative" data-chart="line" data-w="${W}" data-h="${H}" data-points="${esc(JSON.stringify(xy))}">
    <svg viewBox="0 0 ${W} ${H}" class="h-auto w-full touch-none select-none overflow-visible" role="img" aria-label="Estimated 1RM trend">
      ${ticks.map((t) => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" class="stroke-slate-200 dark:stroke-slate-800" stroke-width="1"/>
        <text x="${pl - 6}" y="${y(t) + 3.5}" text-anchor="end" font-size="10" class="fill-slate-500 dark:fill-slate-400">${fmt(t)}</text>`).join('')}
      <text x="${pl}" y="${H - 6}" font-size="10" class="fill-slate-500 dark:fill-slate-400">${fmtShort(points[0].date)}</text>
      <text x="${W - pr}" y="${H - 6}" font-size="10" text-anchor="end" class="fill-slate-500 dark:fill-slate-400">${fmtShort(points[points.length - 1].date)}</text>
      <line data-cross x1="0" x2="0" y1="${pt}" y2="${H - pb}" class="stroke-slate-400 dark:stroke-slate-500" stroke-width="1" visibility="hidden"/>
      <path d="${path}" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${xy.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#6366f1" class="stroke-white dark:stroke-slate-900" stroke-width="2"/>`).join('')}
      <circle data-focus r="6" fill="#6366f1" class="stroke-white dark:stroke-slate-900" stroke-width="2" visibility="hidden"/>
      <text x="${Math.min(lastP.x, W - pr)}" y="${lastP.y - 10}" text-anchor="end" font-size="11" font-weight="700" class="fill-slate-900 dark:fill-slate-100">${fmt(points[points.length - 1].v)}</text>
    </svg>
    <div data-tip class="pointer-events-none absolute z-10 hidden -translate-x-1/2 -translate-y-full whitespace-nowrap rounded-lg bg-slate-900 px-2.5 py-1.5 text-xs text-white shadow-lg dark:bg-slate-100 dark:text-slate-900"></div>
  </div>`;
}

function attachCharts() {
  document.querySelectorAll('[data-chart=line]').forEach((wrap) => {
    const pts = JSON.parse(wrap.dataset.points);
    const W = +wrap.dataset.w, H = +wrap.dataset.h;
    const svg = wrap.querySelector('svg'), tip = wrap.querySelector('[data-tip]');
    const focus = svg.querySelector('[data-focus]'), cross = svg.querySelector('[data-cross]');
    const show = (e) => {
      const rect = svg.getBoundingClientRect();
      const vx = ((e.clientX - rect.left) / rect.width) * W;
      const p = pts.reduce((b, q) => (Math.abs(q.x - vx) < Math.abs(b.x - vx) ? q : b));
      focus.setAttribute('cx', p.x); focus.setAttribute('cy', p.y); focus.setAttribute('visibility', 'visible');
      cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x); cross.setAttribute('visibility', 'visible');
      tip.innerHTML = p.label;
      tip.style.left = `${Math.min(80, Math.max(20, (p.x / W) * 100))}%`;
      tip.style.top = `${(p.y / H) * 100 - 4}%`;
      tip.classList.remove('hidden');
    };
    svg.addEventListener('pointermove', show);
    svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointerleave', (e) => {
      if (e.pointerType !== 'mouse') return; // keep the tooltip on touch
      tip.classList.add('hidden'); focus.setAttribute('visibility', 'hidden'); cross.setAttribute('visibility', 'hidden');
    });
  });
  document.querySelectorAll('[data-chart=bars] [data-action=bar]').forEach((b) =>
    b.addEventListener('pointerenter', () => b.click()));
}

function addFromLibrary() {
  const owned = ownedNames();
  let added = 0;
  lib.picked.forEach((weight, idx) => {
    const item = LIBRARY[idx];
    if (owned.has(item.name.toLowerCase())) return;
    const w = parseFloat(weight);
    state.exercises.push({
      id: uid(), ...item, muscles: { ...item.muscles }, machineStep: lib.step,
      startWeight: Number.isFinite(w) && w >= 0 ? w : item.startWeight,
    });
    added++;
  });
  lib = { query: '', eq: '', muscle: '', step: lib.step, picked: new Map() };
  modal = null;
  saveState();
  render();
  toast(`Added ${added} exercise${added === 1 ? '' : 's'}`);

function swapModal() {
  const entry = state.draft?.entries[modal.e];
  const cur = entry && exById(entry.exerciseId);
  if (!cur) return `${modalHead('Swap exercise')}<p class="muted">That exercise is no longer in this workout.</p>`;
  const inDraft = new Set(state.draft.entries.map((x) => x.exerciseId));
  const overlap = (ex) => sum(Object.entries(ex.muscles || {}).map(([m, f]) => Math.min(f, cur.muscles?.[m] || 0)));
  const options = state.exercises.filter((ex) => !inDraft.has(ex.id))
    .map((ex) => ({ ex, score: overlap(ex) }))
    .sort((a, b) => b.score - a.score || a.ex.name.localeCompare(b.ex.name));
  return `${modalHead(`Swap ${esc(cur.name)}`)}
    <p class="-mt-1 mb-2 text-sm muted">Machine taken? Pick a replacement for this workout. Your routine stays the same.</p>
    ${options.length ? `<ul class="divide-y divide-slate-200 dark:divide-slate-800">${options.map(({ ex, score }) => {
      const p = predict(ex);
      return `<li><button class="flex w-full items-center justify-between gap-3 py-2.5 text-left" data-action="swap-to" data-id="${ex.id}">
        <span class="min-w-0">

}

function clockText(d) {
  const mins = Math.max(0, Math.floor((Date.now() - d.startedAt) / 60000));
  return `⏱ ${mins < 60 ? `${mins} min` : `${Math.floor(mins / 60)} h ${mins % 60} min`}`;
}

  const el = document.getElementById('workout-clock');

const productFood = (r) => ({
  id: `off:${r[0]}`, src: 'off', code: r[0], name: r[1], brand: r[2],
  n: { kcal: r[3], protein: r[4], carbs: r[5], sugar: r[6], fat: r[7], satfat: r[8], fibre: r[9], salt: r[10] },
  portions: r[11] > 0 ? [{ label: '1 serving', g: r[11] }] : [],
});
const cofidFood = (r) => ({
  id: `cofid:${r[0]}`, src: 'cofid', name: r[1], brand: '',
  n: { kcal: r[2], protein: r[3], carbs: r[4], sugar: r[5], fat: r[6], satfat: r[7], fibre: r[8], salt: r[9] },
  portions: [],
});

function offlineFood(id) {
  const [, src, code] = id.match(/^([a-z]+):(.*)$/) || [];
  if (src === 'off' && foodData.byCode?.has(code)) return productFood(foodData.products.rows[foodData.byCode.get(code)]);
  const row = src === 'cofid' && foodData.cofid?.rows.find((r) => r[0] === code);
  return row ? cofidFood(row) : null;
}

/** Search a prebuilt lowercase index; earlier rows (more popular) win ties. */
function searchIndex(index, rows, q, limit, toFood) {
  const words = q.split(/\s+/).filter(Boolean);
  const hits = [];
  for (let i = 0; i < index.length && hits.length < 300; i++) {
    if (words.every((w) => index[i].includes(w))) hits.push(i);
  }
  const starts = (i) => (index[i].startsWith(words[0]) ? 0 : 1);
  return hits.sort((a, b) => starts(a) - starts(b) || a - b).slice(0, limit).map((i) => toFood(rows[i]));
}

/** Nutrients for a given weight of a food (per-100 g values scaled). */
function scaleN(n, grams) {
  const out = {};
  NKEYS.forEach((k) => (out[k] = round1(((n[k] || 0) * grams) / 100)));
  out.kcal = Math.round(((n.kcal || 0) * grams) / 100);
  return out;
}

function dayTotals(date, meal) {
  const t = Object.fromEntries(NKEYS.map((k) => [k, 0]));
  dayEntries(date).filter((e) => !meal || e.meal === meal).forEach((e) => NKEYS.forEach((k) => (t[k] += e.n[k] || 0)));
  NKEYS.forEach((k) => (t[k] = round1(t[k])));
  return t;
}

/**
 * Daily targets: Mifflin-St Jeor BMR × activity, adjusted for the goal.
 * Protein first (g per kg), fat at least 25% of calories, carbs fill the rest.
 */
function calcTargets(p) {
  const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'female' ? -161 : 5);
  const delta = (GOALS.find((g) => g[0] === p.goal) || GOALS[2])[1];
  const kcal = Math.max(p.sex === 'female' ? 1200 : 1500, Math.round((bmr * p.activity + delta) / 10) * 10);
  const protein = Math.round(((p.goal.startsWith('lose') ? 2 : 1.8) * p.weight) / 5) * 5;
  const fat = Math.max(Math.round((kcal * 0.25) / 9), Math.round(0.6 * p.weight));
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return { kcal, protein, carbs, fat, ...fixedTargets(kcal) };
}
const fixedTargets = (kcal) => ({ fibre: 30, sugar: 90, satfat: Math.round((kcal * 0.11) / 9), salt: 6 });

function recentFoodIds() {
  const ids = [];
  Object.keys(state.food.log).sort().reverse().forEach((d) =>
    [...state.food.log[d]].reverse().forEach((e) => { if (e.foodId && !ids.includes(e.foodId) && foodById(e.foodId)) ids.push(e.foodId); }));
  return ids.slice(0, 15);
}

const amountLabel = (e) => (!e.foodId ? '' : e.unit === 'g' ? `${fmt(e.qty)} g` : `${fmt(e.qty)} × ${e.unit.replace(/^1 /, '')} (${fmt(e.g)} g)`);

// ----- Weight trend, weekly check-in, training days -----
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const KCAL_PER_KG = 7700;

/** Weigh-ins smoothed into a trend (exponential moving average, 10% per day). */
function weightSeries() {
  let trend = null, prev = null;
  return Object.keys(state.food.weights).sort().map((date) => {
    const kg = state.food.weights[date];
    trend = trend === null ? kg : trend + (1 - 0.9 ** Math.max(1, daysBetween(prev, date))) * (kg - trend);
    prev = date;
    return { date, kg, trend: round2(trend) };
  });
}

/** Trend change in kg per week over (up to) the last 14 days of the series. */
function weeklyRate(series) {
  if (series.length < 2) return null;
  const last = series[series.length - 1];
  const first = series.find((p) => daysBetween(p.date, last.date) <= 14);
  const days = daysBetween(first.date, last.date);
  return days >= 6 ? ((last.trend - first.trend) / days) * 7 : null;
}

/**
 * Weekly check-in: estimate real maintenance calories from the last 3 weeks
 * of logged food and the weight trend, then suggest a target for the goal.
 * Days with under 800 kcal logged are treated as incomplete and skipped.
 */
function checkinEstimate() {
  const t = state.food.targets, p = state.food.profile;
  if (!t || !p) return null;
  const end = addDays(todayISO(), -1), start = addDays(end, -20);
  const intakes = [];
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const kcal = dayTotals(d).kcal;
    if (kcal >= 800) intakes.push(kcal);
  }
  const pts = weightSeries().filter((w) => w.date >= start);
  if (intakes.length < 10 || pts.length < 4) return null;
  const span = daysBetween(pts[0].date, pts[pts.length - 1].date);
  if (span < 10) return null;
  const kgPerDay = (pts[pts.length - 1].trend - pts[0].trend) / span;
  const avg = Math.round(sum(intakes) / intakes.length);
  const tdee = Math.round(avg - kgPerDay * KCAL_PER_KG);
  const delta = (GOALS.find((g) => g[0] === p.goal) || GOALS[2])[1];
  const ideal = Math.round((tdee + delta) / 10) * 10;
  const target = Math.max(p.sex === 'female' ? 1200 : 1500, Math.min(t.kcal + 200, Math.max(t.kcal - 200, ideal)));
  return { avg, days: intakes.length, span, kgPerWeek: kgPerDay * 7, tdee, target, current: t.kcal };
}

function checkinDue() {
  const last = state.food.checkins[state.food.checkins.length - 1];
  return last && daysBetween(last.date, todayISO()) < 7 ? null : checkinEstimate();
}

function applyCheckin(accept) {
  const est = checkinEstimate(), t = state.food.targets;
  if (!est) return;
  state.food.checkins.push({ date: todayISO(), tdee: est.tdee, from: t.kcal, to: accept ? est.target : t.kcal });
  if (accept && est.target !== t.kcal) {
    // Keep protein and fat; the change goes into carbs.
    Object.assign(t, { carbs: Math.max(0, t.carbs + Math.round((est.target - t.kcal) / 4)), kcal: est.target }, fixedTargets(est.target));
  }
  const series = weightSeries();
  if (series.length) state.food.profile.weight = round1(series[series.length - 1].trend);
}

const trainingDaysPerWeek = () => DAYS.filter((_, i) => routineById(state.schedule.weekly[i])).length;

/**
 * Training days sit `gap` kcal above rest days, split around the normal
 * target so the weekly total is unchanged (e.g. 2,300 with 3 training days
 * and a 200 gap → ~2,414 training, ~2,214 rest).
 */
function trainingShift(gap, n) {
  return { training: Math.round((gap * (7 - n)) / 7), rest: -Math.round((gap * n) / 7) };
}

/** Targets for a date: calories (as carbs) shift from rest days to training days; the weekly total is unchanged. */
function targetsFor(date) {
  const t = state.food.targets;
  if (!t) return null;
  const n = trainingDaysPerWeek(), pr = state.food.prefs;
  if (!pr.trainingOn || n === 0 || n === 7) return { ...t, dayType: null, dayDelta: 0 };
  const training = !!plannedRoutine(date) || state.history.some((h) => h.date === date);
  const d = trainingShift(pr.trainingGap, n)[training ? 'training' : 'rest'];
  return { ...t, kcal: t.kcal + d, carbs: Math.max(0, t.carbs + Math.round(d / 4)), dayType: training ? 'training' : 'rest', dayDelta: d };
}

// ----- Food tab -----
function foodView() {
  const today = todayISO();
  const t = state.food.targets;
  const title = foodDate === today ? 'Today' : foodDate === addDays(today, -1) ? 'Yesterday' : fmtDay(foodDate);
  let html = `<div class="mb-4 flex items-center justify-between">
    <button class="icon-btn text-2xl" data-food="date" data-dir="-1" aria-label="Previous day">‹</button>
    <div class="text-center">
      <h2 class="text-xl font-bold">${title}</h2>
      ${foodDate !== today ? `<button class="link text-xs" data-food="date" data-dir="0">Back to today</button>` : `<p class="text-xs muted">${fmtDay(today)}</p>`}
    </div>
    <button class="icon-btn text-2xl" data-food="date" data-dir="1" ${foodDate >= today ? 'disabled' : ''} aria-label="Next day">›</button>
  </div>`;

  html += checkinCard();
  const tf = targetsFor(foodDate);
  if (tf?.dayType) html += `<p class="-mt-1 mb-2 text-center"><span class="badge bg-indigo-500/15 text-indigo-700 dark:text-indigo-300">${tf.dayType === 'training' ? 'Training day' : 'Rest day'} · ${tf.dayDelta > 0 ? '+' : ''}${tf.dayDelta} kcal</span></p>`;
  html += t ? foodSummary(dayTotals(foodDate), tf) : `<section class="card mb-4 border-indigo-500 dark:border-indigo-500">
    <h3 class="font-semibold">Set your daily targets</h3>
    <p class="mt-1 text-sm muted">Enter a few details and the app works out calories and macros for your goal.</p>
    <button class="btn-primary mt-3 w-full" data-food="setup">Set up targets</button>
  </section>`;

  html += MEALS.map(mealCard).join('');
  html += waterCard() + weightCard();
  html += `<button class="btn-ghost mt-2 w-full" data-food="setup">Targets &amp; profile</button>
  <p class="mt-4 text-center text-[11px] leading-relaxed muted">Product data © <a class="underline" href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a> contributors (ODbL).
  UK reference data: McCance and Widdowson’s Composition of Foods Integrated Dataset, Office for Health Improvement and Disparities (Open Government Licence).</p>`;
  return html;
}

function foodSummary(tot, t) {
  const left = Math.round(t.kcal - tot.kcal);
  const R = 42, C = 2 * Math.PI * R;
  const pct = Math.min(1, tot.kcal / t.kcal);
  const bar = (k, label) => {
    const v = tot[k], target = t[k];
    return `<div>
      <div class="flex items-baseline justify-between text-sm"><span class="font-medium">${label}</span><span class="tabular-nums"><b>${Math.round(v)}</b><span class="muted"> / ${target} g</span></span></div>
      <div class="mt-1 h-2 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-800"><div class="h-full rounded-full bg-indigo-500" style="width:${Math.min(100, (v / target) * 100)}%"></div></div>
    </div>`;
  };
  const small = NUTRIENTS.slice(4).map(([k, label, kind]) => {
    const v = tot[k], target = t[k];
    const over = kind === 'max' && v > target;
    return `<div class="rounded-xl bg-slate-100 px-2 py-2 text-center dark:bg-slate-800/60">
      <p class="text-[11px] font-semibold uppercase tracking-wide muted">${label}</p>
      <p class="font-bold tabular-nums ${over ? 'text-rose-600 dark:text-rose-400' : ''}">${fmt(v)} g</p>
      <p class="text-[10px] muted">${kind === 'max' ? `${over ? 'over ' : ''}max ${target}` : `aim ${target}+`}</p>
    </div>`;
  }).join('');
  return `<section class="card mb-4">
    <div class="flex items-center gap-4">
      <div class="relative h-32 w-32 shrink-0">
        <svg viewBox="0 0 100 100" class="h-full w-full -rotate-90">
          <circle cx="50" cy="50" r="${R}" fill="none" stroke-width="9" class="stroke-slate-200 dark:stroke-slate-800"/>
          <circle cx="50" cy="50" r="${R}" fill="none" stroke-width="9" stroke-linecap="round" stroke="${left < 0 ? '#f43f5e' : '#6366f1'}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="text-2xl font-extrabold tabular-nums">${fmtKg(Math.abs(left))}</span>
          <span class="text-xs font-semibold ${left < 0 ? 'text-rose-600 dark:text-rose-400' : 'muted'}">kcal ${left < 0 ? 'over' : 'left'}</span>
        </div>
      </div>
      <div class="min-w-0 flex-1 space-y-2.5">
        <p class="text-sm muted"><b class="text-slate-900 dark:text-slate-100">${fmtKg(tot.kcal)}</b> eaten of ${fmtKg(t.kcal)}</p>
        ${bar('protein', 'Protein')}${bar('carbs', 'Carbs')}${bar('fat', 'Fat')}
      </div>
    </div>
    <div class="mt-4 grid grid-cols-4 gap-2">${small}</div>
  </section>`;
}

function checkinCard() {
  const est = foodDate === todayISO() && checkinDue();
  if (!est) return '';
  const change = est.target - est.current;
  const sign = (v) => (v > 0 ? '+' : '');
  return `<section class="card mb-4 border-indigo-500 dark:border-indigo-500">
    <p class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-300">Weekly check-in</p>
    <p class="mt-1 text-sm">Over the last ${est.span} days your trend weight moved <b>${sign(est.kgPerWeek)}${fmt(round2(est.kgPerWeek))} kg a week</b> while you averaged <b>${fmtKg(est.avg)} kcal</b> (${est.days} logged days).</p>
    <p class="mt-1 text-sm">That puts your real maintenance at about <b>${fmtKg(est.tdee)} kcal</b>.</p>
    ${Math.abs(change) >= 30 ? `<p class="mt-2 font-semibold">Suggested target: ${fmtKg(est.target)} kcal <span class="text-sm font-normal muted">(now ${fmtKg(est.current)}, ${sign(change)}${change})</span></p>
      <p class="text-xs muted">Changes are capped at 200 kcal a week. Protein and fat stay the same; carbs adjust.</p>
      <div class="mt-3 grid grid-cols-2 gap-2">
        <button class="btn-ghost py-2" data-food="checkin" data-accept="0">Keep current</button>
        <button class="btn-primary py-2" data-food="checkin" data-accept="1">Update target</button>
      </div>`
      : `<p class="mt-2 font-semibold">You’re on track. Keep ${fmtKg(est.current)} kcal.</p>
      <button class="btn-primary mt-3 w-full py-2" data-food="checkin" data-accept="0">Got it</button>`}
  </section>`;
}

function waterCard() {
  const ml = state.food.water[foodDate] || 0, target = state.food.prefs.water;
  return `<section class="card mb-3">
    <div class="flex items-center justify-between">

    <div class="mt-3 grid grid-cols-3 gap-2">

      <button class="btn-ghost px-2 py-2 text-sm" data-food="water" data-ml="500">+500 ml</button>

}

function weightCard() {
  const series = weightSeries().filter((p) => p.date <= foodDate);
  const logged = state.food.weights[foodDate];
  const last = series[series.length - 1];
  const rate = weeklyRate(series);
  return `<section class="card mb-3">
    <div class="flex items-center justify-between">
      <h3 class="font-semibold">Weight</h3>
      ${series.length ? '<button class="link" data-food="weight-view">Trend &amp; history</button>' : ''}
    </div>
    ${last ? `<p class="mt-1 text-sm"><span class="muted">Trend</span> <b class="tabular-nums">${fmt(round1(last.trend))} kg</b>${rate !== null ? `<span class="muted"> · ${rate > 0 ? '+' : ''}${fmt(round2(rate))} kg a week</span>` : ''}</p>`
      : '<p class="mt-1 text-sm muted">Weigh in most mornings, after the toilet and before eating. The trend line smooths out day-to-day water swings, and after ~2 weeks of weigh-ins and food logging you’ll get weekly target check-ins.</p>'}
    <div class="mt-3 flex gap-2">

    </div>
  </section>`;
}

function weightModal() {

/** Weigh-in dots plus the trend line, with a tap/hover readout. */
function weightChart(pts) {
  const W = 340, H = 170, pl = 36, pr = 10, pt = 10, pb = 22;
  const vals = pts.flatMap((p) => [p.kg, p.trend]);
  const pad = Math.max(0.5, (Math.max(...vals) - Math.min(...vals)) * 0.15);
  const lo = Math.floor((Math.min(...vals) - pad) * 2) / 2, hi = Math.ceil((Math.max(...vals) + pad) * 2) / 2;
  const t0 = parseISO(pts[0].date).getTime(), t1 = parseISO(pts[pts.length - 1].date).getTime();
  const x = (d) => round2(pl + (t1 === t0 ? (W - pl - pr) / 2 : ((parseISO(d).getTime() - t0) / (t1 - t0)) * (W - pl - pr)));
  const y = (v) => round2(pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb));
  const ticks = [lo, (lo + hi) / 2, hi].map(round1);
  const xy = pts.map((p) => ({ x: x(p.date), label: `${fmtDay(p.date)}: <b>${fmt(p.kg)} kg</b> <span class="muted">· trend ${fmt(round1(p.trend))} kg</span>` }));
  return `<div data-chart="weight" data-points="${esc(JSON.stringify(xy))}">
    <div class="mb-1 flex items-center gap-4 text-xs muted">
      <span class="flex items-center gap-1.5"><span class="inline-block h-2 w-2 rounded-full bg-slate-400"></span>Daily weigh-in</span>
      <span class="flex items-center gap-1.5"><span class="inline-block h-0.5 w-4 rounded bg-indigo-500"></span>Trend</span>
    </div>
    <p class="mb-1 text-sm" data-readout>${xy[xy.length - 1].label}</p>
    <svg viewBox="0 0 ${W} ${H}" class="h-auto w-full touch-none select-none overflow-visible" role="img" aria-label="Weight trend chart">
      ${ticks.map((v) => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="stroke-slate-200 dark:stroke-slate-800" stroke-width="1"/>
        <text x="${pl - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" class="fill-slate-500 dark:fill-slate-400">${fmt(v)}</text>`).join('')}
      <text x="${pl}" y="${H - 6}" font-size="10" class="fill-slate-500 dark:fill-slate-400">${fmtShort(pts[0].date)}</text>
      <text x="${W - pr}" y="${H - 6}" font-size="10" text-anchor="end" class="fill-slate-500 dark:fill-slate-400">${fmtShort(pts[pts.length - 1].date)}</text>
      <line data-cross x1="0" x2="0" y1="${pt}" y2="${H - pb}" class="stroke-slate-400 dark:stroke-slate-500" stroke-width="1" visibility="hidden"/>
      ${pts.map((p) => `<circle cx="${x(p.date)}" cy="${y(p.kg)}" r="3" class="fill-slate-400 dark:fill-slate-500"/>`).join('')}
      <path d="${pts.map((p, k) => `${k ? 'L' : 'M'}${x(p.date)},${y(p.trend)}`).join(' ')}" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
  </div>`;
}

function attachWeightChart() {
  const wrap = document.querySelector('[data-chart=weight]');
  if (!wrap) return;
  const pts = JSON.parse(wrap.dataset.points);
  const svg = wrap.querySelector('svg'), out = wrap.querySelector('[data-readout]'), cross = svg.querySelector('[data-cross]');
  const show = (e) => {
    const r = svg.getBoundingClientRect();
    const vx = ((e.clientX - r.left) / r.width) * 340;
    const p = pts.reduce((b, q) => (Math.abs(q.x - vx) < Math.abs(b.x - vx) ? q : b));
    out.innerHTML = p.label;
    cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x); cross.setAttribute('visibility', 'visible');
  };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
}

function mealCard([key, label]) {

  return `<section class="card mb-3">
    <div class="flex items-center justify-between">
      <h3 class="font-semibold">${label}</h3>
      <span class="text-sm font-semibold tabular-nums">${fmtKg(sum(entries.map((e) => e.n.kcal)))} kcal</span>
    </div>
    ${entries.length ? `<ul class="mt-1 divide-y divide-slate-200 dark:divide-slate-800">${entries.map((e) => `<li>
      <button class="flex w-full items-center justify-between gap-3 py-2 text-left" data-food="edit" data-id="${e.id}">
        <span class="min-w-0">
          <span class="block truncate font-medium">${esc(e.name)}</span>
          <span class="block truncate text-xs muted">${e.foodId ? `${esc(amountLabel(e))} · ` : ''}P ${fmt(e.n.protein)} · C ${fmt(e.n.carbs)} · F ${fmt(e.n.fat)}</span>
        </span>
        <span class="shrink-0 font-semibold tabular-nums">${e.n.kcal}</span>
      </button>
    </li>`).join('')}</ul>` : ''}
    <div class="mt-2 flex flex-wrap gap-x-4 gap-y-1">

const listSection = (title, foods) => (foods.length ? `<h4 class="mt-3 text-xs font-bold uppercase tracking-wide muted">${title}</h4>
  <ul class="divide-y divide-slate-200 dark:divide-slate-800">${foods.map(foodRow).join('')}</ul>` : '');

function matchFoods(foods, q) {
  const words = q.split(/\s+/).filter(Boolean);
  return foods
    .filter((f) => { const s = `${f.name} ${f.brand || ''}`.toLowerCase(); return words.every((w) => s.includes(w)); })
    .sort((a, b) => (b.name.toLowerCase().startsWith(words[0]) - a.name.toLowerCase().startsWith(words[0])) || a.name.length - b.name.length);
}

function foodResults() {
  const q = modal.query.trim().toLowerCase();
  const mine = Object.values(state.food.foods);
  if (!q) {
    const favs = state.food.favs.map(foodById).filter(Boolean);
    const recent = recentFoodIds().filter((id) => !state.food.favs.includes(id)).map(foodById);
    const custom = mine.filter((f) => (f.src === 'custom' || f.src === 'recipe') && !state.food.favs.includes(f.id));
    const html = (modal.target === 'recipe' ? '' : savedMealsSection(state.food.meals)) +
      listSection('★ Favourites', favs) + listSection('Recent', recent) + listSection('My foods &amp; recipes', custom);
    return html || `<p class="rounded-xl bg-slate-100 p-4 text-sm muted dark:bg-slate-800/60">Search for a food, or scan a barcode. Foods you log will appear here for quick re-adding.</p>`;
  }
  const off = modal.off;
  let offHtml;
  if (off.q === q && off.state === 'done') {
    offHtml = off.items.length ? listSection('UK shops &amp; brands', off.items) : '<p class="mt-3 text-sm muted">No UK products found. Try fewer words, or scan the barcode.</p>';
  } else if (off.q === q && off.state === 'loading') {
    offHtml = `<p class="mt-3 text-sm muted">${off.retrying ? 'Food database is busy, retrying in a few seconds…' : 'Searching UK products…'}</p>`;
  } else {
    offHtml = `${off.q === q && off.state === 'error' ? `<p class="mt-3 text-sm text-rose-600 dark:text-rose-400">The food database is busy (it limits how often you can search). Wait a minute and try again, or scan the barcode instead.</p><p class="mt-1 text-xs muted">Details: ${esc(off.reason || '')}</p>` : ''}
      <button class="btn-ghost mt-3 w-full py-2.5 text-sm" data-food="off-search">Search UK shops &amp; brands for “${esc(modal.query.trim())}”</button>`;
  }
  let local = '';
  if (foodData.products) {
    const items = searchIndex(foodData.productIndex, foodData.products.rows, q, 25, productFood);
    local += items.length ? listSection('UK shops &amp; brands', items) : '<p class="mt-3 text-sm muted">No UK products match. Try fewer words, search online, or scan the barcode.</p>';
    if (!(off.q === q && off.state === 'done')) offHtml = offHtml.replace(/Search UK shops &amp; brands for/, 'Not here? Search online for');
    else offHtml = offHtml.replace('UK shops &amp; brands', 'More from Open Food Facts (online)');
  }
  if (foodData.cofid) local += listSection('UK government data', searchIndex(foodData.cofidIndex, foodData.cofid.rows, q, 10, cofidFood));
  const meals = modal.target === 'recipe' ? [] : state.food.meals.filter((sm) => q.split(/\s+/).every((w) => sm.name.toLowerCase().includes(w)));
  return savedMealsSection(meals) + listSection('Your foods', matchFoods(mine, q).slice(0, 8)) + listSection('UK basics', matchFoods(UK_FOODS, q).slice(0, foodData.products ? 6 : 15)) + local + offHtml;
}
